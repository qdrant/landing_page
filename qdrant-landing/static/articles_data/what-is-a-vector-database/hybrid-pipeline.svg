<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="description">
  <desc id="description">A query enters Qdrant, which runs a sparse prefetch search and a dense prefetch search, merges the two result lists with Reciprocal Rank Fusion, and returns one list of results.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#656b7f"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="639" height="279" rx="6" fill="#f0f3fa" stroke="#d3d9eb" stroke-width="1"/>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="20" y="116" width="88" height="48" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="64" y="145" font-size="14" text-anchor="middle" fill="#303547">Query</text>

    <rect x="138" y="20" width="356" height="240" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="154" y="44" font-size="14" fill="#303547" font-weight="600">Qdrant Query API</text>

    <rect x="160" y="64" width="150" height="56" rx="6" fill="none" stroke="#00838f" stroke-width="1.5"/>
    <text x="235" y="88" font-size="14" text-anchor="middle" fill="#303547">Sparse search</text>
    <text x="235" y="108" font-size="12" text-anchor="middle" fill="#656b7f">prefetch</text>

    <rect x="160" y="184" width="150" height="56" rx="6" fill="none" stroke="#6047ff" stroke-width="1.5"/>
    <text x="235" y="208" font-size="14" text-anchor="middle" fill="#303547">Dense search</text>
    <text x="235" y="228" font-size="12" text-anchor="middle" fill="#656b7f">prefetch</text>

    <rect x="354" y="116" width="120" height="48" rx="6" fill="none" stroke="#dc244c" stroke-width="1.5"/>
    <text x="414" y="145" font-size="14" text-anchor="middle" fill="#303547">RRF fusion</text>

    <rect x="526" y="116" width="94" height="48" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="573" y="145" font-size="14" text-anchor="middle" fill="#303547">Results</text>

    <path d="M108 140 H122 V92 H156" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M122 140 V212 H156" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M310 92 H332 V132 H350" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M310 212 H332 V148 H350" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="474" y1="140" x2="522" y2="140" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
</svg>
