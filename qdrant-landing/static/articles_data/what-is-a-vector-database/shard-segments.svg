<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 228" role="img" aria-labelledby="description">
  <desc id="description">A collection contains two shards, and each shard is divided into three segments. Each segment stores a subset of the shard's vectors and payloads.</desc>
