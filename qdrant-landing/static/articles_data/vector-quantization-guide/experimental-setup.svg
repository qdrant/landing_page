<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -16 800 456" width="800" height="456" role="img" aria-labelledby="t3 d3">
  <title id="t3">Experimental setup of the quantization benchmark</title>
  <desc id="d3">Four BEIR corpora with their document counts, words per document, and float32 storage at 1,024 dimensions: SciFact 5,183 documents and 21 MB, NFCorpus 3,633 and 15 MB, FiQA 57,638 and 236 MB, Quora 522,931 and 2,142 MB. Vectors come from Cohere embed-english-v3.0 or BGE-small-en-v1.5, are indexed in Qdrant v1.19.2 as float32 HNSW, scalar int8, TurboQuant 4-bit, product x8, and binary 1-bit, and are scored on recall at 10, nDCG at 10, latency, throughput, and heap memory.</desc>
  <style>
    text { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 14px; }
    .qset-h, .qset-sub { fill: #656b7f; }
    .qset-name, .qset-box-title { fill: #303547; font-weight: 600; }
    .qset-num, .qset-line { fill: #303547; }
    .qset-line--strong { font-weight: 600; }
    .qset-bar { fill: #6047ff; }
    .qset-hit { fill: transparent; }
    .qi-axis { stroke: #abb1c7; stroke-width: 1.5; }
    .qi-frame { fill: #f0f3fa; stroke: #d3d9eb; stroke-width: 1; }
    .qset-arrow { stroke: #abb1c7; stroke-width: 2; }
    .qset-arrowhead { fill: #abb1c7; }
  </style>
  <rect x="-20" y="-16" width="800" height="456" fill="#FFFFFF" rx="12"/>
  <text class="qset-h" x="0" y="20">Corpus</text><text class="qset-h" x="246" y="20" text-anchor="end">documents</text><text class="qset-h" x="330" y="20" text-anchor="end">words/doc</text><text class="qset-h" x="372" y="20">float32 originals, 1,024-d</text><line class="qi-axis" x1="0" y1="28" x2="760" y2="28"/><g class="qset-row" data-corpus="scifact"><rect class="qset-hit" x="-6" y="34" width="772" height="42" rx="6"/><text class="qset-name" x="0" y="50">SciFact</text><text class="qset-sub" x="0" y="68">claim → abstract</text><text class="qset-num" x="246" y="50" text-anchor="end">5,183</text><text class="qset-num" x="330" y="50" text-anchor="end">214</text><rect class="qset-bar" x="372" y="40" width="2.6" height="14" rx="2"/><text class="qset-num" x="382.6" y="52">21 MB</text></g><g class="qset-row" data-corpus="nfcorpus"><rect class="qset-hit" x="-6" y="80" width="772" height="42" rx="6"/><text class="qset-name" x="0" y="96">NFCorpus</text><text class="qset-sub" x="0" y="114">topic → PubMed paper</text><text class="qset-num" x="246" y="96" text-anchor="end">3,633</text><text class="qset-num" x="330" y="96" text-anchor="end">232</text><rect class="qset-bar" x="372" y="86" width="2.0" height="14" rx="2"/><text class="qset-num" x="382.0" y="98">15 MB</text></g><g class="qset-row" data-corpus="fiqa"><rect class="qset-hit" x="-6" y="126" width="772" height="42" rx="6"/><text class="qset-name" x="0" y="142">FiQA</text><text class="qset-sub" x="0" y="160">question → forum post</text><text class="qset-num" x="246" y="142" text-anchor="end">57,638</text><text class="qset-num" x="330" y="142" text-anchor="end">132</text><rect class="qset-bar" x="372" y="132" width="28.9" height="14" rx="2"/><text class="qset-num" x="408.9" y="144">236 MB</text></g><g class="qset-row" data-corpus="quora"><rect class="qset-hit" x="-6" y="172" width="772" height="42" rx="6"/><text class="qset-name" x="0" y="188">Quora</text><text class="qset-sub" x="0" y="206">question → question</text><text class="qset-num" x="246" y="188" text-anchor="end">522,931</text><text class="qset-num" x="330" y="188" text-anchor="end">11</text><rect class="qset-bar" x="372" y="178" width="262.0" height="14" rx="2"/><text class="qset-num" x="642.0" y="190">2,142 MB</text></g><rect class="qi-frame" x="0" y="248" width="190" height="142" rx="6"/><text class="qset-box-title" x="14" y="274">Embed</text><text class="qset-line qset-line--strong" x="14" y="298">Cohere</text><text class="qset-line" x="14" y="317">embed-english-v3.0</text><text class="qset-line" x="14" y="336">1,024 dimensions</text><text class="qset-line" x="14" y="355">vectors supplied</text><rect class="qi-frame" x="230" y="248" width="206" height="142" rx="6"/><text class="qset-box-title" x="244" y="274">Qdrant v1.19.2</text><text class="qset-line" x="244" y="298">float32 HNSW</text><text class="qset-line" x="244" y="317">scalar int8 · 4×</text><text class="qset-line" x="244" y="336">TurboQuant 4-bit · 8×</text><text class="qset-line" x="244" y="355">product x8 · 8×</text><text class="qset-line" x="244" y="374">binary 1-bit · 32×</text><rect class="qi-frame" x="476" y="248" width="284" height="142" rx="6"/><text class="qset-box-title" x="490" y="274">Record</text><text class="qset-line" x="490" y="298">recall@10 vs exact float32</text><text class="qset-line" x="490" y="317">nDCG@10 vs BEIR judgments</text><text class="qset-line" x="490" y="336">server p95 and QPS</text><text class="qset-line" x="490" y="355">heap after indexing</text><line class="qset-arrow" x1="196" y1="319" x2="220" y2="319"/><polygon class="qset-arrowhead" points="226,319 218,314 218,324"/><line class="qset-arrow" x1="442" y1="319" x2="466" y2="319"/><polygon class="qset-arrowhead" points="472,319 464,314 464,324"/><text class="qset-sub" x="0" y="420">50 development queries tune each setting. 150 held-out test queries report it.</text>
</svg>
