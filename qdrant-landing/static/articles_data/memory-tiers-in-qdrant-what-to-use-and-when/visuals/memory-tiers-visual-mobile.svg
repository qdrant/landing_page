<circle cx="194.0" cy="652" r="7" fill="#00838f"/>
<circle cx="222.0" cy="644" r="7" fill="#00838f"/>
<circle cx="238.0" cy="662" r="7" fill="#00838f"/>
<circle cx="270.0" cy="666" r="7" fill="#00838f"/>
<circle cx="300.0" cy="654" r="7" fill="#00838f"/>
<rect x="125.0" y="696" width="134.0" height="34" rx="17.0" fill="#b2ebf2"/><text x="192.0" y="720.0" text-anchor="middle" style="font-size:20px;fill:#303547">fixed RAM</text>
<rect x="269.0" y="696" width="110.0" height="34" rx="17.0" fill="#b2ebf2"/><text x="324.0" y="720.0" text-anchor="middle" style="font-size:20px;fill:#303547">fastest</text>
</svg>
