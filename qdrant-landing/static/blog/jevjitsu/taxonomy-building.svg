<svg xmlns="http://www.w3.org/2000/svg" width="420" height="900" viewBox="0 0 420 900" role="img" aria-labelledby="t d">
<title id="t">How Jev builds a taxonomy from a collection</title>
<desc id="d">Four steps. One: similar products are grouped, for example women's long-sleeve T-shirt, puff-sleeve blouse, and metallic catsuit plus 152 more products, or photo album, album cover, and 2020 calendar plus 42 more products. Two: an LLM suggests a name for each group, women's clothing and Greeting Cards. Three: Jev checks whether the name fits the products. Women's clothing fits 14 of 15 and is kept. Greeting Cards fits 4 of 15 and is dropped. Four: what fits becomes the taxonomy, with Clothing and Apparel containing women's clothing, men's clothing, children's apparel, and Women's Dresses, plus 20 more broad categories.</desc>
