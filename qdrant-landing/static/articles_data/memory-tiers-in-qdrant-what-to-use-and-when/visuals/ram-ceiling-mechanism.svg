<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-labelledby="t d">
<title id="t">Working set as a share of cluster RAM</title>
<desc id="d">Conceptual line. A caching configuration's working set climbs toward 100% of cluster RAM as the collection scales and loses its safe margin, then drops back to a safe share once the cluster RAM is upgraded, and keeps growing safely.</desc>
<style>
  text { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #303547; }
  .title { font-size: 23px; font-weight: 600; }
  .head { font-size: 21px; font-weight: 600; }
  .label { font-size: 21px; }
  .small { font-size: 20px; }
  .note { font-size: 19px; fill: #656b7f; }
  .muted { fill: #656b7f; }
  .axis { stroke: #abb1c7; stroke-width: 1.5; fill: none; }
</style>
<rect x="0.5" y="0.5" width="959" height="529" rx="12" fill="#f0f3fa" stroke="#d3d9eb"/>
<text class="title" x="40" y="46">Working set as a share of cluster RAM, as a collection scales</text>
<text class="note" x="40" y="74">conceptual, not to scale</text>
<rect x="111" y="120" width="809" height="64" fill="#ffb2b7" opacity="0.35"/>
<line x1="111" x2="920" y1="150" y2="150" stroke="#dc244c" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="note" x="912" y="142" text-anchor="end">100% of cluster RAM</text>
<line x1="523" x2="523" y1="120" y2="470" stroke="#656b7f" stroke-width="1.5" stroke-dasharray="4 5"/>
<text class="note" x="531" y="458">cluster RAM upgraded here</text>
<path d="M110 110 V470 H920" class="axis"/>
<path d="M110 375 C 220 330, 300 300, 360 270 S 470 180, 523 152" fill="none" stroke="#9c27b0" stroke-width="3"/>
<path d="M539 256 C 545 340, 560 360, 590 358 C 640 355, 650 330, 740 320 S 860 290, 920 285" fill="none" stroke="#9c27b0" stroke-width="3"/>
<circle cx="523" cy="152" r="8" fill="#dc244c"/>
<line x1="448" x2="512" y1="167" y2="155" stroke="#dc244c" stroke-width="1.5"/>
<text class="note" x="440" y="174" text-anchor="end" style="fill:#9e0d38;font-weight:600">safe margin gone</text>
<circle cx="539" cy="256" r="8" fill="#9c27b0"/>
<text class="note" x="555" y="252" style="fill:#6a1b9a;font-weight:600">recovers once RAM grows</text>
<text class="note" x="912" y="392" text-anchor="end">still growing, still safe</text>
<text class="note" transform="translate(80 295) rotate(-90)" text-anchor="middle">% of cluster RAM used →</text>
<text class="note" x="515" y="506" text-anchor="middle">collection scale →</text>
</svg>
