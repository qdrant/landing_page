    <text x="128" y="74" font-size="14" fill="#303547">lovely</text>
    <text x="32" y="102" font-size="14" fill="#303547">elegant</text>
    <text x="108" y="102" font-size="14" fill="#303547">beautiful</text>
    <line x1="290" y1="74" x2="192" y2="41" stroke="#00838f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="290" y1="74" x2="190" y2="69" stroke="#00838f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="290" y1="74" x2="192" y2="97" stroke="#00838f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="300" cy="74" r="9" fill="#f0f3fa" stroke="#dc244c" stroke-width="2.5"/>
    <circle cx="300" cy="74" r="3.5" fill="#dc244c"/>
    <text x="316" y="79" font-size="14" fill="#303547" font-weight="600">“gorgeous”</text>
    <text x="316" y="57" font-size="13" fill="#656b7f">query</text>
    <rect x="424" y="16" width="200" height="132" rx="6" fill="none" stroke="#6047ff" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="440" y="46" font-size="14" fill="#303547">dirty</text>
    <text x="494" y="46" font-size="14" fill="#303547">grisly</text>
    <text x="562" y="46" font-size="14" fill="#303547">awful</text>
    <text x="440" y="74" font-size="14" fill="#303547">ugly</text>
    <text x="484" y="74" font-size="14" fill="#303547">hideous</text>
    <text x="562" y="74" font-size="14" fill="#303547">messy</text>
    <text x="440" y="102" font-size="14" fill="#303547">grotesque</text>
