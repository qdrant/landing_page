<rect x="347.0" y="282" width="122.0" height="34" rx="17.0" fill="#e1bee7"/><text x="408.0" y="306.0" text-anchor="middle" style="font-size:20px;fill:#303547">high RAM</text>
<rect x="479.0" y="282" width="134.0" height="34" rx="17.0" fill="#e1bee7"/><text x="546.0" y="306.0" text-anchor="middle" style="font-size:20px;fill:#303547">evictable</text>
<rect x="650" y="120" width="290" height="216" rx="10" fill="#ffffff" stroke="#d3d9eb"/>
<text class="label" x="795.0" y="160" text-anchor="middle" style="font-size:26px;font-weight:600;fill:#00838f">Pinned</text>
