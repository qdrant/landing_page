<rect x="566.0" y="123" width="74.0" height="34" rx="17.0" fill="#ffb2b7"/><text x="603.0" y="147.0" text-anchor="middle" style="font-size:20px;fill:#9e0d38">High</text>
<rect x="756.0" y="123" width="182.0" height="34" rx="17.0" fill="#ffffff" stroke="#abb1c7"/><text x="847.0" y="147.0" text-anchor="middle" style="font-size:20px;fill:#303547">Opportunistic</text>
