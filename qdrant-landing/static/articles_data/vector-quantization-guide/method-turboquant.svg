    .qturbo .qturbo-bar.is-over { fill: #dc244c; }
    .qturbo .qturbo-dot { fill: #303547; }
    .qturbo .qturbo-lvl { stroke: #d3d9eb; stroke-width: 1; }
    
    .qi-axis { stroke: #abb1c7; stroke-width: 1.5; }
  </style>
