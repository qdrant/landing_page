<circle cx="111.7" cy="170.0" r="5" fill="#6047ff"/>
<line x1="84" y1="154" x2="111.7" y2="138.0" stroke="#6047ff" stroke-width="2"/>
<circle cx="111.7" cy="138.0" r="5" fill="#6047ff"/>
<circle cx="84" cy="154" r="8" fill="#6047ff"/>
