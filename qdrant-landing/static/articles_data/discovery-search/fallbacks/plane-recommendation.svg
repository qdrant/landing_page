<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 844" role="img" aria-labelledby="title desc">
<title id="title">Recommendation versus context search: a recommendation stays close to the positive example, while context search accepts any point in the zone. Switch modes to compare. The points are seeded and illustrative.</title>
<desc id="desc">Recommendation: the results are simply the points closest to the positive example, so they pile up around it. Any point in the shaded zone is a valid context result, including ones far from the positive. Hover a point for its score. Context search: no target, so every point in the shaded zone (16) is an equally good result, and points outside score lower the farther they are on the negative side. Add pairs to narrow the zone. Hover a point for its score.</desc>
