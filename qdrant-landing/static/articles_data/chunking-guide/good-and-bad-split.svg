<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 352" role="img" aria-label="One document, two ways to split it, same question. Split at paragraph breaks, the whole answer sits in one chunk and search returns it. With fixed 128-token windows, a boundary falls inside the answer, so search returns one chunk and the rest of the answer stays in the other."><style>
  .qi-label { fill: #656b7f; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
