{{- /* .Destination is role-agnostic; role-url puts the prefix on the
     /documentation/ paths that exist in every role. */ -}}
{{- $d := partial "common/role-url.html" .Destination -}}
<a href="{{ $d | safeURL }}"{{ with .Title}} title="{{ . }}"{{ end }}{{ if strings.HasPrefix .Destination "http" }} target="_blank" rel="noopener nofollow"{{ end }}>{{ .Text | safeHTML }}</a>
