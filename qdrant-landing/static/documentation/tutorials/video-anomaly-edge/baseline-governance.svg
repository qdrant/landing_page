<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" width="780" height="490" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Baseline governance with the default thresholds. Admission: a baseline candidate goes through a contamination check (score at most 0.025), one hour of quarantine, a re-score (score at most 0.025 again) and a per-scene cap (fewer than 500 clips), and is admitted to the baseline; failing a check rejects it. Hourly scrub: every baseline entry must be added at most 7 days ago and score at most 0.0375 on re-scoring to be kept; otherwise it is removed."><defs><marker id="h" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#656b7f"/></marker><marker id="h4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc244c"/></marker></defs><rect width="780" height="490" fill="#ffffff"/><text x="10" y="18" font-size="16" font-weight="700" fill="#303547">Admission</text><path d="M125.0 86 V110" stroke="#656b7f" stroke-width="2" fill="none" marker-end="url(#h)"/><path d="M125.0 164 V188" stroke="#656b7f" stroke-width="2" fill="none" marker-end="url(#h)"/><path d="M125.0 242 V266" stroke="#656b7f" stroke-width="2" fill="none" marker-end="url(#h)"/><path d="M125.0 320 V344" stroke="#656b7f" stroke-width="2" fill="none" marker-end="url(#h)"/><path d="M125.0 398 V422" stroke="#656b7f" stroke-width="2" fill="none" marker-end="url(#h)"/><path d="M240 138.0 H278" stroke="#dc244c" stroke-width="2" fill="none" marker-end="url(#h4)"/><path d="M240 294.0 H278" stroke="#dc244c" stroke-width="2" fill="none" marker-end="url(#h4)"/><path d="M240 372.0 H278" stroke="#dc244c" stroke-width="2" fill="none" marker-end="url(#h4)"/><rect x="280.5" y="116.5" width="89" height="277.0" rx="8" fill="#f0f3fa" stroke="#dc244c" stroke-width="1.5"/><text x="325.0" y="260.0" font-size="14" font-weight="700" fill="#303547" text-anchor="middle">Rejected</text><rect x="10.5" y="34.5" width="229" height="51" rx="8" fill="#f0f3fa" stroke="#6047ff" stroke-width="1.5"/><text x="22" y="56" font-size="14" font-weight="700" fill="#303547">Baseline candidate</text><text x="22" y="76" font-size="14" fill="#656b7f">a clip that looks normal</text><rect x="10.5" y="112.5" width="229" height="51" rx="8" fill="#f0f3fa" stroke="#6047ff" stroke-width="1.5"/><text x="22" y="134" font-size="14" font-weight="700" fill="#303547">Contamination check</text><text x="22" y="154" font-size="14" fill="#656b7f">score ≤ 0.025</text><rect x="10.5" y="190.5" width="229" height="51" rx="8" fill="#f0f3fa" stroke="#6047ff" stroke-width="1.5"/><text x="22" y="212" font-size="14" font-weight="700" fill="#303547">Quarantine</text><text x="22" y="232" font-size="14" fill="#656b7f">held for 1 hour</text><rect x="10.5" y="268.5" width="229" height="51" rx="8" fill="#f0f3fa" stroke="#6047ff" stroke-width="1.5"/><text x="22" y="290" font-size="14" font-weight="700" fill="#303547">Re-score</text><text x="22" y="310" font-size="14" fill="#656b7f">score ≤ 0.025 again</text><rect x="10.5" y="346.5" width="229" height="51" rx="8" fill="#f0f3fa" stroke="#6047ff" stroke-width="1.5"/><text x="22" y="368" font-size="14" font-weight="700" fill="#303547">Per-scene cap</text><text x="22" y="388" font-size="14" fill="#656b7f">fewer than 500 clips</text><rect x="10.5" y="424.5" width="229" height="51" rx="8" fill="#f0f3fa" stroke="#00838f" stroke-width="1.5"/><text x="22" y="446" font-size="14" font-weight="700" fill="#303547">Admitted</text><text x="22" y="466" font-size="14" fill="#656b7f">joins the baseline</text><text x="400" y="18" font-size="16" font-weight="700" fill="#303547">Hourly scrub</text><path d="M515.0 86 V110" stroke="#656b7f" stroke-width="2" fill="none" marker-end="url(#h)"/><path d="M515.0 164 V188" stroke="#656b7f" stroke-width="2" fill="none" marker-end="url(#h)"/><path d="M515.0 242 V266" stroke="#656b7f" stroke-width="2" fill="none" marker-end="url(#h)"/><path d="M630 138.0 H668" stroke="#dc244c" stroke-width="2" fill="none" marker-end="url(#h4)"/><path d="M630 216.0 H668" stroke="#dc244c" stroke-width="2" fill="none" marker-end="url(#h4)"/><rect x="670.5" y="116.5" width="89" height="121.0" rx="8" fill="#f0f3fa" stroke="#dc244c" stroke-width="1.5"/><text x="715.0" y="182.0" font-size="14" font-weight="700" fill="#303547" text-anchor="middle">Removed</text><rect x="400.5" y="34.5" width="229" height="51" rx="8" fill="#f0f3fa" stroke="#6047ff" stroke-width="1.5"/><text x="412" y="56" font-size="14" font-weight="700" fill="#303547">Baseline entry</text><text x="412" y="76" font-size="14" fill="#656b7f">checked every hour</text><rect x="400.5" y="112.5" width="229" height="51" rx="8" fill="#f0f3fa" stroke="#6047ff" stroke-width="1.5"/><text x="412" y="134" font-size="14" font-weight="700" fill="#303547">Retention window</text><text x="412" y="154" font-size="14" fill="#656b7f">added ≤ 7 days ago</text><rect x="400.5" y="190.5" width="229" height="51" rx="8" fill="#f0f3fa" stroke="#6047ff" stroke-width="1.5"/><text x="412" y="212" font-size="14" font-weight="700" fill="#303547">Re-score</text><text x="412" y="232" font-size="14" fill="#656b7f">score ≤ 0.0375</text><rect x="400.5" y="268.5" width="229" height="51" rx="8" fill="#f0f3fa" stroke="#00838f" stroke-width="1.5"/><text x="412" y="290" font-size="14" font-weight="700" fill="#303547">Kept</text><text x="412" y="310" font-size="14" fill="#656b7f">stays in the baseline</text></svg>