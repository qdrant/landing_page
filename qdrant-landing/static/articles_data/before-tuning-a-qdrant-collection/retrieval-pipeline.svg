<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="The hybrid retrieval pipeline: a dense prefetch and a sparse prefetch feed fusion, and an optional reranker rescores the fused candidates before the results return.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#303547"/>
    </marker>
  </defs>
  <rect width="1200" height="320" fill="#FFFFFF"/>
  <style>
    .stage   { font-family: 'Mona Sans', -apple-system, 'Segoe UI', sans-serif; font-weight: 600; font-size: 24px; }
    .knobs   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 21px; }
    .tag     { font-family: 'Mona Sans', -apple-system, 'Segoe UI', sans-serif; font-size: 19px; }
    .compact { display: none; font-family: 'Mona Sans', -apple-system, 'Segoe UI', sans-serif; font-weight: 600; font-size: 48px; }
    .wire    { stroke: #303547; stroke-width: 2; fill: none; }

    /* Phone-width render of this image: the full stage name plus its
       monospace parameter line no longer fit legibly at this scale (the
       viewBox is 1200 units wide against a ~350-390px rendered image).
       Swap to the short entity name at a much larger size instead of
       shrinking every label below a readable floor. The parameter names
       stay available in the surrounding prose and this image's alt text. */
    @media (max-width: 480px) {
      .stage, .knobs { display: none; }
      .compact { display: block; }
      .tag { font-size: 44px; }
      .wire { stroke-width: 6; }
    }
  </style>

  <!-- Retrieve: two prefetches -->
  <rect x="15" y="56" width="315" height="86" rx="10" fill="#C0F0F0" stroke="#038585" stroke-width="1.5"/>
  <text x="172" y="92" text-anchor="middle" class="stage" fill="#004F4F">Dense prefetch</text>
  <text x="172" y="124" text-anchor="middle" class="knobs" fill="#004F4F">limit · hnsw_ef</text>
  <text x="172" y="115" text-anchor="middle" dominant-baseline="middle" class="compact" fill="#004F4F">Dense</text>

  <rect x="15" y="198" width="315" height="86" rx="10" fill="#C0F0F0" stroke="#038585" stroke-width="1.5"/>
  <text x="172" y="234" text-anchor="middle" class="stage" fill="#004F4F">Sparse prefetch</text>
  <text x="172" y="266" text-anchor="middle" class="knobs" fill="#004F4F">limit · Modifier.IDF</text>
  <text x="172" y="257" text-anchor="middle" dominant-baseline="middle" class="compact" fill="#004F4F">Sparse</text>

  <!-- Fuse -->
  <rect x="395" y="127" width="350" height="86" rx="10" fill="#FFDADB" stroke="#DC244C" stroke-width="1.5"/>
  <text x="570" y="163" text-anchor="middle" class="stage" fill="#91012A">Fusion</text>
  <text x="570" y="195" text-anchor="middle" class="knobs" fill="#91012A">RRF (k, weights) · DBSF</text>
  <text x="570" y="186" text-anchor="middle" dominant-baseline="middle" class="compact" fill="#91012A">Fusion</text>

  <!-- Rerank (optional) -->
  <text x="1005" y="110" text-anchor="middle" class="tag" fill="#5700C9">optional</text>
  <rect x="830" y="127" width="350" height="86" rx="10" fill="none" stroke="#6047FF" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1005" y="163" text-anchor="middle" class="stage" fill="#5700C9">Reranker</text>
  <text x="1005" y="195" text-anchor="middle" class="knobs" fill="#5700C9">candidate count · model</text>
  <text x="1005" y="186" text-anchor="middle" dominant-baseline="middle" class="compact" fill="#5700C9">Reranker</text>

  <!-- Connectors -->
  <path class="wire" d="M330 99 H360 V148 H395" marker-end="url(#arrow)"/>
  <path class="wire" d="M330 241 H360 V192 H395" marker-end="url(#arrow)"/>
  <path class="wire" d="M745 170 H830" marker-end="url(#arrow)"/>
</svg>
