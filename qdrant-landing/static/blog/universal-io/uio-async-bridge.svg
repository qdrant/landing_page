<text x="16" y="28" font-size="14" fill="#656b7f" text-anchor="start" font-weight="400">caller thread · sync</text>
<rect x="2" y="126" width="756" height="210" rx="6" fill="#f0f3fa" stroke="#d3d9eb"/>
<text x="16" y="148" font-size="14" fill="#656b7f" text-anchor="start" font-weight="400">io-bridge Tokio workers · async</text>
<line x1="150" y1="72" x2="330" y2="72" stroke="#303547" stroke-width="2.5" stroke-linecap="round"/>
<line x1="330" y1="72" x2="400" y2="72" stroke="#656b7f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 6"/>
