<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="description">
  <desc id="description">The tenant_data collection has two isolation layers. In the partition-based layer, each point's payload carries a group_id: points 1 and 2 belong to tenant 1 and point 3 to tenant 2. In the resource-based layer, each point is upserted with a shard_key_selector: points 1 and 2 go to shard 1, canada, and point 3 to shard 2, germany.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#656b7f"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc244c"/>
    </marker>
    <marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6047ff"/>
    </marker>
  </defs>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="16" y="28" font-size="12.5" fill="#6047ff">Qdrant collection</text>
    <rect x="16" y="38" width="608" height="44" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.2"/>
    <text x="320" y="66" font-size="13.5" text-anchor="middle" fill="#303547">collection_name = “tenant_data”</text>
    <text x="16" y="110" font-size="12.5" fill="#6047ff">Partition-based isolation layer</text>
    <rect x="16" y="120" width="608" height="96" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.2"/>
    <circle cx="215.5" cy="144" r="11" fill="#303547"/>
    <path d="M196.5 178 A19 17 0 0 1 234.5 178 Z" fill="#303547"/>
    <text x="215.5" y="200" font-size="13.5" text-anchor="middle" fill="#303547">tenant 1</text>
    <circle cx="529" cy="144" r="11" fill="#303547"/>
    <path d="M510 178 A19 17 0 0 1 548 178 Z" fill="#303547"/>
    <text x="529" y="200" font-size="13.5" text-anchor="middle" fill="#303547">tenant 2</text>
    <text x="16" y="244" font-size="12.5" fill="#6047ff">Your data</text>
    <rect x="16" y="254" width="190" height="112" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.2"/>
    <text x="28" y="278" font-size="12.5" fill="#303547">id = 1,</text>
    <text x="28" y="298" font-size="12.5" fill="#303547">payload={"group_id":</text>
    <text x="28" y="318" font-size="12.5" fill="#303547">  "tenant_1"},</text>
    <text x="28" y="338" font-size="12.5" fill="#303547">vector=</text>
    <text x="28" y="358" font-size="12.5" fill="#303547">  [0.9, 0.1, 0.1],</text>
    <rect x="16" y="374" width="190" height="46" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.2"/>
    <text x="28" y="393" font-size="12.5" fill="#303547">shard_key_selector=</text>
    <text x="28" y="412" font-size="12.5" fill="#303547">  "canada",</text>
    <rect x="225" y="254" width="190" height="112" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.2"/>
    <text x="237" y="278" font-size="12.5" fill="#303547">id = 2,</text>
    <text x="237" y="298" font-size="12.5" fill="#303547">payload={"group_id":</text>
    <text x="237" y="318" font-size="12.5" fill="#303547">  "tenant_1"},</text>
    <text x="237" y="338" font-size="12.5" fill="#303547">vector=</text>
    <text x="237" y="358" font-size="12.5" fill="#303547">  [0.1, 0.9, 0.1],</text>
    <rect x="225" y="374" width="190" height="46" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.2"/>
    <text x="237" y="393" font-size="12.5" fill="#303547">shard_key_selector=</text>
    <text x="237" y="412" font-size="12.5" fill="#303547">  "canada",</text>
    <rect x="434" y="254" width="190" height="112" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.2"/>
    <text x="446" y="278" font-size="12.5" fill="#303547">id = 3,</text>
    <text x="446" y="298" font-size="12.5" fill="#303547">payload={"group_id":</text>
    <text x="446" y="318" font-size="12.5" fill="#303547">  "tenant_2"},</text>
    <text x="446" y="338" font-size="12.5" fill="#303547">vector=</text>
    <text x="446" y="358" font-size="12.5" fill="#303547">  [0.1, 0.1, 0.9],</text>
    <rect x="434" y="374" width="190" height="46" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.2"/>
    <text x="446" y="393" font-size="12.5" fill="#303547">shard_key_selector=</text>
    <text x="446" y="412" font-size="12.5" fill="#303547">  "germany",</text>
    <text x="16" y="448" font-size="12.5" fill="#6047ff">Resource-based isolation layer</text>
    <rect x="16" y="458" width="399" height="48" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.2"/>
    <text x="215.5" y="488" font-size="13.5" text-anchor="middle" fill="#303547">shard 1: canada</text>
    <rect x="434" y="458" width="190" height="48" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.2"/>
    <text x="529" y="488" font-size="13.5" text-anchor="middle" fill="#303547">shard 2: germany</text>
  </g>
</svg>
