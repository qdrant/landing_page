<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
<title id="title">Aggregating token vectors per cluster. Switch between a document, which averages and fills empty clusters, and a query, which sums and leaves them as zero vectors. Cluster contents are illustrative.</title>
<desc id="desc">A document averages the token vectors in each cluster, then fills each empty cluster with the vector of the nearest non-empty one by Hamming distance. Result: 8 vectors, none of them empty. A query sums the token vectors in each cluster, so each token contributes to the cluster vector, and leaves empty clusters as zero vectors. Result: 8 vectors, some of them zero.</desc>
