<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="620" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- axes -->
  <line x1="78" y1="40" x2="78" y2="300" stroke="#abb1c7" stroke-width="1"/>
  <line x1="78" y1="300" x2="600" y2="300" stroke="#abb1c7" stroke-width="1"/>

  <!-- y ticks + labels (recall@10) -->
  <line x1="74" y1="300" x2="78" y2="300" stroke="#abb1c7"/><text x="64" y="304" text-anchor="end" font-size="12" fill="#656b7f">0.15</text>
  <line x1="74" y1="170" x2="78" y2="170" stroke="#abb1c7"/><text x="64" y="174" text-anchor="end" font-size="12" fill="#656b7f">0.22</text>
