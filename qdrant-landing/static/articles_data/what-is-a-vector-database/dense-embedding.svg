<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 144" role="img" aria-labelledby="description">
  <desc id="description">The sentence "I love Vector Similarity" becomes a dense vector in which every dimension has a value. Values are illustrative.</desc>
