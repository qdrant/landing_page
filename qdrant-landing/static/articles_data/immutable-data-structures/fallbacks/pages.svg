<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 696" role="img" aria-labelledby="title desc">
<title id="title">Disk pages holding vectors from four workspaces, scattered or grouped by workspace. A real 4 KB page holds about 21 binary-quantized 1536d vectors of 192 bytes; the picture uses 8 per page. The arrangement is illustrative.</title>
<desc id="desc">Scattered: workspace #2's 16 vectors are spread over 7 of 8 pages, so reading them pulls in 56 vectors, 3.5× the data needed. Defragmented: workspace #2's 16 vectors fill 2 pages, so every vector read is one the query uses (1× overhead).</desc>
