<path d="M150 85V163" fill="none" stroke="#6047ff" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="150" y="166" width="530" height="28" rx="5" fill="#6047ff" fill-opacity="0.06" stroke="#6047ff" stroke-opacity="0.6" stroke-width="1.5"/>
<text x="160" y="185" font-size="13" fill="#303547" text-anchor="start" font-weight="400">read A · slot 0</text>
