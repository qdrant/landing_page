<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="description">
  <desc id="description">The tenant_data collection has two shards. The shard with key canada holds points 1 and 2 of tenant_1 on a node in Canada. The shard with key germany holds point 3 of tenant_2 on a node in Germany. A query filtered on group_id tenant_1 with shard key canada searches only the canada shard.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#656b7f"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="639" height="299" rx="6" fill="#f0f3fa" stroke="#d3d9eb" stroke-width="1"/>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="24" y="20" width="346" height="56" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="40" y="43" font-size="14" fill="#303547">group_id = tenant_1</text>
    <text x="40" y="64" font-size="14" fill="#303547">shard_key_selector = canada</text>

    <line x1="280" y1="76" x2="280" y2="136" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="24" y="96" width="592" height="184" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="40" y="120" font-size="14" fill="#303547" font-weight="600">collection: tenant_data</text>
    <text x="386" y="52" font-size="12" fill="#656b7f">query</text>

    <rect x="40" y="140" width="330" height="124" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="56" y="164" font-size="14" fill="#303547">shard key: canada</text>
    <rect x="56" y="178" width="148" height="36" rx="6" fill="none" stroke="#6047ff" stroke-width="1.5"/>
    <text x="130" y="201" font-size="14" text-anchor="middle" fill="#303547">id 1 · tenant_1</text>
    <rect x="210" y="178" width="148" height="36" rx="6" fill="none" stroke="#6047ff" stroke-width="1.5"/>
    <text x="284" y="201" font-size="14" text-anchor="middle" fill="#303547">id 2 · tenant_1</text>
    <text x="56" y="248" font-size="12" fill="#656b7f">node in Canada</text>

    <rect x="386" y="140" width="214" height="124" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="402" y="164" font-size="14" fill="#303547">shard key: germany</text>
    <rect x="402" y="178" width="148" height="36" rx="6" fill="none" stroke="#00838f" stroke-width="1.5"/>
    <text x="476" y="201" font-size="14" text-anchor="middle" fill="#303547">id 3 · tenant_2</text>
    <text x="402" y="248" font-size="12" fill="#656b7f">node in Germany</text>
  </g>
</svg>
