<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Mona Sans',Arial,sans-serif" role="img" aria-label="Bandwidth against latency for three read backends, log-log. io_uring climbs almost straight up, from 7.15 to 85.66 megabytes per second while latency stays near 0.6 milliseconds, then bends right: the last 29 percent of bandwidth costs 15 times the wait. mmap runs flat along the bottom at about 7.2 megabytes per second whatever the batch, because its pipeline is one deep, so a batch of 256 only adds queueing and 129 times the wait. S3 climbs straight up at about 24 milliseconds, from 0.15 to 12.55 megabytes per second, because its latency barely moves as concurrency rises."><style>
  .dl-title{fill:#303547;font-weight:600}.dl-note{fill:#656b7f;font-size:13px}
  .dl-tick{fill:#656b7f;font-size:12.5px}.dl-legend{fill:#303547;font-size:13.5px}
  .dl-callout{fill:currentColor;font-size:13px;font-weight:600}
  .dl-callout--cont{font-weight:400}
  .dl-grid{stroke:#abb1c7;stroke-width:1;opacity:.45}
  .dl-axis{stroke:#656b7f;stroke-width:1.5;fill:none}
  .dl-outline{stroke:#303547;stroke-width:5;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .dl-line{stroke:currentColor;stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .dl-dot{fill:currentColor}.dl-hit{display:none}
  .dl-cyan{color:#00838f}.dl-blue{color:#6047ff}.dl-red{color:#dc244c}</style><rect width="960" height="560" fill="#f0f3fa"/><text class="dl-title" x="150" y="62" style="font-size:22px">Depth buys bandwidth.</text><text class="dl-title" x="150" y="91" style="font-size:22px">Over-batching buys only waiting.</text><text class="dl-note" x="150" y="128">4 KiB random reads, cold, one box</text><line class="dl-grid" x1="179.3" y1="150" x2="179.3" y2="440"/><text class="dl-tick" x="179.3" y="462" text-anchor="middle">0.5 ms</text><line class="dl-grid" x1="270.5" y1="150" x2="270.5" y2="440"/><text class="dl-tick" x="270.5" y="462" text-anchor="middle">1 ms</text><line class="dl-grid" x1="361.6" y1="150" x2="361.6" y2="440"/><text class="dl-tick" x="361.6" y="462" text-anchor="middle">2 ms</text><line class="dl-grid" x1="482.1" y1="150" x2="482.1" y2="440"/><text class="dl-tick" x="482.1" y="462" text-anchor="middle">5 ms</text><line class="dl-grid" x1="573.3" y1="150" x2="573.3" y2="440"/><text class="dl-tick" x="573.3" y="462" text-anchor="middle">10 ms</text><line class="dl-grid" x1="664.4" y1="150" x2="664.4" y2="440"/><text class="dl-tick" x="664.4" y="462" text-anchor="middle">20 ms</text><line class="dl-grid" x1="784.9" y1="150" x2="784.9" y2="440"/><text class="dl-tick" x="784.9" y="462" text-anchor="middle">50 ms</text><line class="dl-grid" x1="876.0" y1="150" x2="876.0" y2="440"/><text class="dl-tick" x="876.0" y="462" text-anchor="middle">100 ms</text><line class="dl-grid" x1="150" y1="440.0" x2="900" y2="440.0"/><text class="dl-tick" x="140" y="444.0" text-anchor="end">0.1</text><line class="dl-grid" x1="150" y1="353.2" x2="900" y2="353.2"/><text class="dl-tick" x="140" y="357.2" text-anchor="end">1</text><line class="dl-grid" x1="150" y1="266.5" x2="900" y2="266.5"/><text class="dl-tick" x="140" y="270.5" text-anchor="end">10</text><line class="dl-grid" x1="150" y1="179.7" x2="900" y2="179.7"/><text class="dl-tick" x="140" y="183.7" text-anchor="end">100</text><path class="dl-axis" d="M150 150V440H900"/><text class="dl-note" x="525" y="488" text-anchor="middle">time from submit to completion, p50 &#8594;</text><text class="dl-note" transform="translate(98 295) rotate(-90)" text-anchor="middle">MB/s delivered &#8594;</text><g class="dl-series dl-cyan"><path class="dl-outline" d="M192.4,278.7 L477.7,279.1 L653.9,278.8 L831.4,278.7"/><path class="dl-line" d="M192.4,278.7 L477.7,279.1 L653.9,278.8 L831.4,278.7"/><circle class="dl-dot" cx="192.4" cy="278.7" r="4.5"/><circle class="dl-hit" cx="192.4" cy="278.7" r="12" tabindex="0" role="button" aria-label="mmap, batch 1, 7.22 MB/s at 0.5524 ms"><title>mmap batch 1: 7.22 MB/s at 0.5524 ms</title></circle><circle class="dl-dot" cx="477.7" cy="279.1" r="4.5"/><circle class="dl-hit" cx="477.7" cy="279.1" r="12" tabindex="0" role="button" aria-label="mmap, batch 16, 7.15 MB/s at 4.836 ms"><title>mmap batch 16: 7.15 MB/s at 4.836 ms</title></circle><circle class="dl-dot" cx="653.9" cy="278.8" r="4.5"/><circle class="dl-hit" cx="653.9" cy="278.8" r="12" tabindex="0" role="button" aria-label="mmap, batch 64, 7.21 MB/s at 18.4614 ms"><title>mmap batch 64: 7.21 MB/s at 18.4614 ms</title></circle><circle class="dl-dot" cx="831.4" cy="278.7" r="4.5"/><circle class="dl-hit" cx="831.4" cy="278.7" r="12" tabindex="0" role="button" aria-label="mmap, batch 256, 7.22 MB/s at 71.2242 ms"><title>mmap batch 256: 7.22 MB/s at 71.2242 ms</title></circle></g><g class="dl-series dl-blue"><path class="dl-outline" d="M194.6,279.1 L195.4,255.4 L197.0,230.7 L198.5,209.2 L206.2,185.5 L260.8,181.9 L317.7,180.7 L392.7,177.8 L478.7,176.9 L565.4,175.8"/><path class="dl-line" d="M194.6,279.1 L195.4,255.4 L197.0,230.7 L198.5,209.2 L206.2,185.5 L260.8,181.9 L317.7,180.7 L392.7,177.8 L478.7,176.9 L565.4,175.8"/><circle class="dl-dot" cx="194.6" cy="279.1" r="4.5"/><circle class="dl-hit" cx="194.6" cy="279.1" r="12" tabindex="0" role="button" aria-label="io_uring, batch 1, 7.15 MB/s at 0.5616 ms"><title>io_uring batch 1: 7.15 MB/s at 0.5616 ms</title></circle><circle class="dl-dot" cx="195.4" cy="255.4" r="4.5"/><circle class="dl-hit" cx="195.4" cy="255.4" r="12" tabindex="0" role="button" aria-label="io_uring, batch 2, 13.43 MB/s at 0.565 ms"><title>io_uring batch 2: 13.43 MB/s at 0.565 ms</title></circle><circle class="dl-dot" cx="197.0" cy="230.7" r="4.5"/><circle class="dl-hit" cx="197.0" cy="230.7" r="12" tabindex="0" role="button" aria-label="io_uring, batch 4, 25.84 MB/s at 0.572 ms"><title>io_uring batch 4: 25.84 MB/s at 0.572 ms</title></circle><circle class="dl-dot" cx="198.5" cy="209.2" r="4.5"/><circle class="dl-hit" cx="198.5" cy="209.2" r="12" tabindex="0" role="button" aria-label="io_uring, batch 8, 45.71 MB/s at 0.5784 ms"><title>io_uring batch 8: 45.71 MB/s at 0.5784 ms</title></circle><circle class="dl-dot" cx="206.2" cy="185.5" r="4.5"/><circle class="dl-hit" cx="206.2" cy="185.5" r="12" tabindex="0" role="button" aria-label="io_uring, batch 16, 85.66 MB/s at 0.6135 ms"><title>io_uring batch 16: 85.66 MB/s at 0.6135 ms</title></circle><circle class="dl-dot" cx="260.8" cy="181.9" r="4.5"/><circle class="dl-hit" cx="260.8" cy="181.9" r="12" tabindex="0" role="button" aria-label="io_uring, batch 32, 94.34 MB/s at 0.9287 ms"><title>io_uring batch 32: 94.34 MB/s at 0.9287 ms</title></circle><circle class="dl-dot" cx="317.7" cy="180.7" r="4.5"/><circle class="dl-hit" cx="317.7" cy="180.7" r="12" tabindex="0" role="button" aria-label="io_uring, batch 64, 97.32 MB/s at 1.432 ms"><title>io_uring batch 64: 97.32 MB/s at 1.432 ms</title></circle><circle class="dl-dot" cx="392.7" cy="177.8" r="4.5"/><circle class="dl-hit" cx="392.7" cy="177.8" r="12" tabindex="0" role="button" aria-label="io_uring, batch 128, 105.29 MB/s at 2.5331 ms"><title>io_uring batch 128: 105.29 MB/s at 2.5331 ms</title></circle><circle class="dl-dot" cx="478.7" cy="176.9" r="4.5"/><circle class="dl-hit" cx="478.7" cy="176.9" r="12" tabindex="0" role="button" aria-label="io_uring, batch 256, 107.67 MB/s at 4.8724 ms"><title>io_uring batch 256: 107.67 MB/s at 4.8724 ms</title></circle><circle class="dl-dot" cx="565.4" cy="175.8" r="4.5"/><circle class="dl-hit" cx="565.4" cy="175.8" r="12" tabindex="0" role="button" aria-label="io_uring, batch 512, 110.91 MB/s at 9.4183 ms"><title>io_uring batch 512: 110.91 MB/s at 9.4183 ms</title></circle></g><g class="dl-series dl-red"><path class="dl-outline" d="M690.1,425.0 L689.9,403.0 L695.5,374.7 L687.2,357.4 L689.2,322.7 L688.3,307.7 L694.3,257.9"/><path class="dl-line" d="M690.1,425.0 L689.9,403.0 L695.5,374.7 L687.2,357.4 L689.2,322.7 L688.3,307.7 L694.3,257.9"/><circle class="dl-dot" cx="690.1" cy="425.0" r="4.5"/><circle class="dl-hit" cx="690.1" cy="425.0" r="12" tabindex="0" role="button" aria-label="S3, same region, 1 in flight, 0.149 MB/s at 24.32 ms"><title>S3, same region 1 in flight: 0.149 MB/s at 24.32 ms</title></circle><circle class="dl-dot" cx="689.9" cy="403.0" r="4.5"/><circle class="dl-hit" cx="689.9" cy="403.0" r="12" tabindex="0" role="button" aria-label="S3, same region, 2 in flight, 0.267 MB/s at 24.28 ms"><title>S3, same region 2 in flight: 0.267 MB/s at 24.28 ms</title></circle><circle class="dl-dot" cx="695.5" cy="374.7" r="4.5"/><circle class="dl-hit" cx="695.5" cy="374.7" r="12" tabindex="0" role="button" aria-label="S3, same region, 4 in flight, 0.565 MB/s at 25.33 ms"><title>S3, same region 4 in flight: 0.565 MB/s at 25.33 ms</title></circle><circle class="dl-dot" cx="687.2" cy="357.4" r="4.5"/><circle class="dl-hit" cx="687.2" cy="357.4" r="12" tabindex="0" role="button" aria-label="S3, same region, 8 in flight, 0.895 MB/s at 23.79 ms"><title>S3, same region 8 in flight: 0.895 MB/s at 23.79 ms</title></circle><circle class="dl-dot" cx="689.2" cy="322.7" r="4.5"/><circle class="dl-hit" cx="689.2" cy="322.7" r="12" tabindex="0" role="button" aria-label="S3, same region, 16 in flight, 2.248 MB/s at 24.16 ms"><title>S3, same region 16 in flight: 2.248 MB/s at 24.16 ms</title></circle><circle class="dl-dot" cx="688.3" cy="307.7" r="4.5"/><circle class="dl-hit" cx="688.3" cy="307.7" r="12" tabindex="0" role="button" aria-label="S3, same region, 32 in flight, 3.346 MB/s at 23.99 ms"><title>S3, same region 32 in flight: 3.346 MB/s at 23.99 ms</title></circle><circle class="dl-dot" cx="694.3" cy="257.9" r="4.5"/><circle class="dl-hit" cx="694.3" cy="257.9" r="12" tabindex="0" role="button" aria-label="S3, same region, 128 in flight, 12.55 MB/s at 25.1 ms"><title>S3, same region 128 in flight: 12.55 MB/s at 25.1 ms</title></circle></g><text class="dl-callout dl-blue" x="209.7" y="221.5">each doubling of depth</text><text class="dl-callout dl-blue dl-callout--cont" x="209.7" y="238.5">doubles bandwidth, latency flat</text><text class="dl-callout" x="585.8" y="156.5">past the 16-deep ring, the last 29%</text><text class="dl-callout dl-callout--cont" x="585.8" y="173.5">of bandwidth costs 15&#215; the wait</text><text class="dl-callout dl-cyan" x="368.0" y="307.1">no pipeline: 256 queued reads change</text><text class="dl-callout dl-cyan dl-callout--cont" x="368.0" y="324.1">nothing but the wait (129&#215;)</text><text class="dl-callout dl-red" x="670.8" y="401.2" text-anchor="end">84&#215; the bandwidth,</text><text class="dl-callout dl-red dl-callout--cont" x="670.8" y="418.2" text-anchor="end">latency flat at 24 ms</text><g class="dl-series dl-cyan"><line class="dl-outline" x1="150" y1="521" x2="176" y2="521"/><line class="dl-line" x1="150" y1="521" x2="176" y2="521"/></g><text class="dl-legend" x="184" y="526">mmap</text><g class="dl-series dl-blue"><line class="dl-outline" x1="400" y1="521" x2="426" y2="521"/><line class="dl-line" x1="400" y1="521" x2="426" y2="521"/></g><text class="dl-legend" x="434" y="526">io_uring</text><g class="dl-series dl-red"><line class="dl-outline" x1="650" y1="521" x2="676" y2="521"/><line class="dl-line" x1="650" y1="521" x2="676" y2="521"/></g><text class="dl-legend" x="684" y="526">S3, same region</text></svg>