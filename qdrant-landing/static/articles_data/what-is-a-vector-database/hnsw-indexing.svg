  <desc id="description">An HNSW graph with three layers. Layer 2 holds a few points with long links, layer 1 holds more, and layer 0 holds all points with short links. A search starts at the entry point in the top layer, moves to the closest point in each layer, drops to the layer below, and finishes at the point nearest the query in layer 0.</desc>
