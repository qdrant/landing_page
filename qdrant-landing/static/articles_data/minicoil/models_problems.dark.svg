  <text x="512" y="152" fill="#ffb2b7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Storage overhead</text>
  <text x="300" y="352" fill="#ffb2b7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Poor out-of-domain</text>
  <text x="300" y="374" fill="#ffb2b7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">accuracy</text>
  <text x="690" y="490" fill="#ffcc80" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Slow generation</text>

