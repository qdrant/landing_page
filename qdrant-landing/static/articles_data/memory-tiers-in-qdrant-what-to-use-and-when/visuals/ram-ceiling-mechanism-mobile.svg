<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 578" width="480" height="578" role="img" aria-labelledby="t d">
<title id="t">Working set as a share of cluster RAM</title>
<desc id="d">Conceptual line. A caching configuration's working set climbs toward 100% of cluster RAM as the collection scales and loses its safe margin, then drops back to a safe share once the cluster RAM is upgraded, and keeps growing safely.</desc>
<style>
  text { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #303547; }
  .title { font-size: 23px; font-weight: 600; }
  .head { font-size: 21px; font-weight: 600; }
  .label { font-size: 21px; }
  .small { font-size: 20px; }
  .note { font-size: 19px; fill: #656b7f; }
  .muted { fill: #656b7f; }
  .axis { stroke: #abb1c7; stroke-width: 1.5; fill: none; }
</style>
<rect x="0.5" y="0.5" width="479" height="577" rx="12" fill="#f0f3fa" stroke="#d3d9eb"/>
<text class="title" x="24" y="40">Working set as a share</text>
<text class="title" x="24" y="68">of cluster RAM, as a</text>
<text class="title" x="24" y="96">collection scales</text>
<text class="note" x="24" y="124">conceptual, not to scale</text>
<rect x="57" y="180" width="399" height="62" fill="#ffb2b7" opacity="0.35"/>
<line x1="57" x2="456" y1="209" y2="209" stroke="#dc244c" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="note" x="452" y="236" text-anchor="end">100% of cluster RAM</text>
<line x1="260" x2="260" y1="180" y2="520" stroke="#656b7f" stroke-width="1.5" stroke-dasharray="4 5"/>
<text class="note" x="252" y="486" text-anchor="end">cluster RAM</text>
<text class="note" x="252" y="510" text-anchor="end">upgraded here</text>
<path d="M56 170 V520 H456" class="axis"/>
<path d="M56 428 C 110 384, 150 355, 179 326 S 234 238, 260 211" fill="none" stroke="#9c27b0" stroke-width="3"/>
<path d="M268 312 C 271 394, 278 414, 293 412 C 318 409, 323 385, 368 375 S 427 346, 456 341" fill="none" stroke="#9c27b0" stroke-width="3"/>
<circle cx="260" cy="211" r="8" fill="#dc244c"/>
<text class="note" x="240" y="200" text-anchor="end" style="fill:#9e0d38;font-weight:600">safe margin gone</text>
<circle cx="268" cy="312" r="8" fill="#9c27b0"/>
<text class="note" x="284" y="300" style="fill:#6a1b9a;font-weight:600">recovers once</text>
<text class="note" x="284" y="324" style="fill:#6a1b9a;font-weight:600">RAM grows</text>
<text class="note" x="452" y="446" text-anchor="end">still growing,</text>
<text class="note" x="452" y="470" text-anchor="end">still safe</text>
<text class="note" transform="translate(32 345) rotate(-90)" text-anchor="middle">% of cluster RAM used →</text>
<text class="note" x="256" y="554" text-anchor="middle">collection scale →</text>
</svg>
