<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -16 800 318" width="800" height="318" role="img" aria-labelledby="t d">
  <title id="t">Scalar quantization of one vector</title>
  <desc id="d">Twelve float32 coordinates, one of them an outlier, are mapped onto 256 levels and stored as int8 codes, which takes a quarter of the space: 96 bits instead of 384. The outlier stretches the range, so one level covers 0.0148 and typical values are off by 0.0044 on average.</desc>
  <style>
    
    .qscalar { display: block; text-align: left; }
    .qscalar .qi-fig { gap: 16px; }
    .qscalar .qscalar-h { fill: #656b7f; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 14px; }
    .qscalar .qscalar-num { fill: #303547; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 14px; font-variant-numeric: tabular-nums; }
    .qscalar .qscalar-num.is-over { fill: #dc244c; font-weight: 600; }
    .qscalar .qscalar-cell { fill: #f0f3fa; stroke: #d3d9eb; stroke-width: 1; }
    .qscalar .qscalar-cell.is-hot { stroke: #dc244c; stroke-width: 2; }
    .qscalar .qscalar-bar { fill: #6047ff; }
    .qscalar .qscalar-bar.is-full { fill: #abb1c7; }
    
    .qi-axis { stroke: #abb1c7; stroke-width: 1.5; }
  </style>
  <rect x="-20" y="-16" width="800" height="318" fill="#FFFFFF" rx="12"/>
