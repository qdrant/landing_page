<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img" aria-labelledby="description">
  <desc id="description">Three pairs of vectors A and B. Similar vectors point in nearly the same direction with a small angle between them. Unrelated vectors are at a right angle. Opposite vectors point in opposite directions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#656b7f"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc244c"/>
    </marker>
    <marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6047ff"/>
    </marker>
  </defs>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="113" y="32" font-size="13.5" text-anchor="middle" fill="#303547">similar</text>
    <line x1="35" y1="112" x2="191" y2="112" stroke="#abb1c7" stroke-width="1.5"/>
    <line x1="113" y1="48" x2="113" y2="176" stroke="#abb1c7" stroke-width="1.5"/>
    <path d="M113 112 L127.5 57.9" fill="none" stroke="#303547" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="131.376" y="48.4193" font-size="13.5" text-anchor="middle" fill="#303547">A</text>
    <path d="M113 112 L145.1 66.1" fill="none" stroke="#303547" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="153.724" y="58.8402" font-size="13.5" text-anchor="middle" fill="#303547">B</text>
    <path d="M125.6 94.0 A22 22 0 0 0 118.7 90.7" fill="none" stroke="#dc244c" stroke-width="1.5"/>
    <text x="320" y="32" font-size="13.5" text-anchor="middle" fill="#303547">unrelated</text>
    <line x1="242" y1="112" x2="398" y2="112" stroke="#abb1c7" stroke-width="1.5"/>
    <line x1="320" y1="48" x2="320" y2="176" stroke="#abb1c7" stroke-width="1.5"/>
    <path d="M320 112 L280.4 72.4" fill="none" stroke="#303547" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="269.795" y="66.7954" font-size="13.5" text-anchor="middle" fill="#303547">A</text>
    <path d="M320 112 L359.6 72.4" fill="none" stroke="#303547" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="370.205" y="66.7954" font-size="13.5" text-anchor="middle" fill="#303547">B</text>
    <path d="M335.6 96.4 A22 22 0 0 0 304.4 96.4" fill="none" stroke="#dc244c" stroke-width="1.5"/>
    <text x="527" y="32" font-size="13.5" text-anchor="middle" fill="#303547">opposite</text>
    <line x1="449" y1="112" x2="605" y2="112" stroke="#abb1c7" stroke-width="1.5"/>
    <line x1="527" y1="48" x2="527" y2="176" stroke="#abb1c7" stroke-width="1.5"/>
    <path d="M527 112 L481.1 144.1" fill="none" stroke="#303547" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="468.84" y="157.724" font-size="13.5" text-anchor="middle" fill="#303547">A</text>
    <path d="M527 112 L572.9 79.9" fill="none" stroke="#303547" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="585.16" y="76.2761" font-size="13.5" text-anchor="middle" fill="#303547">B</text>
    <path d="M545.0 99.4 A22 22 0 0 0 509.0 124.6" fill="none" stroke="#dc244c" stroke-width="1.5"/>
  </g>
</svg>
