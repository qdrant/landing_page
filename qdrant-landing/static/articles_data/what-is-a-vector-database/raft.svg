<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 224" role="img" aria-labelledby="description">
  <desc id="description">A collection's points are split into three non-overlapping shards, one on each of three nodes. All nodes take part in Raft consensus, which keeps the cluster state in sync: the peers and their URIs, collections, shard-to-peer placement, shard status, and transfer status.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#656b7f"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc244c"/>
    </marker>
    <marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6047ff"/>
    </marker>
  </defs>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="16" y="12" width="184" height="84" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.2"/>
    <text x="32" y="38" font-size="13.5" fill="#303547">Node 1</text>
    <rect x="32" y="52" width="152" height="30" rx="4" fill="#6047ff" fill-opacity="0.16"/>
    <text x="108" y="71.86" font-size="13.5" text-anchor="middle" fill="#303547">Shard 1</text>
    <path d="M108 96 V120" fill="none" stroke="#656b7f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="228" y="12" width="184" height="84" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.2"/>
    <text x="244" y="38" font-size="13.5" fill="#303547">Node 2</text>
    <rect x="244" y="52" width="152" height="30" rx="4" fill="#00838f" fill-opacity="0.16"/>
    <text x="320" y="71.86" font-size="13.5" text-anchor="middle" fill="#303547">Shard 2</text>
    <path d="M320 96 V120" fill="none" stroke="#656b7f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="440" y="12" width="184" height="84" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.2"/>
    <text x="456" y="38" font-size="13.5" fill="#303547">Node 3</text>
    <rect x="456" y="52" width="152" height="30" rx="4" fill="#9c27b0" fill-opacity="0.16"/>
    <text x="532" y="71.86" font-size="13.5" text-anchor="middle" fill="#303547">Shard 3</text>
    <path d="M532 96 V120" fill="none" stroke="#656b7f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="16" y="120" width="608" height="92" rx="6" fill="none" stroke="#dc244c" stroke-width="1.2"/>
    <text x="320" y="148" font-size="13.5" text-anchor="middle" fill="#303547">Raft consensus</text>
    <text x="320" y="174" font-size="12.5" text-anchor="middle" fill="#656b7f">peers and their URIs · collections</text>
    <text x="320" y="196" font-size="12.5" text-anchor="middle" fill="#656b7f">shard-to-peer placement · shard status · transfer status</text>
  </g>
</svg>
