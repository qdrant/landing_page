<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="desc"><desc id="desc">The query retrieves candidates from Qdrant, then a cross-encoder scores query-document pairs and the application sorts results.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#576280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f0f3fa"/><rect x="80" y="25" width="480" height="80" rx="14" fill="white" stroke="#b4bacc" stroke-width="2"/><text x="320.0" y="73.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">Query</text><path d="M320 105 L320 145" fill="none" stroke="#576280" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="150" width="480" height="100" rx="14" fill="white" stroke="#009688" stroke-width="2"/><text x="320.0" y="192.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">Qdrant retrieval</text><text x="320.0" y="224.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">Candidate documents</text><path d="M320 250 L320 300" fill="none" stroke="#576280" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="305" width="480" height="125" rx="14" fill="white" stroke="#dc244c" stroke-width="2"/><text x="320.0" y="343.5" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">Cross-encoder</text><text x="320.0" y="375.5" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">Query + each document</text><text x="320.0" y="407.5" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">Relevance scores</text><path d="M320 430 L320 480" fill="none" stroke="#576280" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="485" width="480" height="115" rx="14" fill="white" stroke="#b4bacc" stroke-width="2"/><text x="320.0" y="534.5" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">Application sorts scores</text><text x="320.0" y="566.5" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">Reordered results</text></svg>
