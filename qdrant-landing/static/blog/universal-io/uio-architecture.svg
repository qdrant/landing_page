<text x="380" y="54" font-size="13" fill="#303547" text-anchor="middle" font-weight="400">vectors · HNSW links · payload indexes</text>
<text x="380" y="73" font-size="13" fill="#656b7f" text-anchor="middle" font-weight="400">written once, generic over the backend</text>
