<rect x="15" y="40" width="255" height="110" rx="10" fill="#c0f0f0" stroke="#038585" stroke-width="1.5"/>
<text x="142.5" y="85" text-anchor="middle" font-family="'Mona Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#004f4f">Prefetch</text>
<text x="142.5" y="120" text-anchor="middle" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#004f4f">100 candidates</text>
