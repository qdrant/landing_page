<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 298" role="img" aria-labelledby="description">
  <desc id="description">A filtered HNSW search. Points that match the payload filter are solid; points that fail it are hollow and their links are dashed. The search starts at the entry point and follows links only through matching points until it reaches the result next to the query.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#656b7f"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc244c"/>
    </marker>
    <marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6047ff"/>
    </marker>
  </defs>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <line x1="64" y1="124" x2="166" y2="186" stroke="#abb1c7" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="156" y1="62" x2="346" y2="52" stroke="#abb1c7" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="166" y1="186" x2="266" y2="204" stroke="#abb1c7" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="258" y1="116" x2="266" y2="204" stroke="#656b7f" stroke-width="1.2"/>
    <line x1="258" y1="116" x2="354" y2="160" stroke="#abb1c7" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="346" y1="52" x2="440" y2="104" stroke="#abb1c7" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="266" y1="204" x2="448" y2="206" stroke="#abb1c7" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="354" y1="160" x2="448" y2="206" stroke="#abb1c7" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="440" y1="104" x2="548" y2="62" stroke="#656b7f" stroke-width="1.2"/>
    <line x1="448" y1="206" x2="532" y2="148" stroke="#abb1c7" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="548" y1="62" x2="532" y2="148" stroke="#656b7f" stroke-width="1.2"/>
    <path d="M71.5 119.0 L146.9 68.1" fill="none" stroke="#dc244c" stroke-width="2.2" marker-end="url(#arrow-accent)"/>
    <path d="M164.0 66.2 L248.3 110.9" fill="none" stroke="#dc244c" stroke-width="2.2" marker-end="url(#arrow-accent)"/>
    <path d="M267.0 115.4 L429.0 104.7" fill="none" stroke="#dc244c" stroke-width="2.2" marker-end="url(#arrow-accent)"/>
    <path d="M448.1 107.9 L522.1 143.3" fill="none" stroke="#dc244c" stroke-width="2.2" marker-end="url(#arrow-accent)"/>
    <circle cx="64" cy="124" r="6" fill="#656b7f"/>
    <circle cx="156" cy="62" r="6" fill="#656b7f"/>
    <circle cx="166" cy="186" r="6" fill="#f0f3fa" stroke="#abb1c7" stroke-width="1.5"/>
    <circle cx="258" cy="116" r="6" fill="#656b7f"/>
    <circle cx="266" cy="204" r="6" fill="#656b7f"/>
    <circle cx="346" cy="52" r="6" fill="#f0f3fa" stroke="#abb1c7" stroke-width="1.5"/>
    <circle cx="354" cy="160" r="6" fill="#f0f3fa" stroke="#abb1c7" stroke-width="1.5"/>
    <circle cx="440" cy="104" r="6" fill="#656b7f"/>
    <circle cx="448" cy="206" r="6" fill="#f0f3fa" stroke="#abb1c7" stroke-width="1.5"/>
    <circle cx="532" cy="148" r="5.5" fill="#00838f"/>
    <circle cx="532" cy="148" r="10" fill="none" stroke="#00838f" stroke-width="1.5"/>
    <circle cx="548" cy="62" r="6" fill="#656b7f"/>
    <circle cx="64" cy="124" r="11" fill="none" stroke="#dc244c" stroke-width="2"/>
    <text x="64" y="154" font-size="12.5" text-anchor="middle" fill="#303547">entry point</text>
    <text x="532" y="180" font-size="12.5" text-anchor="middle" fill="#303547">result</text>
    <circle cx="596" cy="148" r="9" fill="#f0f3fa" stroke="#dc244c" stroke-width="2.5"/>
    <circle cx="596" cy="148" r="3.5" fill="#dc244c"/>
    <text x="596" y="180" font-size="12.5" text-anchor="middle" fill="#303547">query</text>
    <line x1="16" y1="252" x2="624" y2="252" stroke="#d3d9eb" stroke-width="1.5"/>
    <circle cx="36" cy="276" r="6" fill="#656b7f"/>
    <text x="52" y="281" font-size="12.5" fill="#303547">matches the filter</text>
    <circle cx="232" cy="276" r="6" fill="#f0f3fa" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="248" y="281" font-size="12.5" fill="#303547">filtered out</text>
    <path d="M400 276 H436" fill="none" stroke="#dc244c" stroke-width="2.2" marker-end="url(#arrow-accent)"/>
    <text x="446" y="281" font-size="12.5" fill="#303547">search path</text>
  </g>
</svg>
