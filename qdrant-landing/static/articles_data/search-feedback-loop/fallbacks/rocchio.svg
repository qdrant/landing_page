<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
<title id="title">Rocchio’s relevance feedback method: the query moves toward the centroid of the relevant documents and away from the centroid of the non-relevant ones. The plane is a 2D illustration with seeded points.</title>
<desc id="desc">With β = 0.3 and γ = 0.15, the query moves toward the positive centroid and away from the negative one. The weights are small, so the query stays close to the original. Points are illustrative.</desc>
