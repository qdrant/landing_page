<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-label="A plain segment built with configuration 1 is rebuilt as a hatched segment with configuration 2 after a configuration change."><style>
.seg { fill: #abb1c7; fill-opacity: 0.35; stroke: #d3d9eb; stroke-width: 1; }
.hatch { fill: url(#hatch); opacity: 0.45; }
.hatch-line { stroke: #656b7f; stroke-width: 1.5; }
.seg.appendable { stroke: #303547; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 0.01 5; }
.seg.appendable.key { fill: none; stroke-width: 1.5; stroke-dasharray: 0.01 3; }
.badge circle { fill: #f0f3fa; stroke: #303547; stroke-width: 1.25; }
.badge path { fill: none; stroke: #303547; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.pt { fill: #6047ff; }
.pt.deleted { fill: #abb1c7; }
.name { fill: #303547; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.name.small { font-size: 9px; }
.label { fill: #656b7f; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.arrow { fill: none; stroke: #656b7f; stroke-width: 1.5; stroke-linecap: round; }
.head { fill: #656b7f; }
@media (prefers-color-scheme: dark) {
  .seg { fill: #4e5366; stroke: #303547; }
  .hatch { opacity: 0.7; }
  .hatch-line { stroke: #898ea3; }
  .seg.appendable { stroke: #e2e7f5; }
  .badge circle { fill: #111824; stroke: #e2e7f5; }
  .badge path { stroke: #e2e7f5; }
  .pt.deleted { fill: #656b7f; }
  .name { fill: #e2e7f5; }
  .label { fill: #898ea3; }
  .arrow { stroke: #898ea3; }
  .head { fill: #898ea3; }
}
