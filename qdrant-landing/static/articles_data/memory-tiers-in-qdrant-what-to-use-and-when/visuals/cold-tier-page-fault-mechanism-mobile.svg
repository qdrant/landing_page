<text class="head" x="130" y="90">Full precision, cold</text>
<text class="small muted" x="130" y="118">A page holds only a few</text>
<text class="small muted" x="130" y="142">full vectors, so most</text>
<text class="small muted" x="130" y="166">candidates need their</text>
<text class="small muted" x="130" y="190">own disk read.</text>
<text class="head" x="130" y="240">Compressed copy</text>
<text class="small muted" x="130" y="268">The same page holds many</text>
<text class="small muted" x="130" y="292">compressed vectors, so</text>
<text class="small muted" x="130" y="316">one read serves far</text>
<text class="small muted" x="130" y="340">more candidates.</text>
<line x1="24" x2="456" y1="376" y2="376" stroke="#d3d9eb"/>
<text class="head" x="24" y="414">Read cost across one</text>
<text class="head" x="24" y="440">query's graph traversal</text>
<text class="note" x="24" y="466">conceptual, not to scale</text>
