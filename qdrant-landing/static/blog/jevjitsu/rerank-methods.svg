<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1143" viewBox="0 0 420 1143" role="img" aria-labelledby="t d">
<title id="t">Three ways to rerank with Jev</title>
<desc id="d">Query goes to Qdrant retrieval with BGE-small, which returns the top k candidates. Jev Score grades each candidate on a scale of 0 to 2: Doc A 1.6, Doc B 0.4, Doc C 1.9, Doc D 1.1, ranked C, A, D, B, with one request and one question per candidate. Jev Choice compares all candidates in one question and returns probabilities that sum to 1: Doc A 0.35, Doc B 0.05, Doc C 0.48, Doc D 0.12, ranked C, A, D, B, with one request for the whole pool. Jev Iterative repeats Choice, picking the best remaining candidate each round: C, then A, then D, until the top 10 are filled, with one request per position, 10 per query.</desc>
