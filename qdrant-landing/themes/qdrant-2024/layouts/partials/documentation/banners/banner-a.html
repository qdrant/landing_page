<section class="docs-core__hero">
  <h1 class="docs-core__hero-title">{{ .title }}</h1>
  <p class="docs-core__hero-description">{{ .description }}</p>
  {{ with .linkDescription }}<p class="docs-core__hero-link">{{ . | safeHTML }}</p>{{ end }}
  {{ if or .cloudButton .localButton }}
  <div class="docs-core__hero-buttons">
    <a
      href="{{ .cloudButton.url }}"
      {{ if strings.HasPrefix .cloudButton.url "https://" }}target="_blank"{{ end }}
      class="button button_contained button_sm"
    >
      {{ .cloudButton.text }}
    </a>
    <a
      href="{{ .localButton.url }}"
      {{ if strings.HasPrefix .localButton.url "https://" }}target="_blank"{{ end }}
      class="button button_outlined button_sm"
    >
      {{ .localButton.text }}
    </a>
  </div>
  {{ end }}
</section>
