<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 0 772 268" role="img" aria-label="Two-stage search: with limit 10 and oversampling 2.0 the quantized copy returns 20 candidates by rough score, the true neighbor at rank 14 among them. With rescoring off the top 10 rough scores are final and it is discarded. With rescoring on the 20 originals are re-scored and it climbs to position 4 of the returned 10. The ranks are illustrative.">
<style>
.qrs-h { fill: #656b7f; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 15px; }
.qrs-n { fill: #303547; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12px; }
.qrs-n.is-hit { fill: #ffffff; }
.qrs-n.is-miss { fill: #dc244c; }
.qrs-cell { fill: none; stroke: #d3d9eb; stroke-width: 1.5; }
.qrs-cell.is-hit { fill: #6047ff; stroke: #6047ff; }
.qrs-cell.is-miss { stroke: #dc244c; stroke-dasharray: 4 3; }
.qrs-note { fill: #dc244c; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 15px; }
.qrs-keep { fill: #00838f; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 15px; }
</style>
<text class="qrs-h" x="0" y="14">Step 1: the quantized copy returns 20 candidates (10 x 2.0), rough-score order</text><rect class="qrs-cell" x="0.0" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="10.5" y="43" text-anchor="middle">1</text><rect class="qrs-cell" x="25.3" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="35.8" y="43" text-anchor="middle">2</text><rect class="qrs-cell" x="50.7" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="61.2" y="43" text-anchor="middle">3</text><rect class="qrs-cell" x="76.0" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="86.5" y="43" text-anchor="middle">4</text><rect class="qrs-cell" x="101.3" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="111.8" y="43" text-anchor="middle">5</text><rect class="qrs-cell" x="126.7" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="137.2" y="43" text-anchor="middle">6</text><rect class="qrs-cell" x="152.0" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="162.5" y="43" text-anchor="middle">7</text><rect class="qrs-cell" x="177.3" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="187.8" y="43" text-anchor="middle">8</text><rect class="qrs-cell" x="202.7" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="213.2" y="43" text-anchor="middle">9</text><rect class="qrs-cell" x="228.0" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="238.5" y="43" text-anchor="middle">10</text><rect class="qrs-cell" x="253.3" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="263.8" y="43" text-anchor="middle">11</text><rect class="qrs-cell" x="278.7" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="289.2" y="43" text-anchor="middle">12</text><rect class="qrs-cell" x="304.0" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="314.5" y="43" text-anchor="middle">13</text><rect class="qrs-cell is-hit" x="329.3" y="26" width="21" height="26" rx="4"/><text class="qrs-n is-hit" x="339.8" y="43" text-anchor="middle">14</text><rect class="qrs-cell" x="354.7" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="365.2" y="43" text-anchor="middle">15</text><rect class="qrs-cell" x="380.0" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="390.5" y="43" text-anchor="middle">16</text><rect class="qrs-cell" x="405.3" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="415.8" y="43" text-anchor="middle">17</text><rect class="qrs-cell" x="430.7" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="441.2" y="43" text-anchor="middle">18</text><rect class="qrs-cell" x="456.0" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="466.5" y="43" text-anchor="middle">19</text><rect class="qrs-cell" x="481.3" y="26" width="21" height="26" rx="4"/><text class="qrs-n" x="491.8" y="43" text-anchor="middle">20</text>
<text class="qrs-h" x="0" y="88">Rescoring off: the rough scores are final, the top 10 are returned as-is</text><rect class="qrs-cell" x="0.0" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="10.5" y="117" text-anchor="middle">1</text><rect class="qrs-cell" x="25.3" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="35.8" y="117" text-anchor="middle">2</text><rect class="qrs-cell" x="50.7" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="61.2" y="117" text-anchor="middle">3</text><rect class="qrs-cell" x="76.0" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="86.5" y="117" text-anchor="middle">4</text><rect class="qrs-cell" x="101.3" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="111.8" y="117" text-anchor="middle">5</text><rect class="qrs-cell" x="126.7" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="137.2" y="117" text-anchor="middle">6</text><rect class="qrs-cell" x="152.0" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="162.5" y="117" text-anchor="middle">7</text><rect class="qrs-cell" x="177.3" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="187.8" y="117" text-anchor="middle">8</text><rect class="qrs-cell" x="202.7" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="213.2" y="117" text-anchor="middle">9</text><rect class="qrs-cell" x="228.0" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="238.5" y="117" text-anchor="middle">10</text><text class="qrs-note" x="0" y="152">the true neighbor at rough rank 14 is discarded with the extra 10</text>
<g transform="translate(0,110)"><text class="qrs-h" x="0" y="88">Step 2: rescoring reads 20 originals, re-sorts by exact score, returns the top 10</text><rect class="qrs-cell" x="0.0" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="10.5" y="117" text-anchor="middle">2</text><rect class="qrs-cell" x="25.3" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="35.8" y="117" text-anchor="middle">1</text><rect class="qrs-cell" x="50.7" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="61.2" y="117" text-anchor="middle">3</text><rect class="qrs-cell is-hit" x="76.0" y="100" width="21" height="26" rx="4"/><text class="qrs-n is-hit" x="86.5" y="117" text-anchor="middle">14</text><rect class="qrs-cell" x="101.3" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="111.8" y="117" text-anchor="middle">4</text><rect class="qrs-cell" x="126.7" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="137.2" y="117" text-anchor="middle">6</text><rect class="qrs-cell" x="152.0" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="162.5" y="117" text-anchor="middle">5</text><rect class="qrs-cell" x="177.3" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="187.8" y="117" text-anchor="middle">7</text><rect class="qrs-cell" x="202.7" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="213.2" y="117" text-anchor="middle">9</text><rect class="qrs-cell" x="228.0" y="100" width="21" height="26" rx="4"/><text class="qrs-n" x="238.5" y="117" text-anchor="middle">8</text><text class="qrs-keep" x="0" y="152">the true neighbor climbs from rough rank 14 to position 4 of the returned 10</text></g>
</svg>
