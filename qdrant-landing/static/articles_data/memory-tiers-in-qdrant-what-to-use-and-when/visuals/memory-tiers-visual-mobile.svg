<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 756" width="480" height="756" role="img" aria-labelledby="t d">
<title id="t">Qdrant's three memory tiers</title>
<desc id="d">Any structure picks one of three tiers independently. Cold lives on disk: low RAM, slowest. Cached lives in the OS page cache in RAM: high RAM, evictable. Pinned lives on the heap in RAM: fixed RAM, fastest.</desc>
<style>
  text { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #303547; }
  .title { font-size: 23px; font-weight: 600; }
  .head { font-size: 21px; font-weight: 600; }
  .label { font-size: 21px; }
  .small { font-size: 20px; }
  .note { font-size: 19px; fill: #656b7f; }
  .muted { fill: #656b7f; }
  .axis { stroke: #abb1c7; stroke-width: 1.5; fill: none; }
</style>
<rect x="0.5" y="0.5" width="479" height="755" rx="12" fill="#f0f3fa" stroke="#d3d9eb"/>
<defs><marker id="mt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#abb1c7"/></marker></defs>
<rect x="24" y="20" width="432" height="76" rx="8" fill="#ffffff" stroke="#abb1c7" stroke-dasharray="5 4"/>
<text class="label" x="240" y="52" text-anchor="middle">Any structure picks</text>
<text class="label" x="240" y="78" text-anchor="middle">a tier, independently</text>
<path d="M34 96 V638" class="axis" stroke-width="2"/>
<path d="M34 214 H44" class="axis" stroke-width="2" marker-end="url(#mt-arrow)"/>
<path d="M34 426 H44" class="axis" stroke-width="2" marker-end="url(#mt-arrow)"/>
<path d="M34 638 H44" class="axis" stroke-width="2" marker-end="url(#mt-arrow)"/>
<rect x="48" y="116" width="408" height="196" rx="10" fill="#ffffff" stroke="#d3d9eb"/>
<text class="label" x="68" y="152" style="font-size:25px;font-weight:600;fill:#6047ff">Cold</text>
<text class="note" x="436" y="150" text-anchor="end">on disk</text>
<rect x="68" y="168" width="368" height="88" rx="8" fill="#f0f3fa" stroke="#6047ff" stroke-width="1.5"/>
<text class="label" x="252.0" y="194" text-anchor="middle">Disk</text>
<circle cx="194.0" cy="228" r="7" fill="#6047ff"/>
<circle cx="222.0" cy="220" r="7" fill="#6047ff"/>
<circle cx="238.0" cy="238" r="7" fill="#6047ff"/>
<circle cx="270.0" cy="242" r="7" fill="#6047ff"/>
<circle cx="300.0" cy="230" r="7" fill="#6047ff"/>
<rect x="137.0" y="272" width="110.0" height="34" rx="17.0" fill="#c2c5ff"/><text x="192.0" y="296.0" text-anchor="middle" style="font-size:20px;fill:#303547">low RAM</text>
<rect x="257.0" y="272" width="110.0" height="34" rx="17.0" fill="#c2c5ff"/><text x="312.0" y="296.0" text-anchor="middle" style="font-size:20px;fill:#303547">slowest</text>
<rect x="48" y="328" width="408" height="196" rx="10" fill="#ffffff" stroke="#d3d9eb"/>
<text class="label" x="68" y="364" style="font-size:25px;font-weight:600;fill:#9c27b0">Cached</text>
<text class="note" x="436" y="362" text-anchor="end">in RAM</text>
<rect x="68" y="380" width="368" height="88" rx="8" fill="#f0f3fa" stroke="#9c27b0" stroke-width="1.5"/>
<text class="label" x="252.0" y="406" text-anchor="middle">OS page cache</text>
<circle cx="194.0" cy="440" r="7" fill="#9c27b0"/>
<circle cx="222.0" cy="432" r="7" fill="#9c27b0"/>
<circle cx="238.0" cy="450" r="7" fill="#9c27b0"/>
<circle cx="270.0" cy="454" r="7" fill="#9c27b0"/>
<circle cx="300.0" cy="442" r="7" fill="#9c27b0"/>
<rect x="119.0" y="484" width="122.0" height="34" rx="17.0" fill="#e1bee7"/><text x="180.0" y="508.0" text-anchor="middle" style="font-size:20px;fill:#303547">high RAM</text>
<rect x="251.0" y="484" width="134.0" height="34" rx="17.0" fill="#e1bee7"/><text x="318.0" y="508.0" text-anchor="middle" style="font-size:20px;fill:#303547">evictable</text>
<rect x="48" y="540" width="408" height="196" rx="10" fill="#ffffff" stroke="#d3d9eb"/>
