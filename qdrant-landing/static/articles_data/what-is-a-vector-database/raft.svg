<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="description">
  <desc id="description">A collection's points are split into three non-overlapping shards, one on each of three nodes. All nodes take part in Raft consensus, which keeps the cluster state in sync: peers, collections, shard placement, and shard transfers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#656b7f"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="639" height="239" rx="6" fill="#f0f3fa" stroke="#d3d9eb" stroke-width="1"/>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="20" y="20" width="184" height="104" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="36" y="46" font-size="14" fill="#303547">Node 1</text>
    <rect x="36" y="64" width="152" height="36" rx="6" fill="none" stroke="#6047ff" stroke-width="1.5"/>
    <text x="112" y="87" font-size="14" text-anchor="middle" fill="#303547">Shard 1</text>
    <line x1="112" y1="124" x2="112" y2="160" stroke="#656b7f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="228" y="20" width="184" height="104" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="244" y="46" font-size="14" fill="#303547">Node 2</text>
    <rect x="244" y="64" width="152" height="36" rx="6" fill="none" stroke="#00838f" stroke-width="1.5"/>
    <text x="320" y="87" font-size="14" text-anchor="middle" fill="#303547">Shard 2</text>
    <line x1="320" y1="124" x2="320" y2="160" stroke="#656b7f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="436" y="20" width="184" height="104" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="452" y="46" font-size="14" fill="#303547">Node 3</text>
    <rect x="452" y="64" width="152" height="36" rx="6" fill="none" stroke="#9c27b0" stroke-width="1.5"/>
    <text x="528" y="87" font-size="14" text-anchor="middle" fill="#303547">Shard 3</text>
    <line x1="528" y1="124" x2="528" y2="160" stroke="#656b7f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="20" y="160" width="600" height="60" rx="6" fill="none" stroke="#dc244c" stroke-width="1.5"/>
    <text x="320" y="185" font-size="14" text-anchor="middle" fill="#303547">Raft consensus</text>
    <text x="320" y="206" font-size="12" text-anchor="middle" fill="#656b7f">peers · collections · shard placement · transfers</text>
  </g>
</svg>
