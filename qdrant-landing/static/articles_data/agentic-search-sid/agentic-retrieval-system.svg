<svg xmlns="http://www.w3.org/2000/svg" width="1688" height="822" viewBox="0 0 1688 822" role="img" aria-labelledby="title desc">
  <title id="title">SID-1 agentic retrieval loop with Qdrant</title>
  <desc id="desc">An application delegates retrieval decisions to SID-1 and Qdrant provides hybrid, text search, and read-by-ID tools.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#526382"/>
    </marker>
    <style>
      .title { fill:#263554; font-family:Courier; font-size:31px; font-weight:600; }
      .subtitle { fill:#627394; font-family:Courier; font-size:16px; font-weight:500; letter-spacing:.2px; }
      .body { fill:#2c3a58; font-family:Courier; font-size:20px; font-weight:500; }
      .label { fill:#526382; font-family:Courier; font-size:16px; font-weight:500; }
      .chip { fill:#2c3a58; font-family:Courier; font-size:15px; font-weight:500; }
    </style>
  </defs>

  <rect width="1688" height="822" rx="24" fill="#fafbff"/>

  <!-- Local application -->
  <rect x="72" y="94" width="680" height="634" rx="20" fill="#f3f6ff" stroke="#8395bd" stroke-width="2.5" stroke-dasharray="11 11"/>
  <text x="112" y="151" class="title">Your backend</text>
  <text x="113" y="181" class="subtitle">local application + loop</text>

  <rect x="112" y="216" width="570" height="125" rx="14" fill="#ffffff" stroke="#d1d9e9" stroke-width="2"/>
  <text x="147" y="269" class="body">Application</text>
  <text x="147" y="305" class="label">question → ranked passages</text>

  <rect x="444" y="388" width="215" height="36" rx="8" fill="#ffffff" stroke="#d1d9e9" stroke-width="1.5"/>
  <text x="469" y="412" class="label">question / result</text>
  <path d="M397 363 V448" fill="none" stroke="#526382" stroke-width="2.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect x="112" y="470" width="570" height="200" rx="15" fill="#ffffff" stroke="#316cff" stroke-width="2.5"/>
  <text x="150" y="522" class="title">SidRetriever</text>
  <text x="150" y="558" class="label">conversation state · tool dispatch</text>
  <rect x="150" y="600" width="140" height="42" rx="9" fill="#dce7ff"/>
  <rect x="306" y="600" width="150" height="42" rx="9" fill="#dce7ff"/>
  <rect x="472" y="600" width="172" height="42" rx="9" fill="#dce7ff"/>
  <text x="171" y="627" class="chip">messages[]</text>
  <text x="332" y="627" class="chip">tool calls</text>
  <text x="501" y="627" class="chip">turn budget</text>

  <!-- Hosted SID API -->
  <rect x="1020" y="112" width="596" height="250" rx="18" fill="#eadcff" stroke="#7c42ff" stroke-width="2.5"/>
  <text x="1060" y="170" class="title">SID backend</text>
  <text x="1061" y="201" class="subtitle">hosted · OpenAI-compatible API</text>
  <rect x="1060" y="233" width="516" height="66" rx="12" fill="#ffffff" stroke="#d7cee7" stroke-width="1.5"/>
  <text x="1148" y="275" class="body">SID-1 chooses the next tool</text>

  <!-- Qdrant -->
  <rect x="1020" y="458" width="596" height="232" rx="18" fill="#ffe0e0" stroke="#f2385a" stroke-width="2.5"/>
  <text x="1060" y="514" class="title">Qdrant cluster</text>
  <text x="1061" y="546" class="subtitle">separate service · collection + payload</text>
  <rect x="1060" y="582" width="150" height="50" rx="11" fill="#ffffff" stroke="#ff8c9d" stroke-width="1.5"/>
  <rect x="1223" y="582" width="160" height="50" rx="11" fill="#ffffff" stroke="#ff8c9d" stroke-width="1.5"/>
  <rect x="1396" y="582" width="180" height="50" rx="11" fill="#ffffff" stroke="#ff8c9d" stroke-width="1.5"/>
  <text x="1106" y="614" class="chip">hybrid</text>
  <text x="1253" y="614" class="chip">text_search</text>
  <text x="1440" y="614" class="chip">read by ID</text>

  <!-- API tool-call path -->
  <path d="M682 520 H770 V241 H1020" fill="none" stroke="#526382" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="800" y="340" width="190" height="60" rx="8" fill="#fafbff" stroke="#d1d9e9" stroke-width="1.25"/>
  <text x="818" y="364" class="label">messages /</text>
  <text x="818" y="387" class="label">tool calls</text>

  <!-- Qdrant query path -->
  <path d="M682 610 H1020" fill="none" stroke="#526382" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="800" y="520" width="190" height="60" rx="8" fill="#fafbff" stroke="#d1d9e9" stroke-width="1.25"/>
  <text x="818" y="544" class="label">queries /</text>
  <text x="818" y="567" class="label">passages</text>
</svg>
