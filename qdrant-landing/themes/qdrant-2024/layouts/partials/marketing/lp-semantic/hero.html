{{ with (.Site.GetPage "/lp-semantic/hero") }}
  <section class="lp-semantic-hero">
    <div class="container">
      <div class="lp-semantic-hero__copy">
        <p class="lp-semantic-hero__label">{{ .Params.label }}</p>
        <h1 class="lp-semantic-hero__title">{{ .Params.title }}</h1>
        <p class="lp-semantic-hero__description">{{ .Params.description }}</p>
        {{ with .Params.proof }}<p class="lp-semantic-hero__description lp-semantic-hero__proof">{{ . | markdownify }}</p>{{ end }}
        <div class="lp-semantic-hero__actions">
          {{ with .Params.button }}
            <a href="{{ .url }}" class="button button_contained button_lg" {{ if strings.HasPrefix .url "http" }}target="_blank" rel="noopener noreferrer"{{ end }}>{{ .text }}</a>
          {{ end }}
          {{ with .Params.outlineButton }}
            <a href="{{ .url }}" class="button button_outlined button_lg" {{ if strings.HasPrefix .url "http" }}target="_blank" rel="noopener noreferrer"{{ end }}>{{ .text }}</a>
          {{ end }}
        </div>
      </div>
    </div>
  </section>
{{ end }}
