<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="desc"><desc id="desc">Geohash cells narrow stored locations to candidates, followed by an exact polygon check.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#576280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f0f3fa"/><rect x="80" y="30" width="480" height="90" rx="14" fill="white" stroke="#b4bacc" stroke-width="2"/><text x="320.0" y="83.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">Locations in geohash cells</text><path d="M320 120 L320 175" fill="none" stroke="#576280" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="180" width="480" height="90" rx="14" fill="white" stroke="#009688" stroke-width="2"/><text x="320.0" y="233.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">Cells overlapping polygon</text><path d="M320 270 L320 325" fill="none" stroke="#576280" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="330" width="480" height="110" rx="14" fill="white" stroke="#dc244c" stroke-width="2"/><text x="320.0" y="377.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">Check candidate locations</text><text x="320.0" y="409.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">against polygon boundary</text></svg>
