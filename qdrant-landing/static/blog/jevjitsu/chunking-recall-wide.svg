<svg xmlns="http://www.w3.org/2000/svg" width="680" height="596" viewBox="0 0 680 596" role="img" aria-labelledby="t d"><title id="t">Fixed-size chunks split the answer, Jev chunks keep it together</title><desc id="d">For the question "What language is this dataset in?", fixed-size chunks 26 and 27, 200 tokens each, split the answer about the Phoenix dataset across two chunks. Jev chunk 25, 420 tokens, holds the whole answer in one chunk.</desc><rect width="680" height="596" fill="#f0f3fa"/><g font-family="'Mona Sans', -apple-system, 'Segoe UI', sans-serif"><rect x="8" y="8" width="664" height="70" rx="6" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="20" y="32" font-size="14" fill="#656b7f" textLength="56.03" lengthAdjust="spacing">Question</text><text x="88.03" y="32" font-size="16" font-weight="700" fill="#303547">What language is this dataset in?</text><text x="20" y="56" font-size="14" fill="#656b7f">paper: Creating a Real-Time, Reproducible Event Dataset</text><g transform="translate(0,78)"><rect x="8" y="8" width="326" height="502" rx="6" fill="#dc244c" fill-opacity="0.08" stroke="#dc244c" stroke-width="1.5"/><text x="20" y="42" font-size="18" font-weight="700" fill="#303547" textLength="155.05" lengthAdjust="spacing">Fixed-size chunks</text><rect x="20" y="54" width="224.85" height="26" rx="13" fill="#dc244c"/><text x="34" y="72" font-size="14" font-weight="700" fill="#ffffff" textLength="196.85" lengthAdjust="spacing">Answer split across 2 chunks</text><text x="20" y="102" font-size="14" fill="#656b7f" textLength="275.86" lengthAdjust="spacing">Always cut every ~200 tokens, no matter the</text><text x="20" y="122" font-size="14" fill="#656b7f" textLength="49.81" lengthAdjust="spacing">content.</text><rect x="20" y="140" width="302" height="184" rx="6" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="32" y="166" font-size="14" font-weight="700" fill="#303547" textLength="63.01" lengthAdjust="spacing">Chunk 26</text><text x="107.01" y="166" font-size="14" fill="#656b7f" textLength="68.5" lengthAdjust="spacing">200 tokens</text><text x="32" y="194" font-size="14" fill="#303547" textLength="248.23" lengthAdjust="spacing">... wrapped as Docker containers, which</text><text x="32" y="216" font-size="14" fill="#303547" textLength="196.11" lengthAdjust="spacing">allows for easy deployment and</text><text x="32" y="238" font-size="14" fill="#303547" textLength="267.69" lengthAdjust="spacing">transportability of applications. Thus, with a</text><text x="32" y="260" font-size="14" fill="#303547" textLength="232.68" lengthAdjust="spacing">single command users are capable of</text><text x="32" y="282" font-size="14" fill="#303547" textLength="266.18" lengthAdjust="spacing">standing up an easy-to-use API around the</text><text x="32" y="304" font-size="14" fill="#303547" textLength="223.35" lengthAdjust="spacing">two main event coding components.</text><rect x="20" y="336" width="302" height="162" rx="6" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="32" y="362" font-size="14" font-weight="700" fill="#303547" textLength="63.01" lengthAdjust="spacing">Chunk 27</text><text x="107.01" y="362" font-size="14" fill="#656b7f" textLength="68.5" lengthAdjust="spacing">200 tokens</text><rect x="29" y="376" width="264.38" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="398" width="234.05" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="420" width="251.94" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="442" width="281.49" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="464" width="117.28" height="20" rx="3" fill="#ffe0b2"/><text x="32" y="390" font-size="14" fill="#303547" textLength="258.38" lengthAdjust="spacing">The Phoenix dataset is an attempt to take</text><text x="32" y="412" font-size="14" fill="#303547" textLength="228.05" lengthAdjust="spacing">both the new advances in event data</text><text x="32" y="434" font-size="14" fill="#303547" textLength="245.94" lengthAdjust="spacing">described above, along with decades of</text><text x="32" y="456" font-size="14" fill="#303547" textLength="275.49" lengthAdjust="spacing">knowledge regarding best practices, in order</text><text x="32" y="478" font-size="14" fill="#303547" textLength="111.28" lengthAdjust="spacing">to create a new ...</text><rect x="346" y="8" width="326" height="502" rx="6" fill="#c0f0f0" fill-opacity="0.45" stroke="#038585" stroke-width="1.5"/><text x="358" y="42" font-size="18" font-weight="700" fill="#303547" textLength="98.05" lengthAdjust="spacing">Jev chunks</text><rect x="358" y="54" width="168.8" height="26" rx="13" fill="#c0f0f0" stroke="#038585" stroke-width="1.5"/><text x="372" y="72" font-size="14" font-weight="700" fill="#004f4f" textLength="140.8" lengthAdjust="spacing">Answer in one chunk</text><text x="358" y="102" font-size="14" fill="#656b7f" textLength="181.33" lengthAdjust="spacing">Cut where the topic changes.</text><rect x="358" y="120" width="302" height="294" rx="6" fill="#ffffff" stroke="#038585" stroke-width="1.5"/><text x="370" y="146" font-size="14" font-weight="700" fill="#303547" textLength="63.01" lengthAdjust="spacing">Chunk 25</text><text x="445.01" y="146" font-size="14" fill="#656b7f" textLength="68.5" lengthAdjust="spacing">420 tokens</text><rect x="367" y="160" width="264.38" height="20" rx="3" fill="#ffe0b2"/><rect x="367" y="182" width="234.05" height="20" rx="3" fill="#ffe0b2"/><rect x="367" y="204" width="251.94" height="20" rx="3" fill="#ffe0b2"/><rect x="367" y="226" width="281.49" height="20" rx="3" fill="#ffe0b2"/><rect x="367" y="248" width="272.16" height="20" rx="3" fill="#ffe0b2"/><rect x="367" y="270" width="278.41" height="20" rx="3" fill="#ffe0b2"/><rect x="367" y="292" width="265.12" height="20" rx="3" fill="#ffe0b2"/><rect x="367" y="314" width="281.5" height="20" rx="3" fill="#ffe0b2"/><rect x="367" y="336" width="251.94" height="20" rx="3" fill="#ffe0b2"/><rect x="367" y="358" width="273.45" height="20" rx="3" fill="#ffe0b2"/><rect x="367" y="380" width="203.7" height="20" rx="3" fill="#ffe0b2"/><text x="370" y="174" font-size="14" fill="#303547" textLength="258.38" lengthAdjust="spacing">The Phoenix dataset is an attempt to take</text><text x="370" y="196" font-size="14" fill="#303547" textLength="228.05" lengthAdjust="spacing">both the new advances in event data</text><text x="370" y="218" font-size="14" fill="#303547" textLength="245.94" lengthAdjust="spacing">described above, along with decades of</text><text x="370" y="240" font-size="14" fill="#303547" textLength="275.49" lengthAdjust="spacing">knowledge regarding best practices, in order</text><text x="370" y="262" font-size="14" fill="#303547" textLength="266.16" lengthAdjust="spacing">to create a new iteration of event data. The</text><text x="370" y="284" font-size="14" fill="#303547" textLength="272.41" lengthAdjust="spacing">dataset makes use of 450 English-language</text><text x="370" y="306" font-size="14" fill="#303547" textLength="259.12" lengthAdjust="spacing">news sites, which are each scraped every</text><text x="370" y="328" font-size="14" fill="#303547" textLength="275.5" lengthAdjust="spacing">hour for new content. New data is generated</text><text x="370" y="350" font-size="14" fill="#303547" textLength="245.94" lengthAdjust="spacing">on a daily basis, coded according to the</text><text x="370" y="372" font-size="14" fill="#303547" textLength="267.45" lengthAdjust="spacing">CAMEO event ontology, with an average of</text><text x="370" y="394" font-size="14" fill="#303547" textLength="197.7" lengthAdjust="spacing">2,200 events generated per day</text><text x="571.7" y="394" font-size="14" fill="#303547" textLength="11.67" lengthAdjust="spacing">...</text></g></g></svg>