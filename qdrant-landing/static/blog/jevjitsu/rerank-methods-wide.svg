<text x="14" y="178" font-weight="700">Jev Iterative <tspan font-weight="400" fill="#656b7f">· 10 requests</tspan></text><text x="14" y="199" fill="#656b7f">"Which doc is most relevant?" per position</text><rect x="306" y="159" width="134" height="38" rx="8" fill="none" stroke="#abb1c7" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="312" y="165" width="26" height="26" rx="5" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="325.0" y="183" text-anchor="middle" font-weight="700">A</text><rect x="344" y="165" width="26" height="26" rx="5" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="357.0" y="183" text-anchor="middle" font-weight="700">B</text><rect x="376" y="165" width="26" height="26" rx="5" fill="#00838f" stroke="#00838f" stroke-width="1.5"/><text x="389.0" y="183" text-anchor="middle" font-weight="700" fill="#ffffff">C</text><rect x="408" y="165" width="26" height="26" rx="5" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="421.0" y="183" text-anchor="middle" font-weight="700">D</text><path d="M444 178.0h24m-6-5 6 5-6 5" fill="none" stroke="#656b7f" stroke-width="2"/><rect x="474" y="159" width="102" height="38" rx="8" fill="none" stroke="#abb1c7" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="480" y="165" width="26" height="26" rx="5" fill="#00838f" stroke="#00838f" stroke-width="1.5"/><text x="493.0" y="183" text-anchor="middle" font-weight="700" fill="#ffffff">A</text><rect x="512" y="165" width="26" height="26" rx="5" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="525.0" y="183" text-anchor="middle" font-weight="700">B</text><rect x="544" y="165" width="26" height="26" rx="5" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="557.0" y="183" text-anchor="middle" font-weight="700">D</text><path d="M580 178.0h24m-6-5 6 5-6 5" fill="none" stroke="#656b7f" stroke-width="2"/><rect x="610" y="159" width="70" height="38" rx="8" fill="none" stroke="#abb1c7" stroke-width="1.5" stroke-dasharray="4 3