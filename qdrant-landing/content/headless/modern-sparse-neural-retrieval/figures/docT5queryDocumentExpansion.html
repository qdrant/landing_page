<div class="snr-heading"><span class="snr-title" id="snr-title-10">docT5query</span><span class="snr-kind">External expansion · queries</span></div>
<div class="snr-lanes"><div class="snr-lane"><div class="snr-box snr-query"><span class="snr-label">Example query · not model input</span><p class="snr-passage">Can I send a money order from USPS as a business?</p></div></div><div class="snr-lane"><div class="snr-box snr-doc"><span class="snr-label">Document 42 · original passage</span><p class="snr-passage">Sure you can. You can fill in whatever you want in the From section of a money order, so your business name and address would be fine. The price only includes the money order itself. You can hand deliver it yourself if you want, but if you want to mail it, you&#x27;ll have to provide an envelope and a stamp.</p></div></div></div><div class="snr-arrow snr-doc-feed" aria-hidden="true"></div><div class="snr-box snr-model"><span class="snr-label">docT5query · T5 generative model</span><p class="snr-note">Generate likely queries, one token at a time.</p></div><div class="snr-arrow" aria-hidden="true"></div><div class="snr-box snr-doc"><span class="snr-label">Append generated queries to the document</span><ul class="snr-queries"><li>can you write a money order on a stub</li><li>can i mail money order to a contractor</li><li>how to send a money order</li><li>can you mail money order yourself</li><li>do i need a money order stamp</li><li>can you hand deliver a money order</li><li>how to send a money order without a stamp</li><li>can someone hand deliver money order</li><li>how long can someone deliver a money order</li></ul><p class="snr-note">Repeated terms remain, so term frequencies can also increase.</p></div>
<figcaption class="snr-caption">Generated queries are appended to the passage before a separate retriever indexes it. Repeated words can raise term frequency.</figcaption>
</figure>
