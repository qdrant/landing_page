<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" role="img" aria-labelledby="description">
  <desc id="description">One Query API call runs a sparse and a dense prefetch. Sparse search ranks doc C, A, D; dense search ranks doc A, B, C. Reciprocal Rank Fusion scores each document by its ranks in both lists, so the fused order is A, C, B, D.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#656b7f"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc244c"/>
    </marker>
    <marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6047ff"/>
    </marker>
  </defs>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="16" y="124" width="80" height="40" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.2"/>
    <text x="56" y="148.86" font-size="13.5" text-anchor="middle" fill="#303547">Query</text>
    <rect x="116" y="12" width="508" height="262" rx="6" fill="none" stroke="#d3d9eb" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="608" y="38" font-size="12.5" text-anchor="end" fill="#656b7f">Qdrant Query API</text>
    <text x="136" y="42" font-size="13.5" fill="#303547">sparse prefetch</text>
    <rect x="136" y="54" width="152" height="26" rx="4" fill="#00838f" fill-opacity="0.16"/>
    <text x="146" y="72" font-size="12.5" fill="#656b7f">1</text>
    <text x="170" y="72" font-size="13.5" fill="#303547">doc C</text>
    <rect x="136" y="84" width="152" height="26" rx="4" fill="#6047ff" fill-opacity="0.16"/>
    <text x="146" y="102" font-size="12.5" fill="#656b7f">2</text>
    <text x="170" y="102" font-size="13.5" fill="#303547">doc A</text>
    <rect x="136" y="114" width="152" height="26" rx="4" fill="#dc244c" fill-opacity="0.16"/>
    <text x="146" y="132" font-size="12.5" fill="#656b7f">3</text>
    <text x="170" y="132" font-size="13.5" fill="#303547">doc D</text>
    <text x="136" y="162" font-size="13.5" fill="#303547">dense prefetch</text>
    <rect x="136" y="174" width="152" height="26" rx="4" fill="#6047ff" fill-opacity="0.16"/>
    <text x="146" y="192" font-size="12.5" fill="#656b7f">1</text>
    <text x="170" y="192" font-size="13.5" fill="#303547">doc A</text>
    <rect x="136" y="204" width="152" height="26" rx="4" fill="#9c27b0" fill-opacity="0.16"/>
    <text x="146" y="222" font-size="12.5" fill="#656b7f">2</text>
    <text x="170" y="222" font-size="13.5" fill="#303547">doc B</text>
    <rect x="136" y="234" width="152" height="26" rx="4" fill="#00838f" fill-opacity="0.16"/>
    <text x="146" y="252" font-size="12.5" fill="#656b7f">3</text>
    <text x="170" y="252" font-size="13.5" fill="#303547">doc C</text>
    <path d="M96 144 H112 V83 H130" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M112 144 V203 H130" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="330" y="124" width="72" height="40" rx="6" fill="none" stroke="#dc244c" stroke-width="1.2"/>
    <text x="366" y="148.86" font-size="13.5" text-anchor="middle" fill="#303547">RRF</text>
    <path d="M288 83 H306 V134 H326" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M288 203 H306 V154 H326" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M402 144 H440" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="448" y="86" font-size="13.5" fill="#303547">fused</text>
    <rect x="448" y="98" width="160" height="26" rx="4" fill="#6047ff" fill-opacity="0.16"/>
    <text x="458" y="116" font-size="12.5" fill="#656b7f">1</text>
    <text x="482" y="116" font-size="13.5" fill="#303547">doc A</text>
    <rect x="448" y="128" width="160" height="26" rx="4" fill="#00838f" fill-opacity="0.16"/>
    <text x="458" y="146" font-size="12.5" fill="#656b7f">2</text>
    <text x="482" y="146" font-size="13.5" fill="#303547">doc C</text>
    <rect x="448" y="158" width="160" height="26" rx="4" fill="#9c27b0" fill-opacity="0.16"/>
    <text x="458" y="176" font-size="12.5" fill="#656b7f">3</text>
    <text x="482" y="176" font-size="13.5" fill="#303547">doc B</text>
    <rect x="448" y="188" width="160" height="26" rx="4" fill="#dc244c" fill-opacity="0.16"/>
    <text x="458" y="206" font-size="12.5" fill="#656b7f">4</text>
    <text x="482" y="206" font-size="13.5" fill="#303547">doc D</text>
  </g>
</svg>
