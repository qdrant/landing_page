    <text x="184" y="156" font-size="14" fill="#303547">collection_b</text>
    <text x="184" y="177" font-size="13" fill="#656b7f">Dot product</text>
    <rect x="168" y="208" width="136" height="62" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="184" y="234" font-size="14" fill="#303547">collection_c</text>
    <text x="184" y="255" font-size="13" fill="#656b7f">Euclidean</text>
    <path d="M304 161 H324" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="340" y="64" width="268" height="212" rx="6" fill="#f0f3fa" stroke="#abb1c7" stroke-width="1.5"/>
