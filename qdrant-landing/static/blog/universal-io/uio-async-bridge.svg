<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" role="img" aria-labelledby="t d" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<title id="t">Async bridge between the caller thread and Tokio workers</title><desc id="d">The caller schedules reads A, B, and C, each spawned onto a Tokio worker, then calls wait() three times. Replies return in finish order: B, C, A.</desc>
