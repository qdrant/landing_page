<text class="head" x="146" y="128">Full precision, cold</text>
<text class="small muted" x="146" y="156">A page holds only a</text>
<text class="small muted" x="146" y="180">few full vectors, so</text>
<text class="small muted" x="146" y="204">most candidates need</text>
<text class="small muted" x="146" y="228">their own disk read.</text>
<text class="head" x="146" y="288">Compressed copy</text>
<text class="small muted" x="146" y="316">The same page holds</text>
<text class="small muted" x="146" y="340">many compressed</text>
<text class="small muted" x="146" y="364">vectors, so one read</text>
<text class="small muted" x="146" y="388">serves far more</text>
<text class="small muted" x="146" y="412">candidates.</text>
<text class="head" x="444" y="56">Read cost across one query's</text>
<text class="head" x="444" y="82">graph traversal</text>
<text class="note" x="444" y="108">conceptual, not to scale</text>
