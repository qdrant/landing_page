<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 0 772 268" role="img" aria-label="Two-stage search: oversampling fetches 20 candidates from the quantized copy by rough score, the true neighbor at rank 14 among them. With rescoring off the top 10 rough scores are returned and it is lost. With rescoring on the 20 originals are re-scored and it is recovered. The ranks are illustrative.">
<style>
.qrs-h { fill: #656b7f; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 15px; }
.qrs-n { fill: #303547; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12px; }
.qrs-n.is-hit { fill: #ffffff; }
.qrs-cell { fill: none; stroke: #d3d9eb; stroke-width: 1.5; }
.qrs-cell.is-hit { fill: #6047ff; stroke: #6047ff; }
.qrs-note { fill: #dc244c; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 15px; }
.qrs-keep { fill: #00838f; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 15px; }
</style>
<text class="qrs-h" x="0" y="14">Step 1: oversampling fetches 20 candidates (limit 10 x 2.0), rough-score order</text><rect class="qrs-cell" x="0.0" y="26" width="33" height="26" rx="4"/><text class="qrs-n" x="16.5" y="43" text-anchor="middle">1</text><rect class="qrs-cell" x="38.0" y="26" width="33" height="26" rx="4"/><text class="qrs-n" x="54.5" y="43" text-anchor="middle">2</text><rect class="qrs-cell" x="76.0" y="26" width="33" height="26" rx="4"/><text class="qrs-n" x="92.5" y="43" text-anchor="middle">3</text><rect class="qrs-cell" x="114.0" y="26" width="33" height="26" rx="4"/><text class="qrs-n" x="130.5" y="43" text-anchor="middle">4</text><rect class="qrs-cell" x="152.0" y="26" width="33" height="26" rx="4"/><text class="qrs-n" x="168.5" y="43" text-anchor="middle">5</text><rect class="qrs-cell" x="190.0" y="26" width="33" height="26" rx="4"/><text class="qrs-n" x="206.5" y="43" text-anchor="middle">6</text><rect class="qrs-cell" x="228.0" y="26" width="33" height="26" rx="4"/><text class="qrs-n" x="244.5" y="43" text-anchor="middle">7</text><rect class="qrs-cell" x="266.0" y="26" width="33" height="26" rx="4"/><text class="qrs-n" x="282.5" y="43" text-anchor="middle">8</text><rect class="qrs-cell" x="304.0" y="26" width="33" height="26" rx="4"/><text class="qrs-n" x="320.5" y="43" text-anchor="middle">9</text><rect class="qrs-cell" x="342.0" y="26" width="33" height="26" rx="4"/><text class="qrs-n" x="358.5" y="43" text-anchor="middle">10</text><rect class="qrs-cell" x="380.0" y="26" width="33" height="26" rx="4"/><text class="qrs-n" x="396.5" y="43" text-anchor="middle">11</text><rect class="qrs-cell" x="418.0" y="26" width="33" height="26" rx="4"/><text class="qrs-n" x="434.5" y="43" text-anchor="middle">12</text><rect class="qrs-cell" x="456.0" y="26" width="33" height="26" rx="4"/><text class="qrs-n" x="472.5" y="43" text-anchor="middle">13</text><rect class="qrs-cell is-hit" x="494.0" y="26" width="33" height="26" rx="4"/><text class="qrs-n is-hit"