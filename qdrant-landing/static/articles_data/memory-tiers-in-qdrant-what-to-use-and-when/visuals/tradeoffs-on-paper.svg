<rect x="756.0" y="203" width="182.0" height="34" rx="17.0" fill="#ffffff" stroke="#abb1c7"/><text x="847.0" y="227.0" text-anchor="middle" style="font-size:20px;fill:#303547">Opportunistic</text>
