<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 238"
    aria-label="The distribution of one dimension's float32 values. Quantile 0.99 keeps the range from -2.0 to +5.0; the values outside it are outliers that get clipped."><style>
