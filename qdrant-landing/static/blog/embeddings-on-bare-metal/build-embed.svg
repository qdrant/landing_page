<svg xmlns="http://www.w3.org/2000/svg" class="qi-svg be-svg" viewBox="0 0 760 360" role="img" aria-label="Build time on a laptop: build.rs reads the safetensors model and the tokenizer vocabulary, then writes model constants and a vocabulary blob. include_bytes! embeds the weights and the blob into one firmware binary. Run time on the ESP32: the tokenizer reads the vocabulary blob, the pooling code reads rows of the embedding table, and both read from the binary in memory."><style>{ display: block; }
.qi-title { font-size: 14px; }
.be-flow { fill: none; stroke: #abb1c7; stroke-width: 1.6; }
.be-arrowhead { fill: #656b7f; }
.be-box { fill: #f0f3fa; stroke-width: 2; }
.be-box.is-a { stroke: #6047ff; }
.be-box.is-b { stroke: #9c27b0; }
.be-box.is-c { stroke: #00838f; }
.be-box.is-d { stroke: #dc244c; }
.be-box-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #303547; }
.be-box-text:nth-of-type(even) { fill: #656b7f; }
.be-flash { fill: none; stroke: #d3d9eb; stroke-width: 1.5; stroke-dasharray: 6 4; }
.be-flash-title { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #656b7f; }
.qi-title{font:14px ui-monospace,Menlo,monospace;fill:#303547}.qi-label{font:13px ui-monospace,Menlo,monospace;fill:#656b7f}.qi-label--strong{fill:#303547}</style><rect width="760" height="360" fill="#fff"/>
    <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="be-arrowhead" d="M0 0L10 5L0 10Z"/></marker></defs>
    <text class="qi-title" x="20" y="30">Build time · laptop, with std</text>
    
    <rect class="be-box is-a" x="20" y="46" width="170" height="50" rx="6"/>
    <text class="be-box-text" x="32" y="68">model.safetensors</text><text class="be-box-text" x="32" y="86">weights + metadata</text>
    
    <rect class="be-box is-b" x="20" y="112" width="170" height="50" rx="6"/>
    <text class="be-box-text" x="32" y="134">tokenizer.json</text><text class="be-box-text" x="32" y="152">vocabulary</text>
    
    <rect class="be-box is-c" x="250" y="79" width="190" height="50" rx="6"/>
    <text class="be-box-text" x="262" y="101">build.rs</text><text class="be-box-text" x="262" y="119">reads, checks, writes</text>
    <path class="be-flow" d="M190 71C220 71 220 104 242 104" marker-end="url(#a)"/>
    <path class="be-flow" d="M190 137C220 137 220 104 242 104" marker-end="url(#a)"/>
    
    <rect class="be-box is-d" x="510" y="46" width="230" height="50" rx="6"/>
    <text class="be-box-text" x="522" y="68">model_meta.rs</text><text class="be-box-text" x="522" y="86">DIM, TENSOR_START, ...</text>
    
    <rect class="be-box is-d" x="510" y="112" width="230" height="50" rx="6"/>
    <text class="be-box-text" x="522" y="134">vocab blob</text><text class="be-box-text" x="522" y="152">count, index, entries</text>
    <path class="be-flow" d="M440 104C470 104 470 71 502 71" marker-end="url(#a)"/>
    <path class="be-flow" d="M440 104C470 104 470 137 502 137" marker-end="url(#a)"/>
    <text class="qi-title" x="20" y="206">Run time · ESP32, no_std</text>
    <rect class="be-flash" x="20" y="222" width="370" height="118" rx="8"/>
    <text class="be-flash-title" x="34" y="246">firmware binary, in flash</text>
    
    <rect class="be-box is-a" x="34" y="258" width="160" height="62" rx="6"/>
    <text class="be-box-text" x="46" y="280">weights table</text><text class="be-box-text" x="46" y="298">include_bytes!</text>
    
    <rect class="be-box is-d" x="206" y="258" width="170" height="62" rx="6"/>
    <text class="be-box-text" x="218" y="280">vocab + constants</text><text class="be-box-text" x="218" y="298">include_bytes!</text>
    <path class="be-flow" d="M510 137C440 137 440 192 300 214" marker-end="url(#a)"/>
    <text class="qi-label" x="440" y="196">compiled in</text>
    
    <rect class="be-box is-c" x="480" y="222" width="260" height="50" rx="6"/>
    <text class="be-box-text" x="492" y="244">tokenizer</text><text class="be-box-text" x="492" y="262">WordPiece over the blob</text>
    
    <rect class="be-box is-c" x="480" y="290" width="260" height="50" rx="6"/>
    <text class="be-box-text" x="492" y="312">pooling</text><text class="be-box-text" x="492" y="330">rows of the table, in memory</text>
    <path class="be-flow" d="M390 247H472" marker-end="url(#a)"/>
    <path class="be-flow" d="M390 315H472" marker-end="url(#a)"/>
  </svg>