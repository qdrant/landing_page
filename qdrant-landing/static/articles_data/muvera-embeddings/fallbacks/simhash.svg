<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
<title id="title">SimHash with k_sim hyperplanes. Each hyperplane gives a token vector one bit, and the bits together are its cluster ID. The plane is a 2D illustration with seeded points: lines through the origin cut it into only 2 × k wedges, while in hundreds of dimensions all 2^k_sim clusters occur.</title>
<desc id="desc">k_sim = 3: 3 random hyperplanes give each token vector 3 bits, one per side it falls on, so it lands in one of 8 clusters. Hover a token to see its bits.</desc>
