<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" role="img" aria-labelledby="t d">
<title id="t">How qdrant-client embeds with FastEmbed</title>
<desc id="d">A sequence diagram with your code, qdrant-client, FastEmbed, and the Qdrant collection. Your code calls qdrant-client. The client asks FastEmbed, in the same Python process, to embed the texts or the query, then sends the vectors to Qdrant to store them or search with them.</desc>
