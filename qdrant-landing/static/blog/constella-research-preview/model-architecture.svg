<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Zero and Nano query architectures</title><desc id="desc">Zero pools learned token vectors. Nano combines features from layers 4, 8, and 12 of a 12-layer transformer, projects, and mean pools them. Both normalize a 1024-dimensional vector for Stella's document space.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8F98B2"/></marker></defs><rect width="1200" height="660" fill="#F0F3FA"/><g font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#28324D" font-weight="600"><text x="300" y="43" font-size="26" fill="#28324D" text-anchor="middle">Zero</text><rect x="60" y="70" width="480" height="76" rx="8" fill="#E1E6F0" stroke="#B4BACC" stroke-width="3"/><text x="300" y="116" font-size="22" fill="#28324D" text-anchor="middle">Query tokens</text><path d="M300 146V182" fill="none" stroke="#8F98B2" stroke-width="4" marker-end="url(#arrow)"/><path d="M300 266V302" fill="none" stroke="#8F98B2" stroke-width="4" marker-end="url(#arrow)"/><path d="M300 386V422" fill="none" stroke="#8F98B2" stroke-width="4" marker-end="url(#arrow)"/><path d="M300 506V542" fill="none" stroke="#8F98B2" stroke-width="4" marker-end="url(#arrow)"/><text x="900" y="43" font-size="26" fill="#28324D" text-anchor="middle">Nano</text><rect x="660" y="70" width="480" height="76" rx="8" fill="#E1E6F0" stroke="#B4BACC" stroke-width="3"/><text x="900" y="116" font-size="22" fill="#28324D" text-anchor="middle">Query tokens</text><path d="M900 146V182" fill="none" stroke="#8F98B2" stroke-width="4" marker-end="url(#arrow)"/><path d="M900 266V302" fill="none" stroke="#8F98B2" stroke-width="4" marker-end="url(#arrow)"/><path d="M900 386V422" fill="none" stroke="#8F98B2" stroke-width="4" marker-end="url(#arrow)"/><path d="M900 506V542" fill="none" stroke="#8F98B2" stroke-width="4" marker-end="url(#arrow)"/><rect x="60" y="190" width="480" height="76" rx="8" fill="#FFFFFF" stroke="#B4BACC" stroke-width="3"/><text x="300" y="223" font-size="22" fill="#28324D" text-anchor="middle">Learned token-vector lookup</text><text x="300" y="249" font-size="18" fill="#576280" text-anchor="middle">One fixed vector per token</text><rect x="660" y="190" width="480" height="76" rx="8" fill="#FFFFFF" stroke="#B4BACC" stroke-width="3"/><text x="900" y="223" font-size="22" fill="#28324D" text-anchor="middle">12-layer transformer</text><text x="900" y="249" font-size="18" fill="#576280" text-anchor="middle">Context + token positions</text><rect x="60" y="310" width="480" height="76" rx="8" fill="#FFFFFF" stroke="#B4BACC" stroke-width="3"/><text x="300" y="343" font-size="22" fill="#28324D" text-anchor="middle">Pool token vectors</text><text x="300" y="369" font-size="18" fill="#576280" text-anchor="middle">Weight by square root of token count</text><rect x="660" y="310" width="480" height="76" rx="8" fill="#FFFFFF" stroke="#B4BACC" stroke-width="3"/><text x="900" y="343" font-size="22" fill="#28324D" text-anchor="middle">Combine layers 4, 8, and 12</text><text x="900" y="369" font-size="18" fill="#576280" text-anchor="middle">Linear projection: 1152 → 1024</text><rect x="60" y="430" width="480" height="76" rx="8" fill="#FFFFFF" stroke="#B4BACC" stroke-width="3"/><text x="300" y="476" font-size="22" fill="#28324D" text-anchor="middle">L2 normalization</text><rect x="660" y="430" width="480" height="76" rx="8" fill="#FFFFFF" stroke="#B4BACC" stroke-width="3"/><text x="900" y="476" font-size="22" fill="#28324D" text-anchor="middle">Mean pooling + L2 normalization</text><rect x="60" y="550" width="480" height="76" rx="8" fill="#FFDADB" stroke="#DC244C" stroke-width="3"/><text x="300" y="583" font-size="22" fill="#28324D" text-anchor="middle">1024-d query vector</text><text x="300" y="609" font-size="18" fill="#576280" text-anchor="middle">Stella's document space</text><rect x="660" y="550" width="480" height="76" rx="8" fill="#FFDADB" stroke="#DC244C" stroke-width="3"/><text x="900" y="583" font-size="22" fill="#28324D" text-anchor="middle">1024-d query vector</text><text x="900" y="609" font-size="18" fill="#576280" text-anchor="middle">Stella's document space</text></g></svg>