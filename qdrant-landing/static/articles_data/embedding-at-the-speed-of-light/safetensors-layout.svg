<svg xmlns="http://www.w3.org/2000/svg" class="qi-svg" viewBox="0 0 760 250" role="img" aria-label="A safetensors file has three regions: 8 bytes that give the header size N, a JSON header of N bytes that describes dtype, shape, and byte range, and the raw weight bytes. Step 1: Read the first 8 bytes as an unsigned integer: the size N of the JSON header."><style>{ display: block; }
.qi-title { font-size: 14px; }
.qi-label { font-size: 13px; }
.se-flow { fill: none; stroke: #abb1c7; stroke-width: 1.6; }
.se-arrowhead { fill: #656b7f; }
.se-chip { cursor: pointer; }
.se-chip rect { fill: #f0f3fa; stroke: #d3d9eb; stroke-width: 1.5; }
.se-chip text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #303547; }
.se-chip.is-selected rect { stroke: #303547; stroke-width: 2.5; }
.se-chip:focus-visible rect { stroke: #dc244c; stroke-width: 2.5; }
.se-chip:focus { outline: none; }
.se-box rect { fill: #f0f3fa; stroke: #d3d9eb; stroke-width: 1.5; }
.se-box text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #303547; }
.c1 { fill: #6047ff; }
.c2 { fill: #9c27b0; }
.c3 { fill: #00838f; }
.c4 { fill: #dc244c; }
.pad { fill: none; stroke: #abb1c7; stroke-width: 1.2; stroke-dasharray: 3 3; }
.muted { fill: #656b7f; }
.dim { opacity: 0.35; }
.se-num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #303547; text-anchor: middle; }
.se-cell-box { fill: #f0f3fa; stroke: #d3d9eb; stroke-width: 1.2; }
.se-cell-box.is-selected { stroke: #303547; stroke-width: 2.5; }
.se-seg { stroke: none; }
.qi-title{font:14px ui-monospace,Menlo,monospace;fill:#303547}.qi-label{font:13px ui-monospace,Menlo,monospace;fill:#656b7f}.qi-label--strong{fill:#303547}</style><rect width="760" height="250" fill="#fff"/>
    <defs><marker id="se-arrow-fb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="se-arrowhead" d="M0 0L10 5L0 10Z"/></marker></defs>
    
    <g class="se-chip is-selected" data-i="0" role="button" tabindex="0" aria-pressed="true" aria-label="1 · read size">
      <rect x="20" y="20" width="160" height="28" rx="6"/>
      <text x="32" y="39">1 · read size</text>
    </g>
    <g class="se-chip" data-i="1" role="button" tabindex="0" aria-pressed="false" aria-label="2 · parse header">
      <rect x="190" y="20" width="160" height="28" rx="6"/>
      <text x="202" y="39">2 · parse header</text>
    </g>
    <g class="se-chip" data-i="2" role="button" tabindex="0" aria-pressed="false" aria-label="3 · load weights">
      <rect x="360" y="20" width="160" height="28" rx="6"/>
      <text x="372" y="39">3 · load weights</text>
    </g>
    <text class="qi-title" x="20" y="76">safetensors file, left to right</text>
    
    <rect class="se-seg c1" x="20" y="90" width="110" height="44" rx="4"/>
    <text class="qi-label" x="20" y="156">8 bytes: N</text>
    
    <rect class="se-seg c2 dim" x="130" y="90" width="250" height="44" rx="4"/>
    <text class="qi-label" x="130" y="156">JSON header, N bytes</text>
    
    <rect class="se-seg c3 dim" x="380" y="90" width="340" height="44" rx="4"/>
    <text class="qi-label" x="380" y="156">weight bytes: vocab × 256 × 4 (f32)</text>
    <text class="qi-label qi-label--strong" x="20" y="210">Read the first 8 bytes as an unsigned integer: the size N of the JSON header.</text>
  </svg>