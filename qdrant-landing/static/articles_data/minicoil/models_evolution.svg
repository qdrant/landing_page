  <path d="M586 82 L604 82" fill="none" stroke="#656b7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M604 88 L614 82 L604 76" fill="none" stroke="#656b7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M186 282 L204 282" fill="none" stroke="#656b7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M204 288 L214 282 L204 276" fill="none" stroke="#656b7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M430 282 L430 406 Q430 420 444 420 L594 420" fill="none" stroke="#656b7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M594 426 L604 420 L594 414" fill="none" stroke="#656b7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M386 282 L486 282 Q500 282 500 268 L500 138" fill="none" stroke="#656b7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M506 138 L500 128 L494 138" fill="none" stroke="#656b7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="152" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">Add context</text>
  <text x="400" y="152" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">Embedding</text>
  <text x="400" y="174" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">per-word</text>
  <text x="600" y="152" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">Match all</text>
  <text x="600" y="174" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">words</text>
  <text x="200" y="352" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">A model weights</text>
  <text x="200" y="374" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">tokens</text>
  <text x="446" y="308" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17">Single weight → vector</text>
  <text x="520" y="388" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">Model generates</text>
  <text x="520" y="410" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">new tokens</text>

</svg>
