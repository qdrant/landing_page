<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -16 800 306" width="800" height="306" role="img" aria-labelledby="t d">
  <title id="t">The four BEIR datasets used in the experiment</title>
  <desc id="d">SciFact, scientific claim verification: 5,183 documents of 214 words, 1.1 relevant per query, 21 MB of float32 vectors at 1,024 dimensions. NFCorpus, medical information retrieval: 3,633 documents of 232 words, 38.2 relevant per query, 15 MB. FiQA, financial question answering: 57,638 documents of 132 words, 2.6 relevant per query, 236 MB. Quora, duplicate question retrieval: 522,931 documents of 11 words, 1.6 relevant per query, 2,142 MB.</desc>
  <style>
    
    .qset { display: block; text-align: left; }
    .qset .qi-fig { gap: 16px; }
    .qset .qset-h, .qset .qset-sub { fill: #656b7f; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 14px; }
    .qset .qset-name { fill: #303547; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 600; }
    .qset .qset-task, .qset .qset-num { fill: #303547; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 14px; font-variant-numeric: tabular-nums; }
    .qset .qset-bar { fill: #6047ff; }
    .qset .qset-sep { stroke: #d3d9eb; stroke-width: 1; }
    
    .qi-axis { stroke: #abb1c7; stroke-width: 1.5; }
  </style>
  <rect x="-20" y="-16" width="800" height="306" fill="#FFFFFF" rx="12"/>
  <g class="qset"><text class="qset-h" x="0" y="18">Dataset</text><text class="qset-h" x="96" y="18">Task / what a query finds</text><text class="qset-h" x="410" y="18" text-anchor="end">documents</text><text class="qset-h" x="496" y="18" text-anchor="end">words/doc</text><text class="qset-h" x="582" y="18" text-anchor="end">rel/query</text><text class="qset-h" x="604" y="18">float32, 1,024-d</text><line class="qi-axis" x1="0" y1="28" x2="760" y2="28"/><text class="qset-name" x="0" y="58">SciFact</text><text class="qset-task" x="96" y="58">Scientific claim verification</text><text class="qset-sub" x="96" y="78">An abstract that supports or refutes a claim</text><text class="qset-num" x="410" y="58" text-anchor="end">5,183</text><text class="qset-num" x="496" y="58" text-anchor="end">214</text><text class="qset-num" x="582" y="58" text-anchor="end">1.1</text><rect class="qset-bar" x="604" y="46" width="2.0" height="14" rx="2"/><text class="qset-num" x="614.0" y="58">21 MB</text><line class="qset-sep" x1="0" y1="92" x2="760" y2="92"/><text class="qset-name" x="0" y="114">NFCorpus</text><text class="qset-task" x="96" y="114">Medical information retrieval</text><text class="qset-sub" x="96" y="134">PubMed papers for a short NutritionFacts.org topic</text><text class="qset-num" x="410" y="114" text-anchor="end">3,633</text><text class="qset-num" x="496" y="114" text-anchor="end">232</text><text class="qset-num" x="582" y="114" text-anchor="end">38.2</text><rect class="qset-bar" x="604" y="102" width="2.0" height="14" rx="2"/><text class="qset-num" x="614.0" y="114">15 MB</text><line class="qset-sep" x1="0" y1="148" x2="760" y2="148"/><text class="qset-name" x="0" y="170">FiQA</text><text class="qset-task" x="96" y="170">Financial question answering</text><text class="qset-sub" x="96" y="190">A StackExchange investment post that answers a question</text><text class="qset-num" x="410" y="170" text-anchor="end">57,638</text><text class="qset-num" x="496" y="170" text-anchor="end">132</text><text class="qset-num" x="582" y="170" text-anchor="end">2.6</text><rect class="qset-bar" x="604" y="158" width="8.8" height="14" rx="2"/><text class="qset-num" x="620.8" y="170">236 MB</text><line class="qset-sep" x1="0" y1="204" x2="760" y2="204"/><text class="qset-name" x="0" y="226">Quora</text><text class="qset-task" x="96" y="226">Duplicate question retrieval</text><text class="qset-sub" x="96" y="246">Another question that asks the same thing</text><text class="qset-num" x="410" y="226" text-anchor="end">522,931</text><text class="qset-num" x="496" y="226" text-anchor="end">11</text><text class="qset-num" x="582" y="226" text-anchor="end">1.6</text><rect class="qset-bar" x="604" y="214" width="80.0" height="14" rx="2"/><text class="qset-num" x="692.0" y="226">2,142 MB</text></g>
</svg>
