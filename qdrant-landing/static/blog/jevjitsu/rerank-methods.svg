="#abb1c7" stroke-width="1.5"/><text x="267.0" y="80" text-anchor="middle" font-weight="700">D</text><rect x="286" y="62" width="26" height="26" rx="5" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="299.0" y="80" text-anchor="middle" font-weight="700">B</text>
