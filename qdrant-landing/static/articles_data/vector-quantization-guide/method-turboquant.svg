<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -16 800 480" width="800" height="480" role="img" aria-labelledby="t d">
  <title id="t">TurboQuant rotation of one vector</title>
  <desc id="d">Before rotation, a vector has one coordinate at 0.87 of its length and most coordinates near zero, outside a shared set of 16 levels. After an orthogonal rotation its largest coordinate is 0.38, its length is still 1, and every coordinate sits in the same range, so one shared set of levels suits them all.</desc>
