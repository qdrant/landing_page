<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Collection lifecycle: Upload, Draining, and Steady</title>
  <desc id="desc">An editorial Qdrant-style lifecycle diagram using the supplied palette. Upload has active ingestion and no search. Draining has competing search and optimizer work. Steady has idle optimizers and stable latency.</desc>
  <defs>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#717C99"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#2F6FF0"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#038585"/></marker>
    <style>
      .title { font:500 38px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; fill:#576280; }
      .stage { font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; fill:#28324D; }
      .body { font:500 20px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; fill:#3D4866; }
      .small { font:500 16px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; fill:#576280; }
      .caps { font:700 14px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; fill:#717C99; letter-spacing:1.2px; }
      .blue { fill:#0040A1; } .teal { fill:#004F4F; } .primary { fill:#91012A; }
    </style>
  </defs>
  <rect width="1600" height="820" fill="#FFFFFF"/>
  <!-- stage headers remain neutral on white -->
  <text x="230" y="184" text-anchor="middle" class="stage">Upload</text>
  <text x="800" y="184" text-anchor="middle" class="stage">Draining</text>
  <text x="1370" y="184" text-anchor="middle" class="stage">Steady</text>
  <text x="230" y="217" text-anchor="middle" class="small">bulk load</text>
  <text x="800" y="217" text-anchor="middle" class="small">search and maintenance</text>
  <text x="1370" y="217" text-anchor="middle" class="small">stable search baseline</text>

  <!-- phase connectors sit in deliberately empty lanes -->
  <text x="515" y="347" text-anchor="middle" class="caps">SEARCH BEGINS</text>
  <path d="M430 377H600" fill="none" stroke="#717C99" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"/>
  <text x="1085" y="347" text-anchor="middle" class="caps">MAINTENANCE CLEARS</text>
  <path d="M1000 377H1170" fill="none" stroke="#717C99" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"/>

  <!-- upload: blue tint with darker blue text -->
  <g transform="translate(100 270)">
    <rect x="0" y="0" width="260" height="78" fill="#D9E2FE"/>
    <text x="22" y="32" class="body blue">Active ingestion</text>
    <text x="22" y="59" class="body blue">no search traffic</text>
    <text x="0" y="126" class="caps">POINT BATCHES</text>
    <g fill="#2F6FF0"><rect x="0" y="145" width="30" height="28"/><rect x="45" y="145" width="30" height="28"/><rect x="90" y="145" width="30" height="28"/><rect x="135" y="145" width="30" height="28"/><rect x="180" y="145" width="30" height="28"/><rect x="225" y="145" width="30" height="28"/></g>
    <path d="M128 188V249" fill="none" stroke="#2F6FF0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <rect x="0" y="272" width="260" height="102" fill="#D9E2FE"/>
    <g transform="translate(25 298)" fill="none" stroke="#0040A1" stroke-width="2.6"><ellipse cx="22" cy="7" rx="19" ry="6"/><path d="M3 7V30C3 38 41 38 41 30V7"/><ellipse cx="22" cy="30" rx="19" ry="6"/></g>
    <text x="83" y="332" class="body blue">Collection</text>
    <text x="0" y="420" class="small">Writes build the index.</text>
  </g>

  <!-- draining: primary tint for contention; teal stays reserved for search -->
  <g transform="translate(650 270)">
    <rect x="0" y="0" width="300" height="78" fill="#FFDADB"/>
    <text x="22" y="32" class="body primary">Search traffic competes</text>
    <text x="22" y="59" class="body primary">with optimizers</text>
    <text x="0" y="126" class="caps">SEARCH</text>
    <rect x="0" y="145" width="144" height="46" fill="#C0F0F0"/>
    <text x="18" y="175" class="body teal">Queries</text>
    <path d="M160 168H221" fill="none" stroke="#038585" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
    <g transform="translate(236 147)" fill="none" stroke="#004F4F" stroke-width="2.5"><ellipse cx="28" cy="8" rx="25" ry="8"/><path d="M3 8V37C3 47 53 47 53 37V8"/><ellipse cx="28" cy="37" rx="25" ry="8"/></g>
    <text x="0" y="242" class="caps">OPTIMIZERS</text>
    <text x="0" y="285" class="body">index</text><rect x="92" y="265" width="188" height="21" fill="#FFDADB"/><rect x="92" y="265" width="116" height="21" fill="#DC244C"/>
    <text x="0" y="329" class="body">merge</text><rect x="92" y="309" width="188" height="21" fill="#FFDADB"/><rect x="92" y="309" width="159" height="21" fill="#BE003A"/>
    <text x="0" y="373" class="body">vacuum</text><rect x="92" y="353" width="188" height="21" fill="#FFDADB"/><rect x="92" y="353" width="84" height="21" fill="#DC244C"/>
    <path d="M92 397H280" stroke="#DC244C" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="0" y="428" class="small">Background work drains.</text>
  </g>

  <!-- steady: teal tint with dark teal text -->
  <g transform="translate(1220 270)">
    <rect x="0" y="0" width="280" height="78" fill="#C0F0F0"/>
    <text x="22" y="32" class="body teal">Optimizers idle</text>
    <text x="22" y="59" class="body teal">fixed baseline</text>
    <text x="0" y="126" class="caps">SEARCH LATENCY</text>
    <path d="M18 360V158M18 360H276" fill="none" stroke="#3D4866" stroke-width="1.6"/>
    <text x="30" y="181" class="small">latency</text><text x="226" y="388" class="small">query</text>
    <path d="M18 278L34 262L50 270L66 260L82 268L98 257L114 270L130 262L146 281L162 255L178 268L194 268L210 255L226 266L242 266L258 259" fill="none" stroke="#038585" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="258" cy="259" r="4" fill="#038585"/>
    <text x="0" y="430" class="small">Search runs steadily.</text>
  </g>
</svg>
