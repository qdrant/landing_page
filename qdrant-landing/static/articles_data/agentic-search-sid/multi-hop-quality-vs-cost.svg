<svg xmlns="http://www.w3.org/2000/svg" width="1688" height="552" viewBox="0 0 1688 552" role="img" aria-labelledby="title desc">
  <title id="title">Multi-hop retrieval quality versus cost per query</title>
  <desc id="desc">On the 60 multi-hop questions, sid-1 reaches 0.743 coverage@3 against 0.500 for hybrid and 0.479 for colbert-rerank, and pays for it with 5.749 seconds of latency and 23,947 tokens per query.</desc>
  <defs>
    <style>
      .subtitle { fill:#627394; font-family:Courier; font-size:16px; font-weight:500; letter-spacing:.2px; }
      .body { fill:#2c3a58; font-family:Courier; font-size:20px; font-weight:500; }
      .label { fill:#526382; font-family:Courier; font-size:16px; font-weight:500; }
      .val { fill:#2c3a58; font-family:Courier; font-size:15px; font-weight:500; }
      .tick { fill:#8395bd; font-family:Courier; font-size:14px; font-weight:500; }
    </style>
  </defs>

  <rect width="1688" height="552" rx="24" fill="#fafbff"/>

  <!-- ================= panel headers ================= -->
  <text x="300" y="86" class="body">retrieval quality</text>
  <text x="300" y="112" class="subtitle">top-3 window · 60 multi-hop questions</text>

  <text x="900" y="86" class="body">cost per query</text>
  <text x="900" y="112" class="subtitle">latency, seconds · averaged</text>

  <text x="780" y="138" class="tick" text-anchor="end">solid: coverage@3 · dashed: mrr@3</text>

  <!-- ================= gridlines ================= -->
  <g stroke="#e4e9f5" stroke-width="1.4">
    <path d="M420 150 V486"/><path d="M540 150 V486"/><path d="M660 150 V486"/><path d="M780 150 V486"/>
    <path d="M993 150 V486"/><path d="M1087 150 V486"/><path d="M1180 150 V486"/>
    <path d="M1273 150 V486"/><path d="M1367 150 V486"/><path d="M1460 150 V486"/>
  </g>
  <g stroke="#b4bacc" stroke-width="1.8">
    <path d="M300 150 V486"/>
    <path d="M900 150 V486"/>
  </g>

  <!-- tick labels -->
  <g class="tick">
    <text x="300" y="512" text-anchor="middle">0</text>
    <text x="420" y="512" text-anchor="middle">0.25</text>
    <text x="540" y="512" text-anchor="middle">0.50</text>
    <text x="660" y="512" text-anchor="middle">0.75</text>
    <text x="780" y="512" text-anchor="middle">1.00</text>
    <text x="900" y="512" text-anchor="middle">0</text>
    <text x="993" y="512" text-anchor="middle">1s</text>
    <text x="1087" y="512" text-anchor="middle">2s</text>
    <text x="1180" y="512" text-anchor="middle">3s</text>
    <text x="1273" y="512" text-anchor="middle">4s</text>
    <text x="1367" y="512" text-anchor="middle">5s</text>
    <text x="1460" y="512" text-anchor="middle">6s</text>
  </g>

  <!-- ================= row 1: hybrid ================= -->
  <text x="72" y="188" class="body">hybrid</text>
  <text x="72" y="212" class="subtitle">one pass</text>

  <rect x="300" y="176" width="240" height="13" rx="3" fill="#dce7ff" stroke="#316cff" stroke-width="1.4"/>
  <text x="550" y="187" class="val">0.500</text>
  <rect x="300" y="193" width="389" height="13" rx="3" fill="#ffffff" stroke="#316cff" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="699" y="204" class="val">0.811</text>

  <rect x="900" y="176" width="6" height="30" rx="2" fill="#dce7ff" stroke="#316cff" stroke-width="1.4"/>
  <text x="918" y="196" class="val">0.056s</text>
  <text x="910" y="232" class="label">0 tokens · 0 llm calls · 1.00 qdrant call</text>

  <!-- ================= row 2: colbert-rerank ================= -->
  <text x="72" y="308" class="body">colbert-rerank</text>
  <text x="72" y="332" class="subtitle">dense prefetch +</text>
  <text x="72" y="352" class="subtitle">late interaction</text>

  <rect x="300" y="296" width="230" height="13" rx="3" fill="#c0fcf0" stroke="#038585" stroke-width="1.4"/>
  <text x="540" y="307" class="val">0.479</text>
  <rect x="300" y="313" width="369" height="13" rx="3" fill="#ffffff" stroke="#038585" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="679" y="324" class="val">0.769</text>

  <rect x="900" y="296" width="15" height="30" rx="2" fill="#c0fcf0" stroke="#038585" stroke-width="1.4"/>
  <text x="927" y="316" class="val">0.157s</text>
  <text x="910" y="352" class="label">0 tokens · 0 llm calls · 1.00 qdrant call</text>

  <!-- ================= row 3: sid-1 ================= -->
  <text x="72" y="428" class="body">sid-1</text>
  <text x="72" y="452" class="subtitle">agentic loop</text>

  <rect x="300" y="416" width="357" height="13" rx="3" fill="#eadcff" stroke="#7c42ff" stroke-width="1.4"/>
  <text x="667" y="427" class="val">0.743</text>
  <rect x="300" y="433" width="424" height="13" rx="3" fill="#ffffff" stroke="#7c42ff" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="734" y="444" class="val">0.883</text>

  <rect x="900" y="416" width="537" height="30" rx="3" fill="#eadcff" stroke="#7c42ff" stroke-width="1.4"/>
  <text x="1449" y="436" class="val">5.749s</text>
  <text x="910" y="472" class="label">23,947 tokens · 4.35 llm calls · 8.75 qdrant calls</text>

</svg>
