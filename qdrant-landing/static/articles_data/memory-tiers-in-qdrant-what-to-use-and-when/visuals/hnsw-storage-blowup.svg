<path d="M484.0 410.0 Q 710.7 337.2, 920.0 272.2" fill="none" stroke="#6047ff" stroke-width="3"/>
<path d="M484.0 410.0 C 636.6 404.8, 710.7 350.2, 920.0 160.4" fill="none" stroke="#9c27b0" stroke-width="3"/>
<circle cx="920" cy="160.4" r="6" fill="#9c27b0"/>
<circle cx="920" cy="272.2" r="6" fill="#6047ff"/>
<text class="small" x="904" y="152" text-anchor="end" style="fill:#6a1b9a">inline storage</text>
<text class="small" x="904" y="362" text-anchor="end" style="fill:#392689">standard graph</text>
<line x1="796" x2="864" y1="216" y2="250" stroke="#656b7f" stroke-width="1.5"/>
<text class="note" x="790" y="214" text-anchor="end">gap widens with edge count</text>
<text class="note" transform="translate(462 280) rotate(-90)" text-anchor="middle">on-disk graph size →</text>
<text class="note" x="702" y="442" text-anchor="middle">edge count →</text>
