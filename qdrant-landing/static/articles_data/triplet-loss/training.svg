<title id="training-title">Contrastive Loss and Triplet Loss share the same starting points and coordinate scale</title>
<desc id="training-description">Class A uses violet circles; Class B uses red squares. The starting points overlap. After 350 steps, Contrastive Loss reduces mean within-class distance from 1.39 to 0.04. Triplet Loss retains a distance of 0.80. Both final states have zero margin violations.</desc>
