{{ with (.Site.GetPage "/serverless/what-is") }}
  <section class="serverless-what-is">
    <div class="container">
      <div class="row">
        <div class="col-12 col-lg-6">
          <h3 class="serverless-what-is__title">{{ .Params.title }}</h3>
        </div>
        <div class="col-12 col-lg-6">
          <h6 class="serverless-what-is__subtitle">{{ .Params.subtitle }}</h6>
          <p class="serverless-what-is__description">{{ .Params.description }}</p>
        </div>
      </div>
    </div>
  </section>
{{ end }}
