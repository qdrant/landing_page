<rect x="90" y="228" width="16" height="16" rx="2" fill="#00838f"/>
<rect x="30" y="248" width="16" height="16" rx="2" fill="#00838f"/>
<rect x="50" y="248" width="16" height="16" rx="2" fill="#00838f"/>
<rect x="70" y="248" width="16" height="16" rx="2" fill="#00838f"/>
<rect x="90" y="248" width="16" height="16" rx="2" fill="#00838f"/>
<rect x="30" y="268" width="16" height="16" rx="2" fill="#00838f"/>
