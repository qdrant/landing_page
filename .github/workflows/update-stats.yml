name: Update Github Stars

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "00 17 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run github-stars update script
        run: |
          bash -x automation/update-stats.sh
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "Update GitHub Stars"
          committer: "GitHub Actions <team@qdrant.com>"
          author: "GitHub Actions <team@qdrant.com>"
          branch: automation/update-github-stars
          delete-branch: true
          title: "Update GitHub Stars"
          body: "Automated weekly update of the GitHub star count in `qdrant-landing/content/headless/stats.md`."