<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" font-family="'Mona Sans',Arial,sans-serif" role="img" aria-label="Bandwidth against latency for three read backends on log scales, random reads. io_uring climbs almost straight up, from 7.15 to 85.66 megabytes per second while latency stays near 0.6 milliseconds, then bends right as the last 29 percent of bandwidth costs fifteen times the wait. mmap runs flat at about 7.2 megabytes per second whatever the batch, because its pipeline is one deep. S3 climbs straight up at about 24 milliseconds, from 0.17 to 11.3 megabytes per second as the number of readers rises from 1 to 128."><style>
  .dl-title{fill:#303547;font-size:14px}.dl-axlbl{fill:#656b7f;font-size:14px}
  .dl-tick{fill:#656b7f;font-size:13px}.dl-legend{fill:#303547;font-size:14px}
  .dl-callout{fill:currentColor;font-size:13px;font-weight:600}
  .dl-callout--cont{font-weight:400}
  .dl-grid{stroke:#abb1c7;stroke-width:1;opacity:.45}
  .dl-axis{stroke:#656b7f;stroke-width:1.5;fill:none}
  .dl-outline{stroke:#303547;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .dl-line{stroke:currentColor;stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .dl-dot{fill:currentColor}.dl-dot--off{fill:#f0f3fa;stroke:currentColor;stroke-width:2}.dl-ghost .dl-line{opacity:.25;stroke-width:2}.dl-hit{display:none}
  .dl-cyan{color:#00838f}.dl-blue{color:#6047ff}.dl-red{color:#dc244c}</style><rect width="760" height="372" fill="#f0f3fa"/><text class="dl-title" x="54" y="20">MB/s delivered, 4 KiB random reads (log scale)</text><line class="dl-grid" x1="54.0" y1="42" x2="54.0" y2="246"/><text class="dl-tick" x="54.0" y="267" text-anchor="middle">0.1</text><line class="dl-grid" x1="276.8" y1="42" x2="276.8" y2="246"/><text class="dl-tick" x="276.8" y="267" text-anchor="middle">1</text><line class="dl-grid" x1="499.6" y1="42" x2="499.6" y2="246"/><text class="dl-tick" x="499.6" y="267" text-anchor="middle">10</text><line class="dl-grid" x1="722.4" y1="42" x2="722.4" y2="246"/><text class="dl-tick" x="722.4" y="267" text-anchor="middle">100</text><line class="dl-grid" x1="54" y1="246.0" x2="740" y2="246.0"/><text class="dl-tick" x="44" y="250.0" text-anchor="end">0.1</text><line class="dl-grid" x1="54" y1="192.0" x2="740" y2="192.0"/><text class="dl-tick" x="44" y="196.0" text-anchor="end">1</text><line class="dl-grid" x1="54" y1="138.0" x2="740" y2="138.0"/><text class="dl-tick" x="44" y="142.0" text-anchor="end">10</text><line class="dl-grid" x1="54" y1="84.0" x2="740" y2="84.0"/><text class="dl-tick" x="44" y="88.0" text-anchor="end">100</text><path class="dl-axis" d="M54 42V246H740"/><text class="dl-axlbl" x="397" y="292" text-anchor="middle">time from submit to completion, p50, in ms (log scale)</text><g class="dl-series dl-cyan"><path class="dl-outline" d="M219.4,145.6 L429.3,145.9 L558.9,145.7 L689.5,145.6"/><path class="dl-line" d="M219.4,145.6 L429.3,145.9 L558.9,145.7 L689.5,145.6"/><circle class="dl-dot" cx="219.4" cy="145.6" r="3.5"/><circle class="dl-hit" cx="219.4" cy="145.6" r="10" tabindex="0" role="button" aria-label="mmap, batch 1, 7.22 MB/s at 0.5524 ms"><title>mmap batch 1: 7.22 MB/s at 0.5524 ms</title></circle><circle class="dl-dot" cx="429.3" cy="145.9" r="3.5"/><circle class="dl-hit" cx="429.3" cy="145.9" r="10" tabindex="0" role="button" aria-label="mmap, batch 16, 7.15 MB/s at 4.836 ms"><title>mmap batch 16: 7.15 MB/s at 4.836 ms</title></circle><circle class="dl-dot" cx="558.9" cy="145.7" r="3.5"/><circle class="dl-hit" cx="558.9" cy="145.7" r="10" tabindex="0" role="button" aria-label="mmap, batch 64, 7.21 MB/s at 18.4614 ms"><title>mmap batch 64: 7.21 MB/s at 18.4614 ms</title></circle><circle class="dl-dot" cx="689.5" cy="145.6" r="3.5"/><circle class="dl-hit" cx="689.5" cy="145.6" r="10" tabindex="0" role="button" aria-label="mmap, batch 256, 7.22 MB/s at 71.2242 ms"><title>mmap batch 256: 7.22 MB/s at 71.2242 ms</title></circle></g><g class="dl-series dl-blue"><path class="dl-outline" d="M221.0,145.9 L221.5,131.1 L222.7,115.7 L223.8,102.4 L229.5,87.6 L269.6,85.4 L311.5,84.7 L366.7,82.8 L430.0,82.3 L493.8,81.6"/><path class="dl-line" d="M221.0,145.9 L221.5,131.1 L222.7,115.7 L223.8,102.4 L229.5,87.6 L269.6,85.4 L311.5,84.7 L366.7,82.8 L430.0,82.3 L493.8,81.6"/><circle class="dl-dot" cx="221.0" cy="145.9" r="3.5"/><circle class="dl-hit" cx="221.0" cy="145.9" r="10" tabindex="0" role="button" aria-label="io_uring, batch 1, 7.15 MB/s at 0.5616 ms"><title>io_uring batch 1: 7.15 MB/s at 0.5616 ms</title></circle><circle class="dl-dot" cx="221.5" cy="131.1" r="3.5"/><circle class="dl-hit" cx="221.5" cy="131.1" r="10" tabindex="0" role="button" aria-label="io_uring, batch 2, 13.43 MB/s at 0.565 ms"><title>io_uring batch 2: 13.43 MB/s at 0.565 ms</title></circle><circle class="dl-dot" cx="222.7" cy="115.7" r="3.5"/><circle class="dl-hit" cx="222.7" cy="115.7" r="10" tabindex="0" role="button" aria-label="io_uring, batch 4, 25.84 MB/s at 0.572 ms"><title>io_uring batch 4: 25.84 MB/s at 0.572 ms</title></circle><circle class="dl-dot" cx="223.8" cy="102.4" r="3.5"/><circle class="dl-hit" cx="223.8" cy="102.4" r="10" tabindex="0" role="button" aria-label="io_uring, batch 8, 45.71 MB/s at 0.5784 ms"><title>io_uring batch 8: 45.71 MB/s at 0.5784 ms</title></circle><circle class="dl-dot" cx="229.5" cy="87.6" r="3.5"/><circle c