dylan-couzon:
  name: Dylan Couzon
  role: DevRel Team Lead at Qdrant
  bio: "Open-source video game emulators got me into coding, and I have been tinkering ever since. I like pushing AI beyond the chat window and into small devices and robots, using retrieval to give them the context they need. Limited compute makes it fun: how far can we push the hardware we have?"
  image: /authors/dylan-couzon.jpg
  linkedin: https://www.linkedin.com/in/dcouzon/
evgeniya-sukhodolskaya:
  name: Evgeniya Sukhodolskaya
  role: Senior Developer Advocate at Qdrant
  bio: "Studied & worked in Machine Learning (Msc DEA TUM), discovered DevRel and stayed - where else you can be a standup comedian in IT, right? Call myself a latent PhD, as information retrieval research & academia are my guilty pleasure. Organizer of a #BASED search meetup in Munich."
  image: /authors/evgeniya-sukhodolskaya.jpg
