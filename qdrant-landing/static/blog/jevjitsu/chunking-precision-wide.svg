<svg xmlns="http://www.w3.org/2000/svg" width="680" height="604" viewBox="0 0 680 604" role="img" aria-labelledby="t d"><title id="t">Fixed-size chunks cut the answer, a Jev chunk keeps it whole</title><desc id="d">For the question "How long is the dataset?", fixed-size chunks 3 and 4, 200 tokens each, cut the answer at its last word. Jev chunk 5, 161 tokens, keeps the whole answer in one chunk.</desc><rect width="680" height="604" fill="#f0f3fa"/><g font-family="'Mona Sans', -apple-system, 'Segoe UI', sans-serif"><rect x="8" y="8" width="664" height="70" rx="6" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="20" y="32" font-size="14" fill="#656b7f" textLength="56.03" lengthAdjust="spacing">Question</text><text x="88.03" y="32" font-size="16" font-weight="700" fill="#303547" textLength="188.46" lengthAdjust="spacing">How long is the dataset?</text><text x="20" y="56" font-size="14" fill="#656b7f" textLength="594.56" lengthAdjust="spacing">paper: IAM at CLEF eHealth 2018: Concept Annotation and Coding in French Death Certificates</text><rect x="8" y="86" width="388" height="510" rx="6" fill="#dc244c" fill-opacity="0.08" stroke="#dc244c" stroke-width="1.5"/><text x="20" y="120" font-size="18" font-weight="700" fill="#303547" textLength="155.05" lengthAdjust="spacing">Fixed-size chunks</text><rect x="20" y="132" width="224.85" height="26" rx="13" fill="#dc244c"/><text x="34" y="150" font-size="14" font-weight="700" fill="#ffffff" textLength="196.85" lengthAdjust="spacing">Answer split across 2 chunks</text><text x="20" y="180" font-size="14" fill="#656b7f" textLength="243.18" lengthAdjust="spacing">Cut every ~200 tokens, even mid-topic.</text><rect x="20" y="198" width="364" height="300" rx="6" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="32" y="224" font-size="14" font-weight="700" fill="#303547" textLength="55.23" lengthAdjust="spacing">Chunk 3</text><text x="99.23" y="224" font-size="14" fill="#656b7f" textLength="68.5" lengthAdjust="spacing">200 tokens</text><text x="32" y="250" font-size="14" fill="#303547" textLength="50.58" lengthAdjust="spacing">Corpora</text><rect x="29" y="264" width="311.84" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="286" width="270.56" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="308" width="318.82" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="330" width="320.18" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="352" width="326.68" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="374" width="289.3" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="396" width="339.82" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="418" width="340.64" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="440" width="52.71" height="20" rx="3" fill="#ffe0b2"/><text x="32" y="278" font-size="14" fill="#303547" textLength="305.84" lengthAdjust="spacing">The data set for the coding of death certificates is</text><text x="32" y="300" font-size="14" fill="#303547" textLength="264.56" lengthAdjust="spacing">called the CépiDC corpus. Three CSV files</text><text x="32" y="322" font-size="14" fill="#303547" textLength="312.82" lengthAdjust="spacing">(AlignedCauses) were provided by task organizers</text><text x="32" y="344" font-size="14" fill="#303547" textLength="314.18" lengthAdjust="spacing">containing annotated death certificates for different</text><text x="32" y="366" font-size="14" fill="#303547" textLength="320.68" lengthAdjust="spacing">periods: 2006 to 2012, 2013 and 2014. This training</text><text x="32" y="388" font-size="14" fill="#303547" textLength="283.3" lengthAdjust="spacing">set contained 125383 death certificates. Each</text><text x="32" y="410" font-size="14" fill="#303547" textLength="333.82" lengthAdjust="spacing">certificate contains one or more lines of text ... Zero to</text><text x="32" y="432" font-size="14" fill="#303547" textLength="334.64" lengthAdjust="spacing">multiple ICD-10 codes can be assigned to each line of</text><text x="32" y="454" font-size="14" fill="#303547" textLength="46.71" lengthAdjust="spacing">a death</text><path d="M47 477H33M38 472L33 477L38 482" fill="none" stroke="#dc244c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="482" font-size="14" font-weight="700" fill="#dc244c" textLength="147.05" lengthAdjust="spacing">the answer is cut here</text><rect x="20" y="510" width="364" height="74" rx="6" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="32" y="536" font-size="14" font-weight="700" fill="#303547" textLength="55.23" lengthAdjust="spacing">Chunk 4</text><text x="99.23" y="536" font-size="14" fill="#656b7f" textLength="68.5" lengthAdjust="spacing">200 tokens</text><rect x="29" y="550" width="69.8" height="20" rx="3" fill="#ffe0b2"/><text x="32" y="564" font-size="14" fill="#303547" textLength="63.8" lengthAdjust="spacing">certificate.</text><rect x="408" y="86" width="264" height="510" rx="6" fill="#c0f0f0" fill-opacity="0.45" stroke="#038585" stroke-width="1.5"/><text x="420" y="120" font-size="18" font-weight="700" fill="#303547" textLength="98.05" lengthAdjust="spacing">Jev chunks</text><rect x="420" y="132" width="168.8" height="26" rx="13" fill="#c0f0f0" stroke="#038585" stroke-width="1.5"/><text x="434" y="150" font-size="14" font-weight="700" fill="#004f4f" textLength="140.8" lengthAdjust="spacing">Answer in one chunk</text><text x="420" y="180" font-size="14" fill="#656b7f" textLength="181.33" lengthAdjust="spacing">Cut where the topic changes.</text><rect x="420" y="198" width="240" height="386" rx="6" fill="#ffffff" stroke="#038585" stroke-width="1.5"/><text x="432" y="224" font-size="14" font-weight="700" fill="#303547" textLength="55.23" lengthAdjust="spacing">Chunk 5</text><text x="499.23" y="224" font-size="14" fill="#656b7f" textLength="68.5" lengthAdjust="spacing">161 tokens</text><text x="432" y="250" font-size="14" fill="#303547" textLength="50.58" lengthAdjust="spacing">Corpora</text><rect x="429" y="264" width="188.12" height="20" rx="3" fill="#ffe0b2"/><rect x="429" y="286" width="189.65" height="20" rx="3" fill="#ffe0b2"/><rect x="429" y="308" width="206.74" height="20" rx="3" fill="#ffe0b2"/><rect x="429" y="330" width="220" height="20" rx="3" fill="#ffe0b2"/><rect x="429" y="352" width="168.65" height="20" rx="3" fill="#ffe0b2"/><rect x="429" y="374" width="198.23" height="20" rx="3" fill="#ffe0b2"/><rect x="429" y="396" width="199.56" height="20" rx="3" fill="#ffe0b2"/><rect x="429" y="418" width="206.03" height="20" rx="3" fill="#ffe0b2"/><rect x="429" y="440" width="156.25" height="20" rx="3" fill="#ffe0b2"/><rect x="429" y="462" width="176.4" height="20" rx="3" fill="#ffe0b2"/><rect x="429" y="484" width="212.22" height="20" rx="3" fill="#ffe0b2"/><rect x="429" y="506" width="207.52" height="20" rx="3" fill="#ffe0b2"/><rect x="429" y="528" width="210.7" height="20" rx="3" fill="#ffe0b2"/><rect x="429" y="550" width="108.72" height="20" rx="3" fill="#ffe0b2"/><text x="432" y="278" font-size="14" fill="#303547" textLength="182.12" lengthAdjust="spacing">The data set for the coding of</text><text x="432" y="300" font-size="14" fill="#303547" textLength="183.65" lengthAdjust="spacing">death certificates is called the</text><text x="432" y="322" font-size="14" fill="#303547" textLength="200.74" lengthAdjust="spacing">CépiDC corpus. Three CSV files</text><text x="432" y="344" font-size="14" fill="#303547" textLength="214" lengthAdjust="spacing">(AlignedCauses) were provided by</text><text x="432" y="366" font-size="14" fill="#303547" textLength="162.65" lengthAdjust="spacing">task organizers containing</text><text x="432" y="388" font-size="14" fill="#303547" textLength="192.23" lengthAdjust="spacing">annotated death certificates for</text><text x="432" y="410" font-size="14" fill="#303547" textLength="193.56" lengthAdjust="spacing">different periods: 2006 to 2012,</text><text x="432" y="432" font-size="14" fill="#303547" textLength="200.03" lengthAdjust="spacing">2013 and 2014. This training set</text><text x="432" y="454" font-size="14" fill="#303547" textLength="150.25" lengthAdjust="spacing">contained 125383 death</text><text x="432" y="476" font-size="14" fill="#303547" textLength="170.4" lengthAdjust="spacing">certificates. Each certificate</text><text x="432" y="498" font-size="14" fill="#303547" textLength="206.22" lengthAdjust="spacing">contains one or more lines of text</text><text x="432" y="520" font-size="14" fill="#303547" textLength="201.52" lengthAdjust="spacing">... Zero to multiple ICD-10 codes</text><text x="432" y="542" font-size="14" fill="#303547" textLength="204.7" lengthAdjust="spacing">can be assigned to each line of a</text><text x="432" y="564" font-size="14" fill="#303547" textLength="102.72" lengthAdjust="spacing">death certificate.</text></g></svg>