<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 676" role="img" aria-labelledby="title desc">
<title id="title">Neural exclusion rules: drag the query into the anchor radius to fire the rule and exclude the references in the effect radius. Points are illustrative.</title>
<desc id="desc">The query is inside the rule's anchor radius, so the rule fires and the 2 references inside the effect radius are excluded (crossed out). The ringed references are the nearest three that remain. The query is outside the rule's anchor radius, so the rule does not fire. All references stay in play, and the ringed ones are the nearest three. Drag the query into the anchor radius to trigger the rule.</desc>
