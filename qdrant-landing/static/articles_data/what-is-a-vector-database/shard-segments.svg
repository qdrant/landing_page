    <text x="90" y="134" font-size="13" text-anchor="middle" fill="#303547">segment</text>
    <text x="90" y="154" font-size="12" text-anchor="middle" fill="#656b7f">1</text>
    <rect x="136" y="100" width="76" height="76" rx="6" fill="none" stroke="#6047ff" stroke-width="1.5"/>
    <text x="174" y="134" font-size="13" text-anchor="middle" fill="#303547">segment</text>
    <text x="174" y="154" font-size="12" text-anchor="middle" fill="#656b7f">2</text>
    <rect x="220" y="100" width="76" height="76" rx="6" fill="none" stroke="#6047ff" stroke-width="1.5"/>
    <text x="258" y="134" font-size="13" text-anchor="middle" fill="#303547">segment</text>
    <text x="258" y="154" font-size="12" text-anchor="middle" fill="#656b7f">3</text>
    <rect x="328" y="60" width="276" height="132" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
