<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
  <title id="title">Problems of modern sparse neural retrievers</title>
  <desc id="desc">The same retriever map with problems marked. COIL has storage overhead. Sparse encoders such as DeepImpact have poor out-of-domain accuracy. SPLADE is slow because the model generates new tokens.</desc>
  <rect x="1" y="1" width="798" height="538" rx="12" fill="#111824" stroke="#303547" stroke-width="2"/>
  <rect x="18" y="40" width="164" height="84" rx="8" fill="#272143" stroke="#9494ff" stroke-width="2"/>
  <text x="100" y="66" fill="#e2e7f5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Word</text>
  <text x="100" y="88" fill="#e2e7f5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">embeddings</text>
  <text x="100" y="110" fill="#b9c0d4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">word2vec</text>
  <rect x="218" y="40" width="164" height="84" rx="8" fill="#272143" stroke="#9494ff" stroke-width="2"/>
  <text x="300" y="66" fill="#e2e7f5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Sentence</text>
  <text x="300" y="88" fill="#e2e7f5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">embeddings</text>
  <text x="300" y="110" fill="#b9c0d4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">SBERT</text>
  <rect x="418" y="40" width="164" height="84" rx="8" fill="#3a1c2a" stroke="#ff8792" stroke-width="2"/>
  <text x="500" y="66" fill="#e2e7f5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Contextualized</text>
  <text x="500" y="88" fill="#e2e7f5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">inverted list</text>
  <text x="500" y="110" fill="#b9c0d4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">COIL</text>
  <rect x="618" y="40" width="164" height="84" rx="8" fill="#272143" stroke="#9494ff" stroke-width="2"/>
  <text x="700" y="66" fill="#e2e7f5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Late</text>
  <text x="700" y="88" fill="#e2e7f5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">interaction</text>
  <text x="700" y="110" fill="#b9c0d4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">ColBERT</text>
  <rect x="18" y="240" width="164" height="84" rx="8" fill="#272143" stroke="#9494ff" stroke-width="2"/>
  <text x="100" y="277" fill="#e2e7f5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Bag-of-words</text>
  <text x="100" y="299" fill="#b9c0d4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">BM25 / TF-IDF</text>
  <rect x="218" y="240" width="164" height="84" rx="8" fill="#3a1c2a" stroke="#ff8792" stroke-width="2"/>
  <text x="300" y="277" fill="#e2e7f5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Sparse encoders</text>
  <text x="300" y="299" fill="#b9c0d4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">DeepImpact &amp; co</text>
  <rect x="608" y="378" width="164" height="84" rx="8" fill="#322713" stroke="#ffb74d" stroke-width="2"/>
  <text x="690" y="415" fill="#e2e7f5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Sparse encoders</text>
  <text x="690" y="437" fill="#b9c0d4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">SPLADE</text>
