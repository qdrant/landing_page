<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 216" role="img" aria-labelledby="description">
  <desc id="description">An embedding model turns text into a vector of numbers. Two similar sentences, "striped blue shirt made from cotton" and "cotton-made maritime shirt", produce vectors with nearly identical values.</desc>
