  .qi-dl__name{fill:#303547;font-size:12.5px}
  .qi-dl__row.is-deep .qi-dl__name{font-weight:600}
  .qi-dl__val{fill:#303547;font-size:12.5px;font-weight:600}
</style><rect width="520" height="232" fill="#f0f3fa"/><text class="qi-label qi-label--strong" x="0" y="14">MB/s delivered, 4 KiB reads</text><g class="qi-dl__row qi-dl__row--h1"><text class="qi-dl__name" x="150" y="48" text-anchor="end">mmap · batch 1</text><rect class="qi-dl__bar" x="162" y="36" width="20.90310530002335" height="16" rx="3"></rect><text class="qi-dl__val" y="48" x="190.90310530002336">7.22 MB/s</text></g><g class="qi-dl__row qi-dl__row--h1 is-deep"><text class="qi-dl__name" x="150" y="76" text-anchor="end">mmap · batch 256</text><rect class="qi-dl__bar" x="162" y="64" width="20.90310530002335" height="16" rx="3"></rect><text class="qi-dl__val" y="76" x="190.90310530002336">7.22 MB/s</text></g><g class="qi-dl__row qi-dl__row--h2"><text class="qi-dl__name" x="150" y="112" text-anchor="end">io_uring · batch 1</text><rect class="qi-dl__bar" x="162" y="100" width="20.70044361428905" height="16" rx="3"></rect><text class="qi-dl__val" y="112" x="190.70044361428904">7.15 MB/s</text></g><g class="qi-dl__row qi-dl__row--h2 is-deep"><text class="qi-dl__name" x="150" y="140" text-anchor="end">io_uring · batch 16</text><rect class="qi-dl__bar" x="162" y="128" width="248" height="16" rx="3"></rect><text class="qi-dl__val" y="140" x="418">85.66 MB/s</text></g><g class="qi-dl__row qi-dl__row--h3"><text class="qi-dl__name" x="150" y="176" text-anchor="end">S3 · 1 reader</text><rect class="qi-dl__bar" x="162" y="164" width="2" height="16" rx="3"></rect><text class="qi-dl__val" y="176" x="172">0.17 MB/s</text></g><g class="qi-dl__row qi-dl__row--h3 is-deep"><text class="qi-dl__name" x="150" y="204" text-anchor="end">S3 · 128 readers</text><rect class="qi-dl__bar" x="162" y="192" width="32.77328975017512" height="16" rx="3"></rect><text class="qi-dl__val" y="204" x="202.7732897501751">11.32 MB/s</text></g></svg>