<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="description">
  <desc id="description">Applications connect to Qdrant through client SDKs for Python, TypeScript, Rust, Go, Java, and C#. Qdrant holds collections, each with its own distance metric such as Cosine, Dot product, or Euclidean. A collection holds points, and each point has an ID, one or more vectors, and a payload.</desc>
