<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 615" role="img" aria-labelledby="desc"><desc id="desc">Nearby points interact separately with the target; a distant group is represented by its center of mass.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#576280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f0f3fa"/><rect x="60" y="35" width="245" height="180" rx="12" fill="white" stroke="#b4bacc" stroke-width="2" stroke-dasharray="6 6"/><circle cx="95" cy="70" r="7" fill="#576280"/><circle cx="140" cy="100" r="7" fill="#576280"/><circle cx="210" cy="60" r="7" fill="#576280"/><circle cx="260" cy="120" r="7" fill="#576280"/><circle cx="110" cy="170" r="7" fill="#576280"/><circle cx="235" cy="185" r="7" fill="#576280"/><circle cx="185" cy="125" r="13" fill="#009688"/><text x="185" y="255" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">Distant group</text><text x="185" y="286" text-anchor="middle" font-family="Geist Mono, monospace" font-size="22" fill="#0b0f19">Center of mass</text><path d="M185 139 L330 415" fill="none" stroke="#576280" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="6 6"/><circle cx="330" cy="430" r="13" fill="#dc244c"/><text x="330" y="485" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">Target point</text><circle cx="440" cy="330" r="8" fill="#576280"/><path d="M430 330 L345 425" fill="none" stroke="#576280" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="485" cy="420" r="8" fill="#576280"/><path d="M475 420 L345 425" fill="none" stroke="#576280" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="410" cy="520" r="8" fill="#576280"/><path d="M400 520 L345 425" fill="none" stroke="#576280" stroke-width="2.5" marker-end="url(#arrow)"/><text x="470" y="580" text-anchor="middle" font-family="Geist Mono, monos