<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -16 800 340" width="800" height="340" role="img" aria-labelledby="t d">
  <title id="t">Scalar quantization: float32 values mapped onto int8 levels</title>
  <desc id="d">A histogram of 400 float32 coordinate values, two of them outliers. Without a quantile, the bounds are the smallest and largest value, -1.05 and 2.90, and one of the 256 int8 levels is 0.0155 wide. With quantile 0.99 the most extreme 1% of values are ignored, the bounds tighten to -0.76 and 1.19, and one level is 0.0077 wide. The value 0.30 becomes int8 code 10.</desc>
  <style>
    
    .qscalar { display: block; text-align: left; }
    .qscalar .qi-fig { gap: 16px; }
    .qscalar .qi-controls { justify-content: space-between; }
    .qscalar .qi-status--3 { min-height: calc(3 * 1.45em); }
    .qscalar .qscalar__val { display: inline-flex; align-items: center; gap: 8px; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #656b7f; }
    .qscalar .qscalar__val input { width: 160px; margin: 0; accent-color: #303547; cursor: pointer; }
    .qscalar .qscalar__val input:focus-visible { outline: 2px solid #303547; outline-offset: 3px; }
    .qscalar .qscalar__val output { min-width: 3.2em; color: #303547; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .qscalar .qscalar-h { fill: #656b7f; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 14px; }
    .qscalar .qscalar-bin.is-in { fill: #6047ff; }
    .qscalar .qscalar-bin.is-out { fill: #dc244c; }
    .qscalar .qscalar-bound { stroke: #303547; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .qscalar .qscalar-funnel { fill: #6047ff; fill-opacity: 0.12; stroke: #6047ff; stroke-width: 1; stroke-opacity: 0.6; }
    .qscalar .qscalar-int8 { fill: #f0f3fa; stroke: #d3d9eb; stroke-width: 1; }
    .qscalar .qscalar-mark { stroke: #303547; stroke-width: 2; }
    .qscalar .qscalar-mark.is-over { stroke: #dc244c; }
    .qscalar .qscalar-dot { fill: #303547; }
    .qscalar .qscalar-dot.is-over { fill: #dc244c; }
    .qscalar .qscalar-ign { fill: #dc244c; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 600; }
    
    .qi-axis { stroke: #abb1c7; stroke-width: 1.5; }
  </style>
  <rect x="-20" y="-16" width="800" height="340" fill="#FFFFFF" rx="12"/>
  <g class="qscalar"><text class="qscalar-h" x="0" y="14">float32 values of one illustrative vector, 400 coordinates</text><line class="qscalar-bound" x1="126.9" y1="38" x2="126.9" y2="142"/><text class="qscalar-h" x="132.9" y="34" text-anchor="start">lower bound -0.76</text><line class="qscalar-bound" x1="424.8" y1="38" x2="424.8" y2="142"/><text class="qscalar-h" x="430.8" y="34" text-anchor="start">upper bound 1.19</text><rect class="qscalar-bin is-out" x="75.7" y="140.2" width="13.7" height="1.8"/><rect class="qscalar-bin is-out" x="106.1" y="140.2" width="13.7" height="1.8"/><rect class="qscalar-bin is-in" x="121.3" y="136.5" width="13.7" height="5.5"/><rect class="qscalar-bin is-in" x="136.5" y="118.1" width="13.7" height="23.9"/><rect class="qscalar-bin is-in" x="151.7" y="125.4" width="13.7" height="16.6"/><rect class="qscalar-bin is-in" x="167.0" y="114.4" width="13.7" height="27.6"/><rect class="qscalar-bin is-in" x="182.2" y="103.4" width="13.7" height="38.6"/><rect class="qscalar-bin is-in" x="197.4" y="83.1" width="13.7" height="58.9"/><rect class="qscalar-bin is-in" x="212.6" y="62.9" width="13.7" height="79.1"/><rect class="qscalar-bin is-in" x="227.8" y="64.7" width="13.7" height="77.3"/><rect class="qscalar-bin is-in" x="243.0" y="50.0" width="13.7" height="92.0"/><rect class="qscalar-bin is-in" x="258.3" y="64.7" width="13.7" height="77.3"/><rect class="qscalar-bin is-in" x="273.5" y="70.2" width="13.7" height="71.8"/><rect class="qscalar-bin is-in" x="288.7" y="96.0" width="13.7" height="46.0"/><rect class="qscalar-bin is-in" x="303.9" y="90.5" width="13.7" height="51.5"/><rect class="qscalar-bin is-in" x="319.1" y="116.2" width="13.7" height="25.8"/><rect class="qscalar-bin is-in" x="334.3" y="132.8" width="13.7" height="9.2"/><rect class="qscalar-bin is-in" x="349.6" y="129.1" width="13.7" height="12.9"/><rect class="qscalar-bin is-in" x="364.8" y="136.5" width="13.7" height="5.5"/><rect class="qscalar-bin is-in" x="380.0" y="140.2" width="13.7" height="1.8"/><rect class="qscalar-bin is-in" x="395.2" y="140.2" width="13.7" height="1.8"/><rect class="qscalar-bin is-in" x="410.4" y="136.5" width="13.7" height="5.5"/><rect class="qscalar-bin is-out" x="608.3" y="140.2" width="13.7" height="1.8"/><rect class="qscalar-bin is-out" x="669.1" y="140.2" width="13.7" height="1.8"/><text class="qscalar-ign" x="650.1" y="128" text-anchor="middle">ignored</text><line class="qi-axis" x1="30" y1="142" x2="730" y2="142"/><text class="qscalar-h" x="90.9" y="162" text-anchor="middle">-1</text><text class="qscalar-h" x="243.0" y="162" text-anchor="middle">0</text><text class="qscalar-h" x="395.2" y="162" text-anchor="middle">1</text><text class="qscalar-h" x="547.4" y="162" text-anchor="middle">2</text><text class="qscalar-h" x="699.6" y="162" text-anchor="middle">3</text><polygon class="qscalar-funnel" points="126.9,172 424.8,172 730,238 30,238"/><rect class="qscalar-int8" x="30" y="238" width="700" height="20" rx="3"/><text class="qscalar-h" x="30" y="278">-128</text><text class="qscalar-h" x="380" y="278" text-anchor="middle">int8 codes: 256 levels</text><text class="qscalar-h" x="730" y="278" text-anchor="end">127</text><line class="qscalar-mark" x1="288.7" y1="44" x2="288.7" y2="172"/><line class="qscalar-mark" x1="288.7" y1="172" x2="408.8" y2="248"/><circle class="qscalar-dot" cx="408.8" cy="248" r="6"/></g>
</svg>
