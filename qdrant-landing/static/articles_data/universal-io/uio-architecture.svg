<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="t d" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<title id="t">Universal I/O architecture</title><desc id="d">Consumer code uses one interface. mmap returns a borrowed slice directly, io_uring exchanges local disk reads with the Linux kernel through submission and completion ring buffers, and network I/O runs remote object-storage requests as Tokio tasks.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#656b7f"/></marker></defs>
