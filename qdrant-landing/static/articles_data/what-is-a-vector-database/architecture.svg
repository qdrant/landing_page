<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="description">
  <desc id="description">Applications connect to Qdrant through client SDKs for Python, TypeScript, Rust, Go, Java, and C#. Qdrant holds collections, each with its own distance metric. A collection holds points; one point is shown with ID 42, a dense and a sparse named vector, and a JSON payload with species and color fields.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#656b7f"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc244c"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="639" height="299" rx="6" fill="#f0f3fa" stroke="#d3d9eb" stroke-width="1"/>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="16" y="62" width="112" height="176" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="72" y="88" font-size="14" text-anchor="middle" fill="#303547" font-weight="600">Client SDKs</text>
    <text x="32" y="114" font-size="13" fill="#656b7f">Python</text>
