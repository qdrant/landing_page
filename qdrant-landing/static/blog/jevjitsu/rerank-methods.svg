<svg xmlns="http://www.w3.org/2000/svg" width="420" height="350" viewBox="0 0 420 350" role="img" aria-labelledby="t d">
<title id="t">Three ways to rerank with Jev</title>
<desc id="d">Jev Score asks how relevant each doc is, judging every doc on its own, in one request. Jev Choice asks once which doc is most relevant, judging all docs together, in one request. Both produce a ranking such as C, A, D, B. Jev Iterative asks the same question once per ranking position, removing each winner: C, then A, then D, using 10 requests for a top 10. The example is illustrative.</desc>
