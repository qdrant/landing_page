<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
<title id="t">Caching two copies of the vectors in RAM</title>
<desc id="d">Caching the full-precision vectors alone leaves headroom under the cluster RAM budget. Also caching the compressed copy alongside it pushes the resident working set past the budget.</desc>
<style>
  text { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #303547; }
  .title { font-size: 23px; font-weight: 600; }
  .head { font-size: 21px; font-weight: 600; }
  .label { font-size: 21px; }
  .small { font-size: 20px; }
  .note { font-size: 19px; fill: #656b7f; }
  .muted { fill: #656b7f; }
  .axis { stroke: #abb1c7; stroke-width: 1.5; fill: none; }
</style>
<rect x="0.5" y="0.5" width="959" height="439" rx="12" fill="#f0f3fa" stroke="#d3d9eb"/>
<text class="head" x="40" y="56">Caching the full-precision vectors alone</text>
<text class="note" x="800" y="90" text-anchor="end">cluster RAM budget</text>
<rect x="40" y="104" width="760" height="56" rx="8" fill="#ffffff" stroke="#d3d9eb"/>
<rect x="40" y="104" width="420" height="56" rx="8" fill="#6047ff"/>
<text class="small" x="250" y="139" text-anchor="middle" style="fill:#ffffff">full-precision vectors, cached</text>
<line x1="800" x2="800" y1="96" y2="168" stroke="#303547" stroke-width="2"/>
<text class="small muted" x="40" y="216">One resident copy. Room to spare for growth.</text>
<text class="head" x="40" y="252">Also caching the compressed copy alongside it</text>
<text class="note" x="800" y="286" text-anchor="end">cluster RAM budget</text>
<rect x="40" y="300" width="760" height="56" rx="8" fill="#ffffff" stroke="#d3d9eb"/>
<rect x="452" y="300" width="348" height="56" fill="#00838f"/>
<rect x="800" y="300" width="80" height="56" fill="#dc244c"/>
<rect x="40" y="300" width="420" height="56" rx="8" fill="#6047ff"/>
<text class="small" x="250" y="335" text-anchor="middle" style="fill:#ffffff">full-precision vectors, cached</text>
<text class="small" x="630" y="335" text-anchor="middle" style="fill:#ffffff">+ compressed copy, cached</text>
<text class="note" x="840" y="384" text-anchor="middle" style="fill:#9e0d38;font-weight:600">over budget</text>
<line x1="800" x2="800" y1="292" y2="364" stroke="#303547" stroke-width="2"/>
<text class="small muted" x="40" y="412">Two resident copies competing for the same budget.</text>
</svg>
