  <title id="title">miniCOIL vectors in a sparse representation</title>
  <desc id="desc">A bag-of-words vector reserves one coordinate per word. miniCOIL reserves four. Contextualized dense word embeddings produce four-dimensional meaning vectors, which are copied into each word's reserved coordinates. Absent words stay zero. Cell shading is illustrative.</desc>
