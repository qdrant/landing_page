<figure class="snr-figure" id="snr-lexicalretrievers" aria-labelledby="snr-title-1">
<div class="snr-heading"><span class="snr-title" id="snr-title-1">Lexical retrieval</span><span class="snr-kind">Exact terms · word statistics</span></div>
<div class="snr-lanes"><div class="snr-lane"><div class="snr-box snr-query"><span class="snr-label">Query</span><div class="snr-tokens"><span class="snr-token"><span>What</span></span><span class="snr-token snr-hit"><span>is</span></span><span class="snr-token snr-hit"><span>Qdrant</span></span></div><p class="snr-note">Match only terms present in the document.</p></div><div class="snr-bypass" aria-hidden="true"></div></div><div class="snr-lane"><div class="snr-box snr-doc"><span class="snr-label">Document 42</span><div class="snr-tokens"><span class="snr-token snr-hit"><span>Qdrant</span></span><span class="snr-token snr-hit"><span>is</span></span><span class="snr-token"><span>a</span></span><span class="snr-token"><span>vector</span></span><span class="snr-token"><span>database</span></span></div></div><div class="snr-arrow" aria-hidden="true"></div><div class="snr-box snr-doc"><span class="snr-label">Document term frequency (TF)</span><div class="snr-tokens"><span class="snr-token snr-hit"><span>Qdrant</span><span class="snr-weight">1</span></span><span class="snr-token snr-hit"><span>is</span><span class="snr-weight">1</span></span><span class="snr-token"><span>a</span><span class="snr-weight">1</span></span><span class="snr-token"><span>vector</span><span class="snr-weight">1</span></span><span class="snr-token"><span>database</span><span class="snr-weight">1</span></span></div></div></div></div><div class="snr-join" aria-hidden="true"><div class="snr-arrow" aria-hidden="true"></div></div><div class="snr-box snr-op"><span class="snr-label">Word statistics → relevance score</span><p class="snr-note">Sum contributions from matching query terms. BM25 combines document TF with corpus statistics: inverse document frequency (IDF) and average document length.</p><div class="snr-bm25"><div class="snr-box snr-"><span class="snr-label">IDF factor</span><div class="snr-math">log(N / df(t))</div></div><div class="snr-box snr-"><span class="snr-label">TF and length factor</span><div class="snr-frac"><span>(k₁ + 1) · tf(t, d)</span><span>k₁ · (1 − b + b · dl(d)/dl<sub>avg</sub>) + tf(t, d)</span></div></div></div><p class="snr-note">BM25 = Σ<sub>t ∈ q</sub> IDF factor × TF and length factor. N: corpus size; df(t): documents containing t; k₁ and b: parameters; dl(d): document length; dl<sub>avg</sub>: average document length.</p></div>
<figcaption class="snr-caption">Query and document meet through shared terms, not learned embeddings. BM25 is the illustrative scoring formula from the original figure.</figcaption>
