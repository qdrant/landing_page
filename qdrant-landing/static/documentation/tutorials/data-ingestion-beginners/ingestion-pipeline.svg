<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-labelledby="t d" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="t">S3 to Qdrant ingestion pipeline</title>
  <desc id="d">Each product folder in an S3 bucket holds a review text and a product image. A Python script with boto3 and Pillow reads them. FastEmbed embeds the review with MiniLM into 384 dimensions and the image with CLIP into 512 dimensions, locally. Qdrant stores both vectors and a payload as one point in the products-data collection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#656b7f"/>
    </marker>
  </defs>
  <rect width="800" height="310" rx="12" fill="#ffffff" stroke="#d3d9eb"/>
  <g transform="translate(16 30)">
    <rect class="frame" width="150" height="220" rx="10" fill="#ffffff" stroke="#abb1c7" stroke-width="2"/>
    <text x="14" y="28" font-size="15" fill="#656b7f">1. S3 bucket</text>
    <text x="14" y="84" font-size="16" fill="#303547">p_1/</text>
    <rect x="78" y="66" width="18" height="24" rx="2" fill="#ecebff" stroke="#6047ff" stroke-width="1.5"/>
    <path d="M82 74h10M82 79h10M82 84h6" stroke="#6047ff" stroke-width="1.5" fill="none"/>
    <rect x="108" y="66" width="24" height="24" rx="2" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
    <path d="M110 87l6-9 5 6 3-4 6 7z" fill="#00838f"/>
    <text x="14" y="132" font-size="16" fill="#303547">p_2/</text>
    <rect x="78" y="114" width="18" height="24" rx="2" fill="#ecebff" stroke="#6047ff" stroke-width="1.5"/>
    <path d="M82 122h10M82 127h10M82 132h6" stroke="#6047ff" stroke-width="1.5" fill="none"/>
    <rect x="108" y="114" width="24" height="24" rx="2" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
    <path d="M110 135l6-9 5 6 3-4 6 7z" fill="#00838f"/>
    <text x="14" y="180" font-size="16" fill="#656b7f">...</text>

  </g>
  <g transform="translate(222 30)">
    <rect class="frame" width="150" height="220" rx="10" fill="#ffffff" stroke="#abb1c7" stroke-width="2"/>
    <text x="14" y="28" font-size="15" fill="#656b7f">2. Python</text>
    <text x="14" y="58" font-size="14" fill="#656b7f">boto3 + Pillow</text>
    <rect x="12" y="76" width="126" height="56" rx="6" fill="#ecebff" stroke="#6047ff" stroke-width="1.5"/>
    <text x="75" y="109" text-anchor="middle" font-size="15" fill="#303547">review: str</text>
    <rect x="12" y="148" width="126" height="56" rx="6" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
    <text x="75" y="181" text-anchor="middle" font-size="15" fill="#303547">image: PIL</text>

  </g>
  <g transform="translate(428 30)">
    <rect class="frame" width="150" height="220" rx="10" fill="#ffffff" stroke="#abb1c7" stroke-width="2"/>
    <text x="14" y="28" font-size="15" fill="#656b7f">3. FastEmbed</text>
    <text x="14" y="58" font-size="14" fill="#656b7f">runs locally</text>
    <rect x="12" y="76" width="126" height="56" rx="6" fill="#ecebff" stroke="#6047ff" stroke-width="1.5"/>
    <text x="75" y="100" text-anchor="middle" font-size="16" font-weight="600" fill="#303547">MiniLM</text>
    <text x="75" y="120" text-anchor="middle" font-size="14" fill="#656b7f">384 dims</text>
    <rect x="12" y="148" width="126" height="56" rx="6" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
    <text x="75" y="172" text-anchor="middle" font-size="16" font-weight="600" fill="#303547">CLIP</text>
    <text x="75" y="192" text-anchor="middle" font-size="14" fill="#656b7f">512 dims</text>

  </g>
  <g transform="translate(634 30)">
    <rect class="frame" width="150" height="220" rx="10" fill="#ffffff" stroke="#abb1c7" stroke-width="2"/>
    <text x="14" y="28" font-size="15" fill="#656b7f">4. Qdrant</text>
    <text x="14" y="58" font-size="14" fill="#656b7f">products-data</text>
    <rect x="8" y="72" width="134" height="132" rx="6" fill="#f0f3fa" stroke="#d3d9eb" stroke-width="1.5"/>
    <text x="18" y="105" font-size="14" fill="#303547">text</text>
    <rect x="82" y="88" width="4" height="24" fill="#6047ff"/>
    <rect x="89" y="88" width="4" height="24" fill="#6047ff"/>
    <rect x="96" y="88" width="4" height="24" fill="#6047ff"/>
    <rect x="103" y="88" width="4" height="24" fill="#6047ff"/>
    <rect x="110" y="88" width="4" height="24" fill="#6047ff"/>
    <rect x="117" y="88" width="4" height="24" fill="#6047ff"/>
    <text x="18" y="143" font-size="14" fill="#303547">image</text>
    <rect x="82" y="126" width="4" height="24" fill="#00838f"/>
    <rect x="89" y="126" width="4" height="24" fill="#00838f"/>
    <rect x="96" y="126" width="4" height="24" fill="#00838f"/>
    <rect x="103" y="126" width="4" height="24" fill="#00838f"/>
    <rect x="110" y="126" width="4" height="24" fill="#00838f"/>
    <rect x="117" y="126" width="4" height="24" fill="#00838f"/>
    <rect x="124" y="126" width="4" height="24" fill="#00838f"/>
    <rect x="131" y="126" width="4" height="24" fill="#00838f"/>
    <text x="18" y="181" font-size="14" fill="#303547">payload</text>
    <rect x="82" y="164" width="22" height="24" rx="2" fill="#abb1c7"/>
    <rect x="108" y="164" width="22" height="24" rx="2" fill="#abb1c7"/>

  </g>
  <line x1="170" y1="140" x2="216" y2="140" stroke="#656b7f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="376" y1="140" x2="422" y2="140" stroke="#656b7f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="582" y1="140" x2="628" y2="140" stroke="#656b7f" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-size="15" fill="#303547">
    <rect x="178" y="276" width="16" height="16" rx="2" fill="#6047ff"/><text x="202" y="289">review text</text>
    <rect x="334" y="276" width="16" height="16" rx="2" fill="#00838f"/><text x="358" y="289">product image</text>
    <rect x="514" y="276" width="16" height="16" rx="2" fill="#abb1c7"/><text x="538" y="289">payload</text>
  </g>
</svg>
