{{ with (.Site.GetPage "/quantization/hero") }}
  <section class="quantization-hero">
    <div class="container">
      <div class="row">
        <div class="col-12 col-lg-6">
          <p class="quantization-hero__label">{{ .Params.label }}</p>
          <h1 class="quantization-hero__title">{{ .Params.title }}</h1>
          <p class="quantization-hero__description">{{ .Params.description }}</p>
          <div class="quantization-hero__link">
            <a href="{{ .Params.button.url }}" class="button button_contained button_lg">
              {{ .Params.button.text }}
            </a>
          </div>
        </div>
        <div class="col-12 col-lg-6">
          <div class="quantization-hero__code-container">
            {{ partial "code-window" (dict
              "block" "quantization-hero"
              "codeBar" .Params.codeBar
              "code" .Params.code
            ) }}
          </div>
        </div>
      </div>
    </div>
  </section>
{{ end }}
