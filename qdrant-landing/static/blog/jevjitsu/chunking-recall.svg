<svg xmlns="http://www.w3.org/2000/svg" width="420" height="958" viewBox="0 0 420 958" role="img" aria-labelledby="t d"><title id="t">Fixed-size chunks split the answer, Jev chunks keep it together</title><desc id="d">For the question "What language is this dataset in?", fixed-size chunks 26 and 27, 200 tokens each, split the answer about the Phoenix dataset across two chunks. Jev chunk 25, 420 tokens, holds the whole answer in one chunk.</desc><rect width="420" height="958" fill="#f0f3fa"/><g font-family="'Mona Sans', -apple-system, 'Segoe UI', sans-serif"><rect x="8" y="8" width="404" height="114" rx="6" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="20" y="34" font-size="14" fill="#656b7f" textLength="56.03" lengthAdjust="spacing">Question</text><text x="20" y="58" font-size="16" font-weight="700" fill="#303547">What language is this dataset in?</text><text x="20" y="84" font-size="14" fill="#656b7f">paper: Creating a Real-Time, Reproducible</text><text x="20" y="106" font-size="14" fill="#656b7f">Event Dataset</text><g transform="translate(0,122)"><rect x="8" y="8" width="404" height="438" rx="6" fill="#dc244c" fill-opacity="0.08" stroke="#dc244c" stroke-width="1.5"/><text x="20" y="42" font-size="18" font-weight="700" fill="#303547" textLength="155.05" lengthAdjust="spacing">Fixed-size chunks</text><rect x="20" y="54" width="224.85" height="26" rx="13" fill="#dc244c"/><text x="34" y="72" font-size="14" font-weight="700" fill="#ffffff" textLength="196.85" lengthAdjust="spacing">Answer split across 2 chunks</text><text x="20" y="102" font-size="14" fill="#656b7f" textLength="329.57" lengthAdjust="spacing">Always cut every ~200 tokens, no matter the content.</text><rect class="card" x="20" y="120" width="380" height="162" rx="6" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="32" y="146" font-size="14" font-weight="700" fill="#303547" textLength="63.01" lengthAdjust="spacing">Chunk 26</text><text x="107.01" y="146" font-size="14" fill="#656b7f" textLength="68.5" lengthAdjust="spacing">200 tokens</text><text x="32" y="174" font-size="14" fill="#303547" textLength="344.71" lengthAdjust="spacing">... wrapped as Docker containers, which allows for easy</text><text x="32" y="196" font-size="14" fill="#303547" textLength="330.74" lengthAdjust="spacing">deployment and transportability of applications. Thus,</text><text x="32" y="218" font-size="14" fill="#303547" textLength="349.43" lengthAdjust="spacing">with a single command users are capable of standing up</text><text x="32" y="240" font-size="14" fill="#303547" textLength="333.09" lengthAdjust="spacing">an easy-to-use API around the two main event coding</text><text x="32" y="262" font-size="14" fill="#303547" textLength="80.16" lengthAdjust="spacing">components.</text><rect class="card" x="20" y="294" width="380" height="140" rx="6" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="32" y="320" font-size="14" font-weight="700" fill="#303547" textLength="63.01" lengthAdjust="spacing">Chunk 27</text><text x="107.01" y="320" font-size="14" fill="#656b7f" textLength="68.5" lengthAdjust="spacing">200 tokens</text><rect x="29" y="334" width="348.44" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="356" width="327.44" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="378" width="353.87" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="400" width="117.28" height="20" rx="3" fill="#ffe0b2"/><text x="32" y="348" font-size="14" fill="#303547" textLength="342.44" lengthAdjust="spacing">The Phoenix dataset is an attempt to take both the new</text><text x="32" y="370" font-size="14" fill="#303547" textLength="321.44" lengthAdjust="spacing">advances in event data described above, along with</text><text x="32" y="392" font-size="14" fill="#303547" textLength="347.87" lengthAdjust="spacing">decades of knowledge regarding best practices, in order</text><text x="32" y="414" font-size="14" fill="#303547" textLength="111.28" lengthAdjust="spacing">to create a new ...</text><rect x="8" y="454" width="404" height="374" rx="6" fill="#c0f0f0" fill-opacity="0.45" stroke="#038585" stroke-width="1.5"/><text x="20" y="488" font-size="18" font-weight="700" fill="#303547" textLength="98.05" lengthAdjust="spacing">Jev chunks</text><rect x="20" y="500" width="168.8" height="26" rx="13" fill="#c0f0f0" stroke="#038585" stroke-width="1.5"/><text x="34" y="518" font-size="14" font-weight="700" fill="#004f4f" textLength="140.8" lengthAdjust="spacing">Answer in one chunk</text><text x="20" y="548" font-size="14" fill="#656b7f" textLength="181.33" lengthAdjust="spacing">Cut where the topic changes.</text><rect class="card" x="20" y="566" width="380" height="250" rx="6" fill="#ffffff" stroke="#038585" stroke-width="1.5"/><text x="32" y="592" font-size="14" font-weight="700" fill="#303547" textLength="63.01" lengthAdjust="spacing">Chunk 25</text><text x="107.01" y="592" font-size="14" fill="#656b7f" textLength="68.5" lengthAdjust="spacing">420 tokens</text><rect x="29" y="606" width="348.44" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="628" width="327.44" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="650" width="353.87" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="672" width="321.98" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="694" width="341.41" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="716" width="350.75" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="738" width="332.88" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="760" width="357.51" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="782" width="119.64" height="20" rx="3" fill="#ffe0b2"/><text x="32" y="620" font-size="14" fill="#303547" textLength="342.44" lengthAdjust="spacing">The Phoenix dataset is an attempt to take both the new</text><text x="32" y="642" font-size="14" fill="#303547" textLength="321.44" lengthAdjust="spacing">advances in event data described above, along with</text><text x="32" y="664" font-size="14" fill="#303547" textLength="347.87" lengthAdjust="spacing">decades of knowledge regarding best practices, in order</text><text x="32" y="686" font-size="14" fill="#303547" textLength="315.98" lengthAdjust="spacing">to create a new iteration of event data. The dataset</text><text x="32" y="708" font-size="14" fill="#303547" textLength="335.41" lengthAdjust="spacing">makes use of 450 English-language news sites, which</text><text x="32" y="730" font-size="14" fill="#303547" textLength="344.75" lengthAdjust="spacing">are each scraped every hour for new content. New data</text><text x="32" y="752" font-size="14" fill="#303547" textLength="326.88" lengthAdjust="spacing">is generated on a daily basis, coded according to the</text><text x="32" y="774" font-size="14" fill="#303547" textLength="351.51" lengthAdjust="spacing">CAMEO event ontology, with an average of 2,200 events</text><text x="32" y="796" font-size="14" fill="#303547" textLength="113.64" lengthAdjust="spacing">generated per day</text><text x="149.53" y="796" font-size="14" fill="#303547" textLength="11.67" lengthAdjust="spacing">...</text></g></g></svg>
