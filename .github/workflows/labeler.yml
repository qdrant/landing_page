name: Label PRs by file path

on:
  # pull_request_target gives fork PRs a token with write access.
  # This is safe here because the workflow never checks out or runs PR code.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: false
