<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" role="img" aria-labelledby="title desc">
<title id="title">The same twelve cells read in order, scattered and linked by pointers or contiguous in an array. Positions are illustrative.</title>
<desc id="desc">Read the twelve cells in order. When they are scattered, each address is known only after the previous cell has been read. When they are contiguous, the next cell sits right after the current one. Hover a cell to compare.</desc>
