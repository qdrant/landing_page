name: Label PRs by file path

on:
  # pull_request_target gives fork PRs a token with write access.
  # This is safe here because the workflow never checks out or runs PR code.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - id: labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false

      # Labels added with GITHUB_TOKEN don't trigger the "labeled" event, so
      # notify from here. Manually added labels are handled by slack-notify.yml.
      - id: matched
        env:
          NEW_LABELS: ${{ steps.labeler.outputs.new-labels }}
        run: |
          matched=$(echo "$NEW_LABELS" | tr -d ' ' | tr ',' '\n' | grep -xE 'documentation|automation' | paste -sd, - | sed 's/,/, /g' || true)
          echo "labels=$matched" >> "$GITHUB_OUTPUT"

      - if: steps.matched.outputs.labels != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ${{ toJSON(format(':label: *{0}* label added: <{1}|#{2} {3}> by {4}', steps.matched.outputs.labels, github.event.pull_request.html_url, github.event.pull_request.number, github.event.pull_request.title, github.event.pull_request.user.login)) }}
