name: Update Github Stars

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "00 17 * * 0"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run github-stars update script
        run: |
          bash -x automation/update-stats.sh
      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "Update GitHub Stars"
          commit_user_name: "GitHub Actions"
          commit_user_email: "team@qdrant.com"