<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
<title id="t">HNSW inline storage and on-disk graph size</title>
<desc id="d">A standard HNSW graph stores a link per edge. Inline storage also stores a compressed copy of the neighbor's vector on every edge, so on-disk graph size grows with edge count and the gap to the standard graph widens as a collection scales.</desc>
