<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 426" role="img" aria-labelledby="description">
  <desc id="description">A replica set manages copies of the same shard across nodes. On one node it holds a local shard, with a write-ahead log, segments, and an optimizer, and a remote shard, whose connection pool sends gRPC requests to the local shard on another node. Each segment has an ID mapping, vector storage and a vector index, and payload storage and a payload index.</desc>
