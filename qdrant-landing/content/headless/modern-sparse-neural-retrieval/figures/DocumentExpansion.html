<figure class="snr-figure" id="snr-documentexpansion" aria-labelledby="snr-title-9">
<div class="snr-heading"><span class="snr-title" id="snr-title-9">Document expansion</span><span class="snr-kind">Bridge the vocabulary gap</span></div>
<div class="snr-lanes"><div class="snr-lane"><div class="snr-box snr-query"><span class="snr-label">Query</span><div class="snr-tokens"><span class="snr-token"><span>pizza</span></span></div></div></div><div class="snr-lane"><div class="snr-box snr-doc"><span class="snr-label">Document 42 · original</span><div class="snr-tokens"><span class="snr-token"><span>Margherita</span></span></div></div></div></div><div class="snr-join" aria-hidden="true"><div class="snr-arrow" aria-hidden="true"></div></div><div class="snr-box snr-op"><span class="snr-label">No exact term match</span><p class="snr-note">pizza ≠ Margherita. The document cannot match this query through exact terms.</p></div><div class="snr-arrow" aria-hidden="true"></div><div class="snr-lanes"><div class="snr-lane"><div class="snr-box snr-query"><span class="snr-label">Query</span><div class="snr-tokens"><span class="snr-token"><span>pizza</span></span></div></div></div><div class="snr-lane"><div class="snr-box snr-doc"><span class="snr-label">Document 42 · expanded</span><div class="snr-tokens"><span class="snr-token"><span>Margherita</span></span><span class="snr-token snr-hit snr-added"><span>pizza</span></span></div></div></div></div><div class="snr-join" aria-hidden="true"><div class="snr-arrow" aria-hidden="true"></div></div><div class="snr-box snr-op"><span class="snr-label">Exact matching becomes possible</span><p class="snr-note">pizza now occurs in both query and document. The dashed term was added by document expansion.</p></div>
<figcaption class="snr-caption">Expansion adds potential query terms to a document. The query stays unchanged; the added pizza term creates an exact match.</figcaption>
</figure>
