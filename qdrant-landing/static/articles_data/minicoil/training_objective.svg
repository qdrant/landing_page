<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="title desc">
  <title id="title">miniCOIL training objective</title>
  <desc id="desc">Left panel, sentence embeddings target: the anchor sentence &#x27;This fruit bat is cute&#x27; is closer to the positive sentence &#x27;A bat slept in a cave&#x27; than to the negative sentence &#x27;I bought a baseball bat&#x27;. The margin is the extra distance of the negative over the positive. Right panel, miniCOIL representations: the three bat points are trained so that the positive point is pulled toward the anchor and the negative point is pushed away, reproducing that ordering. Positions are illustrative.</desc>
