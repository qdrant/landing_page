{{ with (.Site.GetPage "/lp-ai-agent-memory/hero") }}
  <section class="lp-ai-agent-memory-hero">
    <div class="container">
      <div class="lp-ai-agent-memory-hero__copy">
        <p class="lp-ai-agent-memory-hero__label">{{ .Params.label }}</p>
        <h1 class="lp-ai-agent-memory-hero__title">{{ .Params.title }}</h1>
        <p class="lp-ai-agent-memory-hero__description">{{ .Params.description }}</p>
        <div class="lp-ai-agent-memory-hero__actions">
          {{ with .Params.button }}
            <a href="{{ .url }}" class="button button_contained button_lg" {{ if strings.HasPrefix .url "http" }}target="_blank" rel="noopener noreferrer"{{ end }}>{{ .text }}</a>
          {{ end }}
          {{ with .Params.outlineButton }}
            <a href="{{ .url }}" class="button button_outlined button_lg" {{ if strings.HasPrefix .url "http" }}target="_blank" rel="noopener noreferrer"{{ end }}>{{ .text }}</a>
          {{ end }}
        </div>
      </div>
    </div>
  </section>
{{ end }}
