<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 186" role="img" aria-labelledby="description">
  <desc id="description">Three pairs of vectors A and B. Similar vectors point in nearly the same direction with a small angle between them. Unrelated vectors are at a right angle. Opposite vectors point in opposite directions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#656b7f"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc244c"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="639" height="185" rx="6" fill="#f0f3fa" stroke="#d3d9eb" stroke-width="1"/>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="113" y="30" font-size="14" text-anchor="middle" fill="#303547" font-weight="600">similar</text>
    <line x1="35" y1="110" x2="191" y2="110" stroke="#abb1c7" stroke-width="1.5"/>
    <line x1="113" y1="46" x2="113" y2="174" stroke="#abb1c7" stroke-width="1.5"/>
    <path d="M113 110 L128.0 54.0" fill="none" stroke="#303547" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="131.635" y="45.4533" font-size="14" text-anchor="middle" fill="#303547" font-weight="600">A</text>
    <path d="M113 110 L146.3 62.5" fill="none" stroke="#303547" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="154.298" y="56.0211" font-size="14" text-anchor="middle" fill="#303547" font-weight="600">B</text>
    <path d="M125.6 92.0 A22 22 0 0 0 118.7 88.7" fill="none" stroke="#dc244c" stroke-width="1.5"/>
    <text x="320" y="30" font-size="14" text-anchor="middle" fill="#303547" font-weight="600">unrelated</text>
    <line x1="242" y1="110" x2="398" y2="110" stroke="#abb1c7" stroke-width="1.5"/>
    <line x1="320" y1="46" x2="320" y2="174" stroke="#abb1c7" stroke-width="1.5"/>
    <path d="M320 110 L279.0 69.0" fill="none" stroke="#303547" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="269.088" y="64.0883" font-size="14" text-anchor="middle" fill="#303547" font-weight="600">A</text>
    <path d="M320 110 L361.0 69.0" fill="none" stroke="#303547" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="370.912" y="64.0883" font-size="14" text-anchor="middle" fill="#303547" font-weight="600">B</text>
    <path d="M335.6 94.4 A22 22 0 0 0 304.4 94.4" fill="none" stroke="#dc244c" stroke-width="1.5"/>
    <text x="527" y="30" font-size="14" text-anchor="middle" fill="#303547" font-weight="600">opposite</text>
    <line x1="449" y1="110" x2="605" y2="110" stroke="#abb1c7" stroke-width="1.5"/>
    <line x1="527" y1="46" x2="527" y2="174" stroke="#abb1c7" stroke-width="1.5"/>
    <path d="M527 110 L479.5 143.3" fill="none" stroke="#303547" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="468.021" y="156.298" font-size="14" text-anchor="middle" fill="#303547" font-weight="600">A</text>
    <path d="M527 110 L574.5 76.7" fill="none" stroke="#303547" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="585.979" y="73.7025" font-size="14" text-anchor="middle" fill="#303547" font-weight="600">B</text>
    <path d="M545.0 97.4 A22 22 0 0 0 509.0 122.6" fill="none" stroke="#dc244c" stroke-width="1.5"/>
  </g>
</svg>
