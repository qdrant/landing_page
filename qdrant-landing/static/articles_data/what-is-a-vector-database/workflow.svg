<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-labelledby="description">
  <desc id="description">The vector search workflow. Ingestion path: 1, an embedding model turns raw data into vectors, stored with their payload; 2, Qdrant stores them and builds an HNSW index. Query path: 3, the same embedding model turns the user query into a query vector; 4, Qdrant runs a similarity search and returns the top-k results.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#656b7f"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc244c"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="639" height="235" rx="6" fill="#f0f3fa" stroke="#d3d9eb" stroke-width="1"/>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="16" y="32" font-size="13" fill="#656b7f">ingestion path</text>
    <text x="16" y="156" font-size="13" fill="#656b7f">query path</text>
    <rect x="16" y="42" width="104" height="56" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="68" y="65.54" font-size="14" text-anchor="middle" fill="#303547">Raw data</text>
    <text x="68" y="84.18" font-size="13" text-anchor="middle" fill="#656b7f">text, images</text>
    <rect x="16" y="166" width="104" height="56" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="68" y="199.04" font-size="14" text-anchor="middle" fill="#303547">User query</text>
    <rect x="144" y="42" width="96" height="180" rx="6" fill="none" stroke="#6047ff" stroke-width="1.5"/>
    <text x="192" y="127.54" font-size="14" text-anchor="middle" fill="#303547">Embedding</text>
    <text x="192" y="146.54" font-size="14" text-anchor="middle" fill="#303547">model</text>
    <rect x="264" y="42" width="100" height="56" rx="6" fill="none" stroke="#6047ff" stroke-width="1.5"/>
    <text x="314" y="65.54" font-size="14" text-anchor="middle" fill="#303547">Vectors</text>
    <text x="314" y="84.18" font-size="13" text-anchor="middle" fill="#656b7f">+ payload</text>
    <rect x="264" y="166" width="100" height="56" rx="6" fill="none" stroke="#6047ff" stroke-width="1.5"/>
    <text x="314" y="189.54" font-size="14" text-anchor="middle" fill="#303547">Query</text>
    <text x="314" y="208.54" font-size="14" text-anchor="middle" fill="#303547">vector</text>
    <rect x="388" y="42" width="112" height="180" rx="6" fill="none" stroke="#dc244c" stroke-width="1.5"/>
    <text x="444" y="64" font-size="14" text-anchor="middle" fill="#303547" font-weight="600">Qdrant</text>
    <text x="444" y="86" font-size="13" text-anchor="middle" fill="#656b7f">store and</text>
    <text x="444" y="104" font-size="13" text-anchor="middle" fill="#656b7f">index (HNSW)</text>
    <line x1="400" y1="132" x2="488" y2="132" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="444" y="190" font-size="13" text-anchor="middle" fill="#656b7f">similarity</text>
    <text x="444" y="208" font-size="13" text-anchor="middle" fill="#656b7f">search</text>
    <rect x="524" y="166" width="100" height="56" rx="6" fill="none" stroke="#00838f" stroke-width="1.5"/>
    <text x="574" y="189.54" font-size="14" text-anchor="middle" fill="#303547">Top-k</text>
    <text x="574" y="208.54" font-size="14" text-anchor="middle" fill="#303547">results</text>
    <path d="M120 70 H140" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M240 70 H260" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M364 70 H384" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M120 194 H140" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M240 194 H260" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M364 194 H384" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M500 194 H520" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="130" cy="70" r="10" fill="#f0f3fa" stroke="#dc244c" stroke-width="1.5"/>
    <text x="130" y="74.5" font-size="13" text-anchor="middle" fill="#303547" font-weight="600">1</text>
    <circle cx="374" cy="70" r="10" fill="#f0f3fa" stroke="#dc244c" stroke-width="1.5"/>
    <text x="374" y="74.5" font-size="13" text-anchor="middle" fill="#303547" font-weight="600">2</text>
    <circle cx="130" cy="194" r="10" fill="#f0f3fa" stroke="#dc244c" stroke-width="1.5"/>
    <text x="130" y="198.5" font-size="13" text-anchor="middle" fill="#303547" font-weight="600">3</text>
    <circle cx="374" cy="194" r="10" fill="#f0f3fa" stroke="#dc244c" stroke-width="1.5"/>
    <text x="374" y="198.5" font-size="13" text-anchor="middle" fill="#303547" font-weight="600">4</text>
  </g>
</svg>
