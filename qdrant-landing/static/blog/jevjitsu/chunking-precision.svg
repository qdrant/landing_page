<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1008" viewBox="0 0 420 1008" role="img" aria-labelledby="t d"><title id="t">Jev returns the whole answer in a shorter chunk than fixed-size chunking</title><desc id="d">For the question "How long is the dataset?", fixed-size chunks 3 and 4, 200 tokens each, cut the answer at its last word. Jev chunk 5, 161 tokens, holds the whole answer.</desc><rect width="420" height="1008" fill="#f0f3fa"/><g font-family="'Mona Sans', -apple-system, 'Segoe UI', sans-serif"><rect x="8" y="8" width="404" height="114" rx="6" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="20" y="34" font-size="14" fill="#656b7f" textLength="56.03" lengthAdjust="spacing">Question</text><text x="20" y="58" font-size="16" font-weight="700" fill="#303547" textLength="188.46" lengthAdjust="spacing">How long is the dataset?</text><text x="20" y="84" font-size="14" fill="#656b7f" textLength="368.9" lengthAdjust="spacing">paper: IAM at CLEF eHealth 2018: Concept Annotation and</text><text x="20" y="106" font-size="14" fill="#656b7f" textLength="221.77" lengthAdjust="spacing">Coding in French Death Certificates</text><rect x="8" y="130" width="404" height="486" rx="6" fill="#dc244c" fill-opacity="0.08" stroke="#dc244c" stroke-width="1.5"/><text x="20" y="164" font-size="18" font-weight="700" fill="#303547" textLength="155.05" lengthAdjust="spacing">Fixed-size chunks</text><rect x="20" y="176" width="224.85" height="26" rx="13" fill="#dc244c"/><text x="34" y="194" font-size="14" font-weight="700" fill="#ffffff" textLength="196.85" lengthAdjust="spacing">Answer split across 2 chunks</text><text x="20" y="224" font-size="14" fill="#656b7f" textLength="243.18" lengthAdjust="spacing">Cut every ~200 tokens, even mid-topic.</text><rect class="card" x="20" y="242" width="380" height="276" rx="6" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="32" y="268" font-size="14" font-weight="700" fill="#303547" textLength="55.23" lengthAdjust="spacing">Chunk 3</text><text x="99.23" y="268" font-size="14" fill="#656b7f" textLength="68.5" lengthAdjust="spacing">200 tokens</text><text x="32" y="294" font-size="14" fill="#303547" textLength="50.58" lengthAdjust="spacing">Corpora</text><rect x="29" y="306" width="352.31" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="328" width="337.47" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="350" width="345.32" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="372" width="329.51" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="394" width="360.16" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="416" width="360.05" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="438" width="355.4" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="460" width="128.21" height="20" rx="3" fill="#ffe0b2"/><text x="32" y="320" font-size="14" fill="#303547" textLength="346.31" lengthAdjust="spacing">The data set for the coding of death certificates is called</text><text x="32" y="342" font-size="14" fill="#303547" textLength="331.47" lengthAdjust="spacing">the CépiDC corpus. Three CSV files (AlignedCauses)</text><text x="32" y="364" font-size="14" fill="#303547" textLength="339.32" lengthAdjust="spacing">were provided by task organizers containing annotated</text><text x="32" y="386" font-size="14" fill="#303547" textLength="323.51" lengthAdjust="spacing">death certificates for different periods: 2006 to 2012,</text><text x="32" y="408" font-size="14" fill="#303547" textLength="354.16" lengthAdjust="spacing">2013 and 2014. This training set contained 125383 death</text><text x="32" y="430" font-size="14" fill="#303547" textLength="354.05" lengthAdjust="spacing">certificates. Each certificate contains one or more lines of</text><text x="32" y="452" font-size="14" fill="#303547" textLength="349.4" lengthAdjust="spacing">text ... Zero to multiple ICD-10 codes can be assigned to</text><text x="32" y="474" font-size="14" fill="#303547" textLength="122.21" lengthAdjust="spacing">each line of a death</text><path d="M47 497H33M38 492L33 497L38 502" fill="none" stroke="#dc244c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="502" font-size="14" font-weight="700" fill="#dc244c" textLength="147.05" lengthAdjust="spacing">the answer is cut here</text><rect class="card" x="20" y="530" width="380" height="74" rx="6" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="32" y="556" font-size="14" font-weight="700" fill="#303547" textLength="55.23" lengthAdjust="spacing">Chunk 4</text><text x="99.23" y="556" font-size="14" fill="#656b7f" textLength="68.5" lengthAdjust="spacing">200 tokens</text><rect x="29" y="570" width="69.8" height="20" rx="3" fill="#ffe0b2"/><text x="32" y="584" font-size="14" fill="#303547" textLength="63.8" lengthAdjust="spacing">certificate.</text><rect x="8" y="624" width="404" height="376" rx="6" fill="#c0f0f0" fill-opacity="0.45" stroke="#038585" stroke-width="1.5"/><text x="20" y="658" font-size="18" font-weight="700" fill="#303547" textLength="98.05" lengthAdjust="spacing">Jev chunks</text><rect x="20" y="670" width="168.8" height="26" rx="13" fill="#c0f0f0" stroke="#038585" stroke-width="1.5"/><text x="34" y="688" font-size="14" font-weight="700" fill="#004f4f" textLength="140.8" lengthAdjust="spacing">Answer in one chunk</text><text x="20" y="718" font-size="14" fill="#656b7f" textLength="181.33" lengthAdjust="spacing">Cut where the topic changes.</text><rect class="card" x="20" y="736" width="380" height="252" rx="6" fill="#ffffff" stroke="#038585" stroke-width="1.5"/><text x="32" y="762" font-size="14" font-weight="700" fill="#303547" textLength="55.23" lengthAdjust="spacing">Chunk 5</text><text x="99.23" y="762" font-size="14" fill="#656b7f" textLength="68.5" lengthAdjust="spacing">161 tokens</text><text x="32" y="788" font-size="14" fill="#303547" textLength="50.58" lengthAdjust="spacing">Corpora</text><rect x="29" y="800" width="352.31" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="822" width="337.47" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="844" width="345.32" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="866" width="329.51" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="888" width="360.16" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="910" width="360.05" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="932" width="355.4" height="20" rx="3" fill="#ffe0b2"/><rect x="29" y="954" width="195.9" height="20" rx="3" fill="#ffe0b2"/><text x="32" y="814" font-size="14" fill="#303547" textLength="346.31" lengthAdjust="spacing">The data set for the coding of death certificates is called</text><text x="32" y="836" font-size="14" fill="#303547" textLength="331.47" lengthAdjust="spacing">the CépiDC corpus. Three CSV files (AlignedCauses)</text><text x="32" y="858" font-size="14" fill="#303547" textLength="339.32" lengthAdjust="spacing">were provided by task organizers containing annotated</text><text x="32" y="880" font-size="14" fill="#303547" textLength="323.51" lengthAdjust="spacing">death certificates for different periods: 2006 to 2012,</text><text x="32" y="902" font-size="14" fill="#303547" textLength="354.16" lengthAdjust="spacing">2013 and 2014. This training set contained 125383 death</text><text x="32" y="924" font-size="14" fill="#303547" textLength="354.05" lengthAdjust="spacing">certificates. Each certificate contains one or more lines of</text><text x="32" y="946" font-size="14" fill="#303547" textLength="349.4" lengthAdjust="spacing">text ... Zero to multiple ICD-10 codes can be assigned to</text><text x="32" y="968" font-size="14" fill="#303547" textLength="189.9" lengthAdjust="spacing">each line of a death certificate.</text></g></svg>
