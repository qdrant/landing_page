<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">The idea behind miniCOIL</title>
  <desc id="desc">miniCOIL combines two lines of development. It takes small contextualized vectors from COIL, and it keeps the BM25 formula from bag-of-words retrieval, adding context to it. It avoids the storage overhead of COIL and the poor out-of-domain accuracy of sparse encoders.</desc>
