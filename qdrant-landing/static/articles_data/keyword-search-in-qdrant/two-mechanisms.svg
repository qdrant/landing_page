<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace"><rect width="1200" height="470" fill="#eef1f8"/><text x="34" y="30" font-size="15" fill="#8a8f9a">Two places text matching happens</text><rect x="26" y="46" width="1148" height="398" fill="#ffffff"/><text x="111.0" y="180" font-size="13" fill="#3a3f4a" text-anchor="middle" font-weight="400">Query</text><text x="111.0" y="197" font-size="13" fill="#3a3f4a" text-anchor="middle" font-weight="400">text</text><rect x="96" y="214" width="30" height="30" rx="4" fill="#a9b0e0" stroke="#7c86d4" stroke-width="1.6"/><text x="415.0" y="90" font-size="13" fill="#3a3f4a" text-anchor="middle" font-weight="400">Payload Text Index</text><text x="415.0" y="107" font-size="13" fill="#3a3f4a" text-anchor="middle" font-weight="400">MatchText, MatchPhrase</text><text x="415.0" y="242" font-size="13" fill="#3a3f4a" text-anchor="middle" font-weight="400">Sparse Vector</text><text x="415.0" y="259" font-size="13" fill="#3a3f4a" text-anchor="middle" font-weight="400">Qdrant/bm25</text><text x="715.0" y="90" font-size="13" fill="#3a3f4a" text-anchor="middle" font-weight="400">Matched Or Not</text><text x="715.0" y="107" font-size="13" fill="#3a3f4a" text-anchor="middle" font-weight="400">no score, no order</text><text x="715.0" y="242" font-size="13" fill="#3a3f4a" text-anchor="middle" font-weight="400">Ranked By Score</text><text x="715.0" y="259" font-size="13" fill="#3a3f4a" text-anchor="middle" font-weight="400">fuses with dense</text><path d="M126 229 H216 V155 H394" fill="none" stroke="#7c86d4" stroke-width="1.6" marker-end="url(#ar-7c86d4)"/><path d="M126 229 H216 V307 H394" fill="none" stroke="#7c86d4" stroke-width="1.6" marker-end="url(#ar-7c86d4)"/><rect x="400" y="140" width="30" height="30" rx="4" fill="#a9b0e0" stroke="#7c86d4" stroke-width="1.6"/><rect x="400" y="292" width="30" height="30" rx="4" fill="#f9dada" stroke="#e8574a" stroke-width="1.6"/><path d="M430 155 H694" fill="none" stroke="#7c86d4" stroke-width="1.6" marker-end="url(#ar-7c86d4)"/><path d="M430 307 H694" fill="none" stroke="#e8574a" stroke-width="1.6" marker-end="url(#ar-e8574a)"/><rect x="700" y="140" width="30" height="30" rx="4" fill="#a9b0e0" stroke="#7c86d4" stroke-width="1.6"/><rect x="700" y="292" width="30" height="30" rx="4" fill="#f9dada" stroke="#e8574a" stroke-width="1.6"/><path d="M730 155 H920 V229 H974" fill="none" stroke="#1d9c7a" stroke-width="1.6" marker-end="url(#ar-1d9c7a)"/><path d="M730 307 H920 V229 H974" fill="none" stroke="#1d9c7a" stroke-width="1.6" marker-end="url(#ar-1d9c7a)"/><rect x="980" y="214" width="30" height="30" rx="4" fill="#d4ede4" stroke="#1d9c7a" stroke-width="1.6"/><text x="1026" y="218" font-size="13" fill="#1d9c7a" text-anchor="start" font-weight="400">Ranked Results</text><text x="1026" y="235" font-size="13" fill="#1d9c7a" text-anchor="start" font-weight="400">filter narrows,</text><text x="1026" y="252" font-size="13" fill="#1d9c7a" text-anchor="start" font-weight="400">ranking orders</text><path d="M415 170 V362" fill="none" stroke="#7c86d4" stroke-width="1.3" stroke-dasharray="4 4"/><path d="M415 322 V362" fill="none" stroke="#e8574a" stroke-width="1.3" stroke-dasharray="4 4"/><path d="M415 362 H415" fill="none" stroke="#8a8f9a" stroke-width="1.3" stroke-dasharray="4 4"/><text x="415" y="386" font-size="13" fill="#8a8f9a" text-anchor="middle" font-weight="400">Seven settings live on BOTH, under the same names</text><text x="415" y="403" font-size="13" fill="#8a8f9a" text-anchor="middle" font-weight="400">tokenizer  stemmer  stopwords  ascii_folding  lowercase  min_token_len  max_token_len</text><text x="415" y="426" font-size="13" fill="#e8574a" text-anchor="middle" font-weight="400">Set one and the other is unchanged</text><defs><marker id="ar-7c86d4" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#7c86d4"/></marker><marker id="ar-e8574a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#e8574a"/></marker><marker id="ar-1d9c7a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#1d9c7a"/></marker></defs></svg>