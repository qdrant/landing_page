<rect x="66" y="296" width="16" height="16" rx="2" fill="#00838f"/>
<rect x="86" y="296" width="16" height="16" rx="2" fill="#00838f"/>
<rect x="106" y="296" width="16" height="16" rx="2" fill="#00838f"/>
