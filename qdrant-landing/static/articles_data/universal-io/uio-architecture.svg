<text x="380" y="54" font-size="13" fill="#303547" text-anchor="middle">vectors · HNSW links · payload indexes</text>
<text x="380" y="73" font-size="13" fill="#656b7f" text-anchor="middle">written once, generic over the backend</text>
<rect x="130" y="132" width="500" height="84" rx="6" fill="#fff" stroke="#656b7f"/>
<text x="380" y="156" font-size="14" fill="#303547" text-anchor="middle" font-weight="600">Universal I/O traits</text>
<text x="380" y="177" font-size="13" fill="#303547" text-anchor="middle">UniversalReadFs · UniversalRead · ReadPipeline</text>
<text x="380" y="197" font-size="13" fill="#656b7f" text-anchor="middle">schedule() · wait()</text>
