<svg xmlns="http://www.w3.org/2000/svg" width="812" height="232" viewBox="-26 -24 812 232" role="img" aria-labelledby="title desc"><title id="title">A nested filter matches when one array element meets every condition</title><desc id="desc">A nested filter on offers requires shop A and a price under 100 dollars. Point 7 has an offer from shop A for 500 dollars and an offer from shop B for 50 dollars, so the conditions are met by different offers and point 7 doesn't match. Point 9 has an offer from shop A for 80 dollars, which meets both conditions, so point 9 matches.</desc><rect x="-26" y="-24" width="812" height="232" fill="#f0f3fa"/>  <text x="0" y="16" fill="rgb(101, 107, 127)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="400" text-anchor="start">filter</text><g><rect x="60" y="2" width="96" height="20" rx="3" fill="rgb(96, 71, 255)"></rect><text x="108" y="16" text-anchor="middle" fill="rgb(255, 255, 255)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="600">shop = A</text></g><g><rect x="164" y="2" width="124" height="20" rx="3" fill="rgb(0, 131, 143)"></rect><text x="226" y="16" text-anchor="middle" fill="rgb(255, 255, 255)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="600">price &lt; $100</text></g><rect x="0" y="36" width="760" height="144" rx="6" fill="rgb(240, 243, 250)" stroke="rgb(211, 217, 235)" stroke-width="1px"></rect><text x="14" y="58" fill="rgb(101, 107, 127)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14px" font-weight="400" text-anchor="start">Collection</text><text x="118" y="58" fill="rgb(101, 107, 127)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="400" text-anchor="start">offers[0]</text><text x="354" y="58" fill="rgb(101, 107, 127)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="400" text-anchor="start">offers[1]</text><g transform="translate(14 70)" opacity="0.45"><rect width="732" height="44" rx="6" fill="rgb(171, 177, 199)" fill-opacity="0.35" stroke="rgb(211, 217, 235)" stroke-width="1px"></rect><text x="12" y="27" fill="rgb(48, 53, 71)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="400" text-anchor="start">Point 7</text><g><rect x="96" y="6" width="224" height="32" rx="4" fill="none" stroke="rgb(211, 217, 235)" stroke-width="1px"></rect><g><rect x="104" y="12" width="88" height="20" rx="3" fill="rgb(96, 71, 255)"></rect><text x="148" y="26" text-anchor="middle" fill="rgb(255, 255, 255)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="600">shop: A</text></g><g><rect x="200" y="12" width="112" height="20" rx="3" fill="rgb(240, 243, 250)"></rect><text x="256" y="26" text-anchor="middle" fill="rgb(48, 53, 71)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="400">price: $500</text></g></g><g><rect x="332" y="6" width="224" height="32" rx="4" fill="none" stroke="rgb(211, 217, 235)" stroke-width="1px"></rect><g><rect x="340" y="12" width="88" height="20" rx="3" fill="rgb(240, 243, 250)"></rect><text x="384" y="26" text-anchor="middle" fill="rgb(48, 53, 71)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="400">shop: B</text></g><g><rect x="436" y="12" width="112" height="20" rx="3" fill="rgb(0, 131, 143)"></rect><text x="492" y="26" text-anchor="middle" fill="rgb(255, 255, 255)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="600">price: $50</text></g></g><text x="580" y="27" fill="rgb(101, 107, 127)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="400" text-anchor="start">no match</text></g><g transform="translate(14 122)"><rect width="732" height="44" rx="6" fill="rgb(171, 177, 199)" fill-opacity="0.35" stroke="rgb(211, 217, 235)" stroke-width="1px"></rect><text x="12" y="27" fill="rgb(48, 53, 71)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="400" text-anchor="start">Point 9</text><g><rect x="96" y="6" width="224" height="32" rx="4" fill="none" stroke="rgb(211, 217, 235)" stroke-width="1px"></rect><g><rect x="104" y="12" width="88" height="20" rx="3" fill="rgb(240, 243, 250)"></rect><text x="148" y="26" text-anchor="middle" fill="rgb(48, 53, 71)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="400">shop: B</text></g><g><rect x="200" y="12" width="112" height="20" rx="3" fill="rgb(240, 243, 250)"></rect><text x="256" y="26" text-anchor="middle" fill="rgb(48, 53, 71)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="400">price: $120</text></g></g><g><rect x="332" y="6" width="224" height="32" rx="4" fill="none" stroke="rgb(48, 53, 71)" stroke-width="1.5px"></rect><g><rect x="340" y="12" width="88" height="20" rx="3" fill="rgb(96, 71, 255)"></rect><text x="384" y="26" text-anchor="middle" fill="rgb(255, 255, 255)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="600">shop: A</text></g><g><rect x="436" y="12" width="112" height="20" rx="3" fill="rgb(0, 131, 143)"></rect><text x="492" y="26" text-anchor="middle" fill="rgb(255, 255, 255)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="600">price: $80</text></g></g><text x="580" y="27" fill="rgb(48, 53, 71)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="400" text-anchor="start">match</text></g></svg>
