<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
  <title id="title">Evolution of retrievers</title>
  <desc id="desc">Two lines of development. Dense: word embeddings (word2vec) add context to become sentence embeddings (SBERT), which embed per word to become contextualized inverted lists (COIL), which match all words to become late interaction (ColBERT). Sparse: bag-of-words (BM25, TF-IDF) gain model-weighted tokens as sparse encoders (DeepImpact), which either turn a single weight into a vector, reaching COIL, or generate new tokens, reaching SPLADE.</desc>
  <rect x="1" y="1" width="798" height="538" rx="12" fill="#f0f3fa" stroke="#d3d9eb" stroke-width="2"/>
  <rect x="18" y="40" width="164" height="84" rx="8" fill="#eeeaff" stroke="#6047ff" stroke-width="2"/>
  <text x="100" y="66" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Word</text>
  <text x="100" y="88" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">embeddings</text>
  <text x="100" y="110" fill="#4e5366" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">word2vec</text>
  <rect x="218" y="40" width="164" height="84" rx="8" fill="#eeeaff" stroke="#6047ff" stroke-width="2"/>
  <text x="300" y="66" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Sentence</text>
  <text x="300" y="88" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">embeddings</text>
  <text x="300" y="110" fill="#4e5366" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">SBERT</text>
  <rect x="418" y="40" width="164" height="84" rx="8" fill="#eeeaff" stroke="#6047ff" stroke-width="2"/>
  <text x="500" y="66" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Contextualized</text>
  <text x="500" y="88" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">inverted list</text>
  <text x="500" y="110" fill="#4e5366" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">COIL</text>
  <rect x="618" y="40" width="164" height="84" rx="8" fill="#eeeaff" stroke="#6047ff" stroke-width="2"/>
  <text x="700" y="66" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Late</text>
  <text x="700" y="88" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">interaction</text>
  <text x="700" y="110" fill="#4e5366" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">ColBERT</text>
  <rect x="18" y="240" width="164" height="84" rx="8" fill="#eeeaff" stroke="#6047ff" stroke-width="2"/>
  <text x="100" y="277" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Bag-of-words</text>
  <text x="100" y="299" fill="#4e5366" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">BM25 / TF-IDF</text>
  <rect x="218" y="240" width="164" height="84" rx="8" fill="#eeeaff" stroke="#6047ff" stroke-width="2"/>
  <text x="300" y="277" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Sparse encoders</text>
  <text x="300" y="299" fill="#4e5366" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">DeepImpact &amp; co</text>
  <rect x="608" y="378" width="164" height="84" rx="8" fill="#eeeaff" stroke="#6047ff" stroke-width="2"/>
  <text x="690" y="415" fill="#303547" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Sparse encoders</text>
  <text x="690" y="437" fill="#4e5366" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">SPLADE</text>
  <path d="M186 82 L204 82" fill="none" stroke="#656b7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M204 88 L214 82 L204 76" fill="none" stroke="#656b7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
