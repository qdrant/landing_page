<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 696" role="img" aria-labelledby="title desc">
<title id="title">Triplet loss in learning and in searching: training pulls a positive closer to the anchor than a negative, and the context score measures how much closer a candidate is to a negative than to a positive. Positions are illustrative.</title>
<desc id="desc">Before training, the anchor is closer to the negative (0.49) than to the positive (0.72). Training moves the points until d(anchor, positive) + margin &lt; d(anchor, negative): 0.34 + 0.4 &lt; 0.84. Positions are illustrative. At search time the same idea scores a candidate by how much closer it is to a negative than to a positive. The worse candidate is closer to the negative (0.36 vs 0.60): score -0.24. The better one is closer to the positive: score 0.00.</desc>
