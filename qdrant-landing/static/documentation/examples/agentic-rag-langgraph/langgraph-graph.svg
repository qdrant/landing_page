<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 420" width="340" height="420" role="img" aria-labelledby="t2 d2">
<title id="t2">The compiled LangGraph graph</title>
<desc id="d2">START leads to the agent node. From the agent, a conditional edge goes to the tools node when the last message has tool calls, otherwise to END. The tools node always returns to the agent.</desc>

  <style>
    .frame { fill: #f0f3fa; stroke: #d3d9eb; stroke-width: 1; }
    .frame-label { fill: #656b7f; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
    .node { fill: #ffffff; stroke: #abb1c7; stroke-width: 1.5; }
    .node--agent { stroke: #6047ff; stroke-width: 2; }
    .node--rag { stroke: #00838f; stroke-width: 2; }
    .node--web { stroke: #9c27b0; stroke-width: 2; }
    .node--db { stroke: #dc244c; stroke-width: 2; }
    .node--end { fill: #ece9ff; stroke: #6047ff; stroke-width: 2; }
    .label { fill: #303547; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; font-weight: 600; text-anchor: middle; }
    .sub { fill: #656b7f; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; text-anchor: middle; }
    .edge { fill: none; stroke: #656b7f; stroke-width: 2; }
    .edge--strong { stroke: #303547; }
    .edge--dashed { stroke-dasharray: 6 5; }
    .head { fill: #656b7f; }
    .head--strong { fill: #303547; }
    .edge-label { fill: #656b7f; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; text-anchor: middle; }
    .user { fill: #ffffff; stroke: #303547; stroke-width: 1.5; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head head--strong"/></marker>
    <symbol id="qmark" viewBox="0 0 346.42 400">
