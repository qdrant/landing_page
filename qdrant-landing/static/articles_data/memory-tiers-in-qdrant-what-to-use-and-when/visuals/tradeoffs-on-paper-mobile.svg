<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1014" width="480" height="1014" role="img" aria-labelledby="t d">
<title id="t">Trade-offs, on paper, for five memory configurations</title>
<desc id="d">Full Cached, No Quantization: fast, high footprint, opportunistic cost. Full Cached, With Quantization: fast, high, opportunistic. Full Cold, No Quantization: slow and unpredictable, low, opportunistic. Full Cold, With Quantization: moderate, moderate, opportunistic. Pinned Quantized Vectors: fast, moderate, fixed.</desc>
<style>
  text { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #303547; }
  .title { font-size: 23px; font-weight: 600; }
  .head { font-size: 21px; font-weight: 600; }
  .label { font-size: 21px; }
  .small { font-size: 20px; }
  .note { font-size: 19px; fill: #656b7f; }
  .muted { fill: #656b7f; }
  .axis { stroke: #abb1c7; stroke-width: 1.5; fill: none; }
</style>
<rect x="0.5" y="0.5" width="479" height="1013" rx="12" fill="#f0f3fa" stroke="#d3d9eb"/>
<rect x="24" y="24" width="432" height="182" rx="10" fill="#ffffff" stroke="#d3d9eb"/>
<text class="head" x="44" y="60">Full Cached, No Quantization</text>
<text class="note" x="44" y="101">speed</text>
<rect x="186.0" y="78" width="71.6" height="32" rx="16.0" fill="#b2ebf2"/><text x="221.8" y="100.7" text-anchor="middle" style="font-size:19px;fill:#006064">Fast</text>
<text class="note" x="44" y="143">footprint</text>
<rect x="186.0" y="120" width="71.6" height="32" rx="16.0" fill="#ffb2b7"/><text x="221.8" y="142.7" text-anchor="middle" style="font-size:19px;fill:#9e0d38">High</text>
<text class="note" x="44" y="185">memory cost</text>
<rect x="186.0" y="162" width="174.2" height="32" rx="16.0" fill="#ffffff" stroke="#abb1c7"/><text x="273.1" y="184.7" text-anchor="middle" style="font-size:19px;fill:#303547">Opportunistic</text>
<rect x="24" y="220" width="432" height="182" rx="10" fill="#ffffff" stroke="#d3d9eb"/>
<text class="head" x="44" y="256">Full Cached, With Quantization</text>
<text class="note" x="44" y="297">speed</text>
