<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 856" role="img" aria-labelledby="title desc">
<title id="title">From feedback scores to a new score: the context pair, its confidence, a candidate’s delta, and the feedback-based score. All numbers are illustrative.</title>
<desc id="desc">Among the top results, the feedback model scores Doc#2 highest and Doc#5 lowest. They form the context pair: Doc#2 is the positive, Doc#5 the negative. Scores are illustrative. F = a · score + confidenceb · c · delta, here with a = b = c = 1. By score alone the order is #1, #2, #3; with feedback it becomes #2, #1, #3. Numbers are illustrative.</desc>
