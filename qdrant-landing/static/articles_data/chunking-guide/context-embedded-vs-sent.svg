<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 300" role="img" aria-label="Two 1,000-token prompts. In both, search used each chunk with its added context. When the context goes into the embedding only, the prompt receives the original chunks and four of them fit. When the context is also sent, each chunk carries its context into the prompt and only three fit."><style>
  .qi-label { fill: #656b7f; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
  .qi-label--strong { fill: #303547; }
  .qi-label--small { font-size: 13px; }
  .qi-frame { fill: none; stroke: #abb1c7; stroke-width: 1.5; }
  .qi-chunk { fill: #d3d9eb; stroke: #ffffff; stroke-width: 2; }
  .qi-chunk--answer { fill: #00838f; }
  .qi-chunk--context { fill: #6047ff; }
  .qi-chunk--out { fill: none; stroke: #abb1c7; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .qi-unused { fill: url(#qi-hatch); stroke: none; }
  .qi-tick { stroke: #d3d9eb; stroke-width: 1; }
  .qi-miss { stroke: #dc244c; stroke-width: 2.5; stroke-linecap: round; }
</style>
<defs><pattern id="qi-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d3d9eb" stroke-width="2"/></pattern></defs><rect x="0" y="0" width="708" height="300" fill="#ffffff"/><text class="qi-label qi-label--strong" x="24" y="30">Context in the embedding only · the prompt gets the original chunks</text><rect class="qi-chunk" x="24.0" y="46" width="151.8" height="40" rx="3"/><rect class="qi-chunk" x="175.8" y="46" width="151.8" height="40" rx="3"/><rect class="qi-chunk" x="327.6" y="46" width="151.8" height="40" rx="3"/><rect class="qi-chunk" x="479.4" y="46" width="151.8" height="40" rx="3"/><rect class="qi-unused" x="631.2" y="47" width="52.8" height="38"/><rect class="qi-frame" x="24" y="46" width="660.0" height="40" rx="3"/><text class="qi-label qi-label--small" x="24" y="108">search used context + chunk · 4 chunks fit in 1,000 tokens</text><text class="qi-label qi-label--strong" x="24" y="150">Context also sent · each chunk carries its context into the prompt</text><rect class="qi-chunk qi-chunk--context" x="24.0" y="166" width="46.2" height="40" rx="3"/><rect class="qi-chunk" x="70.2" y="166" width="151.8" height="40" rx="3"/><rect class="qi-chunk qi-chunk--context" x="222.0" y="166" width="46.2" height="40" rx="3"/><rect class="qi-chunk" x="268.2" y="166" width="151.8" height="40" rx="3"/><rect class="qi-chunk qi-chunk--context" x="420.0" y="166" width="46.2" height="40" rx="3"/><rect class="qi-chunk" x="466.2" y="166" width="151.8" height="40" rx="3"/><rect class="qi-unused" x="618.0" y="167" width="66.0" height="38"/><rect class="qi-frame" x="24" y="166" width="660.0" height="40" rx="3"/><text class="qi-label qi-label--small" x="24" y="228">search used context + chunk · 3 chunks fit in 1,000 tokens</text><rect class="qi-chunk qi-chunk--context" x="24" y="262" width="22" height="16" rx="2"/><text class="qi-label qi-label--small" x="54" y="275">added context</text><rect class="qi-chunk" x="194" y="262" width="22" height="16" rx="2"/><text class="qi-label qi-label--small" x="224" y="275">original chunk text</text></svg>
