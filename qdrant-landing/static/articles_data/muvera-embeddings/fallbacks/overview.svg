<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" role="img" aria-labelledby="title desc">
<title id="title">MUVERA turns a list of token vectors of any length, for a document or a query, into one fixed-length vector. Numbers are illustrative.</title>
<desc id="desc">A document of 5 token vectors and a query of 3 both become a single vector of the same dimension. Their dot product approximates the multi-vector similarity, so ordinary single-vector search can fetch candidates for reranking.</desc>
