<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Flowchart: the clinician's query is matched by words and by meaning, filtered by the label rules, then ordered so the dosing table comes first" font-family="'Mona Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14"><rect width="760" height="300" rx="12" fill="#161b26"></rect><defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#adb2b9" d="M0 0L10 5L0 10z"></path></marker></defs><rect fill="#1f2835" stroke="#4a5563" x="16" y="112" width="160" height="76" rx="8"></rect><text fill="#f3f3f5" x="30" y="138">Query</text><text fill="#adb2b9" font-size="13" x="30" y="158">"paracetamol dose,</text><text fill="#adb2b9" font-size="13" x="30" y="175">4-year-old"</text><rect fill="#1f2835" stroke="#4a5563" x="214" y="40" width="160" height="76" rx="8"></rect><text fill="#f3f3f5" x="228" y="66">Match the words</text><text fill="#adb2b9" font-size="13" x="228" y="86">Celebrex vs. Celexa</text><rect fill="#1f2835" stroke="#4a5563" x="214" y="184" width="160" height="76" rx="8"></rect><text fill="#f3f3f5" x="228" y="210">Match the meaning</text><text fill="#adb2b9" font-size="13" x="228" y="230">finds "acetaminophen"</text><rect fill="#1f2835" stroke="#4a5563" x="412" y="112" width="160" height="76" rx="8"></rect><text fill="#f3f3f5" x="426" y="138">Follow the rules</text><text fill="#adb2b9" font-size="13" x="426" y="158">current label,</text><text fill="#adb2b9" font-size="13" x="426" y="175">pediatric section</text><rect fill="#1f2835" stroke="#4a5563" x="600" y="112" width="148" height="76" rx="8"></rect><text fill="#f3f3f5" x="614" y="138">Put the best first</text><text fill="#adb2b9" font-size="13" x="614" y="158">dosing table,</text><text fill="#adb2b9" font-size="13" x="614" y="175">ages 2 to 11</text><path stroke="#adb2b9" fill="none" d="M176 150H195V78H214" marker-end="url(#ah2)"></path><path stroke="#adb2b9" fill="none" d="M195 150V222H214" marker-end="url(#ah2)"></path><path stroke="#adb2b9" fill="none" d="M374 78H393V150H412" marker-end="url(#ah2)"></path><path stroke="#adb2b9" fill="none" d="M374 222H393V150"></path><path stroke="#adb2b9" fill="none" d="M572 150H600" marker-end="url(#ah2)"></path><path stroke="#adb2b9" fill="none" d="M674 188V232" marker-end="url(#ah2)"></path><rect fill="rgba(246,113,134,0.08)" stroke="#f67186" x="600" y="232" width="148" height="44" rx="8"></rect><text fill="#f3f3f5" x="674" y="259" text-anchor="middle">Dosing table on top</text></svg>