{{ with (.Site.GetPage "/resilience/hero") }}
  <section class="resilience-hero">
    <div class="container">
      <div class="row">
        <div class="col-12 col-lg-7">
          <p class="resilience-hero__label">{{ .Params.label }}</p>
          <h1 class="resilience-hero__title">{{ .Params.title }}</h1>
          <p class="resilience-hero__description">{{ .Params.description }}</p>
          <div class="resilience-hero__buttons">
            <a href="{{ .Params.containedButton.url }}" class="button button_contained button_lg" target="_blank">
              {{ .Params.containedButton.text }}
            </a>
            <a href="{{ .Params.outlinedButton.url }}" class="button button_outlined button_lg">
              {{ .Params.outlinedButton.text }}
            </a>
          </div>
          <p class="resilience-hero__addition">{{ .Params.addition | safeHTML }}</p>
        </div>
  
        <div class="resilience-hero__preview col-12 col-lg-5">
          <img class="resilience-hero__preview-img" src="{{ .Params.image.src }}" alt="{{ .Params.image.alt }}" />
          <img 
            class="resilience-hero__preview-img-mobile" 
            src="{{ .Params.image.mobileSrc }}" 
            alt="{{ .Params.image.alt }}" 
          />
        </div>
      </div>
    </div>
  </section>
{{ end }}
