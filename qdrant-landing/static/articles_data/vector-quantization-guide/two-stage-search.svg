<text class="qrs-h" x="0" y="88">Rescoring off: the top 10 by rough score are returned</text><rect class="qrs-cell" x="0.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="16.5" y="117" text-anchor="middle">1</text><rect class="qrs-cell" x="38.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="54.5" y="117" text-anchor="middle">2</text><rect class="qrs-cell" x="76.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="92.5" y="117" text-anchor="middle">3</text><rect class="qrs-cell" x="114.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="130.5" y="117" text-anchor="middle">4</text><rect class="qrs-cell" x="152.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="168.5" y="117" text-anchor="middle">5</text><rect class="qrs-cell" x="190.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="206.5" y="117" text-anchor="middle">6</text><rect class="qrs-cell" x="228.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="244.5" y="117" text-anchor="middle">7</text><rect class="qrs-cell" x="266.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="282.5" y="117" text-anchor="middle">8</text><rect class="qrs-cell" x="304.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="320.5" y="117" text-anchor="middle">9</text><rect class="qrs-cell" x="342.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="358.5" y="117" text-anchor="middle">10</text><text class="qrs-note" x="0" y="152">the true neighbor at rank 14 is lost</text>
<g transform="translate(0,110)"><text class="qrs-h" x="0" y="88">Step 2: rescoring re-sorts them by exact score and returns the top 10</text><rect class="qrs-cell" x="0.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="16.5" y="117" text-anchor="middle">2</text><rect class="qrs-cell" x="38.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="54.5" y="117" text-anchor="middle">1</text><rect class="qrs-cell" x="76.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="92.5" y="117" text-anchor="middle">3</text><rect class="qrs-cell is-hit" x="114.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n is-hit" x="130.5" y="117" text-anchor="middle">14</text><rect class="qrs-cell" x="152.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="168.5" y="117" text-anchor="middle">4</text><rect class="qrs-cell" x="190.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="206.5" y="117" text-anchor="middle">6</text><rect class="qrs-cell" x="228.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="244.5" y="117" text-anchor="middle">5</text><rect class="qrs-cell" x="266.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="282.5" y="117" text-anchor="middle">7</text><rect class="qrs-cell" x="304.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="320.5" y="117" text-anchor="middle">9</text><rect class="qrs-cell" x="342.0" y="100" width="33" height="26" rx="4"/><text class="qrs-n" x="358.5" y="117" text-anchor="middle">8</text><text class="qrs-keep" x="0" y="152">the true neighbor at rank 14 is recovered</text></g>
</svg>
