<rect x="812.0" y="282" width="110.0" height="34" rx="17.0" fill="#b2ebf2"/><text x="867.0" y="306.0" text-anchor="middle" style="font-size:20px;fill:#303547">fastest</text>
<rect x="20" y="356" width="290" height="48" rx="8" fill="#ffffff" stroke="#d3d9eb"/>
<text class="label muted" x="165" y="387" text-anchor="middle">Disk</text>
