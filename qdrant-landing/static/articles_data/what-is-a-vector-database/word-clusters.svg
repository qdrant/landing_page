<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" role="img" aria-labelledby="description">
  <desc id="description">Words with similar meanings sit close together in vector space, in three clusters: positive words such as pretty and elegant, negative words such as ugly and disgusting, and neutral words such as impartial and independent. The query word gorgeous lands next to the positive cluster, and its nearest neighbors are attractive, lovely, and beautiful.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#656b7f"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc244c"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="639" height="275" rx="6" fill="#f0f3fa" stroke="#d3d9eb" stroke-width="1"/>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="16" y="16" width="234" height="108" rx="6" fill="none" stroke="#00838f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="32" y="46" font-size="14" fill="#303547">pretty</text>
    <text x="96" y="46" font-size="14" fill="#303547">attractive</text>
