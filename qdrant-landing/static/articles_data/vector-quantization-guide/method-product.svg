<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -16 800 322" width="800" height="322" role="img" aria-labelledby="t d">
  <title id="t">Product quantization of one vector</title>
  <desc id="d">A 16-coordinate float32 vector of 512 bits is cut into eight sub-vectors of two coordinates. Each sub-vector is replaced by the id of its nearest centroid in a 256-centroid codebook, one byte each, so the vector takes 64 bits, 8 times smaller.</desc>
  <style>
    
    .qprod { display: block; text-align: left; }
    .qprod .qi-fig { gap: 16px; }
    .qprod .qprod-h { fill: #656b7f; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 14px; }
    .qprod .qprod-num { fill: #303547; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .qprod .qprod-cell { fill: #f0f3fa; stroke: #d3d9eb; stroke-width: 1; }
    .qprod .qprod-byte { fill: #6047ff; fill-opacity: 0.16; stroke: #6047ff; stroke-width: 1.5; }
    .qprod .qprod-brace { fill: none; stroke: #abb1c7; stroke-width: 1.5; }
    .qprod .qprod-bar { fill: #6047ff; }
    .qprod .qprod-bar.is-full { fill: #abb1c7; }
    
    .qi-axis { stroke: #abb1c7; stroke-width: 1.5; }
  </style>
  <rect x="-20" y="-16" width="800" height="322" fill="#FFFFFF" rx="12"/>
  <g class="qprod"><text class="qprod-h" x="0" y="14">illustrative float32 vector, 16 coordinates, 512 bits</text><rect class="qprod-cell" x="36" y="24" width="38" height="28" rx="4"/><rect class="qprod-cell" x="78" y="24" width="38" height="28" rx="4"/><rect class="qprod-cell" x="120" y="24" width="38" height="28" rx="4"/><rect class="qprod-cell" x="162" y="24" width="38" height="28" rx="4"/><rect class="qprod-cell" x="204" y="24" width="38" height="28" rx="4"/><rect class="qprod-cell" x="246" y="24" width="38" height="28" rx="4"/><rect class="qprod-cell" x="288" y="24" width="38" height="28" rx="4"/><rect class="qprod-cell" x="330" y="24" width="38" height="28" rx="4"/><rect class="qprod-cell" x="372" y="24" width="38" height="28" rx="4"/><rect class="qprod-cell" x="414" y="24" width="38" height="28" rx="4"/><rect class="qprod-cell" x="456" y="24" width="38" height="28" rx="4"/><rect class="qprod-cell" x="498" y="24" width="38" height="28" rx="4"/><rect class="qprod-cell" x="540" y="24" width="38" height="28" rx="4"/><rect class="qprod-cell" x="582" y="24" width="38" height="28" rx="4"/><rect class="qprod-cell" x="624" y="24" width="38" height="28" rx="4"/><rect class="qprod-cell" x="666" y="24" width="38" height="28" rx="4"/><text class="qprod-h" x="0" y="96">Each sub-vector becomes the id of its nearest centroid (example ids)</text><path class="qprod-brace" d="M36 60 v6 h80 v-6"/><rect class="qprod-byte" x="36" y="106" width="80" height="30" rx="4"/><text class="qprod-num" x="76" y="126" text-anchor="middle">#103</text><path class="qprod-brace" d="M120 60 v6 h80 v-6"/><rect class="qprod-byte" x="120" y="106" width="80" height="30" rx="4"/><text class="qprod-num" x="160" y="126" text-anchor="middle">#200</text><path class="qprod-brace" d="M204 60 v6 h80 v-6"/><rect class="qprod-byte" x="204" y="106" width="80" height="30" rx="4"/><text class="qprod-num" x="244" y="126" text-anchor="middle">#41</text><path class="qprod-brace" d="M288 60 v6 h80 v-6"/><rect class="qprod-byte" x="288" y="106" width="80" height="30" rx="4"/><text class="qprod-num" x="328" y="126" text-anchor="middle">#138</text><path class="qprod-brace" d="M372 60 v6 h80 v-6"/><rect class="qprod-byte" x="372" y="106" width="80" height="30" rx="4"/><text class="qprod-num" x="412" y="126" text-anchor="middle">#235</text><path class="qprod-brace" d="M456 60 v6 h80 v-6"/><rect class="qprod-byte" x="456" y="106" width="80" height="30" rx="4"/><text class="qprod-num" x="496" y="126" text-anchor="middle">#76</text><path class="qprod-brace" d="M540 60 v6 h80 v-6"/><rect class="qprod-byte" x="540" y="106" width="80" height="30" rx="4"/><text class="qprod-num" x="580" y="126" text-anchor="middle">#173</text><path class="qprod-brace" d="M624 60 v6 h80 v-6"/><rect class="qprod-byte" x="624" y="106" width="80" height="30" rx="4"/><text class="qprod-num" x="664" y="126" text-anchor="middle">#14</text><text class="qprod-h" x="0" y="170">Codebook: 256 centroids per sub-vector, one byte each</text><text class="qprod-h" x="0" y="214">float32</text><rect class="qprod-bar is-full" x="86" y="200" width="560" height="18" rx="3"/><text class="qprod-h" x="656" y="214">512 bit</text><text class="qprod-h" x="0" y="262">PQ x8</text><rect class="qprod-bar" x="86" y="248" width="70" height="18" rx="3"/><text class="qprod-h" x="166" y="262">64 bit, 8× smaller</text></g>
</svg>
