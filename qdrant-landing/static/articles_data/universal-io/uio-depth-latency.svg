<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Mona Sans',Arial,sans-serif" role="img" aria-label="Bandwidth against latency for three read backends on log scales, random reads. Up and left is better. The frontier is made entirely of io_uring points, which climb from 7.15 MB/s at batch 1 to 85.66 at batch 16 while the wait stays near 0.6 ms. mmap runs flat at about 7.2 MB/s whatever the batch, moving only to the right. S3 sits near 24 ms, climbing from 0.17 MB/s with one reader to 11.3 with 128."><style>
