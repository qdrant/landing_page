<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="description">
  <desc id="description">The vector search workflow. Source data such as documents, images, video, and audio goes through an embedding model into dense embeddings, which are generated and sent to Qdrant, a vector database and search engine that stores and indexes them and queries and retrieves them, returning results to an application such as search or a recommender. At query time, the query vector for "red shoes" is placed in the vector space, its nearest neighbors are found with a distance metric such as cosine or Euclidean, and the top-k results are returned.</desc>
