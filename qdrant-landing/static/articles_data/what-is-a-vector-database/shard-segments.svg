    <text x="382" y="154" font-size="12" text-anchor="middle" fill="#656b7f">4</text>
    <rect x="428" y="100" width="76" height="76" rx="6" fill="none" stroke="#6047ff" stroke-width="1.5"/>
    <text x="466" y="134" font-size="13" text-anchor="middle" fill="#303547">segment</text>
    <text x="466" y="154" font-size="12" text-anchor="middle" fill="#656b7f">5</text>
