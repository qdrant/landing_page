<text x="14" y="282" font-weight="700">Jev Iterative <tspan font-weight="400" fill="#656b7f">· 10 requests</tspan></text><text x="14" y="303" fill="#656b7f">"Which doc is most relevant?" per position</text><rect x="14" y="312" width="134" height="38" rx="8" fill="none" stroke="#abb1c7" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="20" y="318" width="26" height="26" rx="5" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="33.0" y="336" text-anchor="middle" font-weight="700">A</text><rect x="52" y="318" width="26" height="26" rx="5" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="65.0" y="336" text-anchor="middle" font-weight="700">B</text><rect x="84" y="318" width="26" height="26" rx="5" fill="#00838f" stroke="#00838f" stroke-width="1.5"/><text x="97.0" y="336" text-anchor="middle" font-weight="700" fill="#ffffff">C</text><rect x="116" y="318" width="26" height="26" rx="5" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="129.0" y="336" text-anchor="middle" font-weight="700">D</text><path d="M152 331.0h24m-6-5 6 5-6 5" fill="none" stroke="#656b7f" stroke-width="2"/><rect x="182" y="312" width="102" height="38" rx="8" fill="none" stroke="#abb1c7" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="188" y="318" width="26" height="26" rx="5" fill="#00838f" stroke="#00838f" stroke-width="1.5"/><text x="201.0" y="336" text-anchor="middle" font-weight="700" fill="#ffffff">A</text><rect x="220" y="318" width="26" height="26" rx="5" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="233.0" y="336" text-anchor="middle" font-weight="700">B</text><rect x="252" y="318" width="26" height="26" rx="5" fill="#ffffff" stroke="#abb1c7" stroke-width="1.5"/><text x="265.0" y="336" text-anchor="middle" font-weight="700">D</text><path d="M288 331.0h24m-6-5 6 5-6 5" fill="none" stroke="#656b7f" stroke-width="2"/><rect x="318" y="312" width="70" height="38" rx="8" fill="none" stroke="#abb1c7" stroke-width="1.5" stroke-dasharray="4 3"/><rec