<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 630" role="img" aria-labelledby="desc"><desc id="desc">Fixed-interval result messages are replaced by shared data and main-thread requests when ready to render.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#576280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f0f3fa"/><rect x="35" y="35" width="250" height="90" rx="14" fill="white" stroke="#b4bacc" stroke-width="2"/><text x="160.0" y="88.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">Worker thread</text><rect x="355" y="35" width="250" height="90" rx="14" fill="white" stroke="#b4bacc" stroke-width="2"/><text x="480.0" y="88.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">Main thread</text><path d="M285 80 L350 80" fill="none" stroke="#576280" stroke-width="2.5" marker-end="url(#arrow)"/><text x="320" y="165" text-anchor="middle" font-family="Geist Mono, monospace" font-size="22" fill="#0b0f19">Results at fixed intervals</text><path d="M35 215 H605" stroke="#b4bacc" stroke-width="2" stroke-dasharray="6 6"/><rect x="35" y="265" width="250" height="90" rx="14" fill="white" stroke="#b4bacc" stroke-width="2"/><text x="160.0" y="318.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">Worker thread</text><rect x="355" y="265" width="250" height="90" rx="14" fill="white" stroke="#b4bacc" stroke-width="2"/><text x="480.0" y="318.0" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" fill="#0b0f19">Main thread</text><path d="M355 335 L290 335" fill="none" stroke="#576280" stroke-width="2.5" marker-end="url(#arrow)"/><text x="320" y="400" text-anchor="middle" font-family="Geist Mono, monospace" font-size="22" fill="#0b0f19">Request when ready</text><rect x="150" y="465" width="340" height="100" rx="1