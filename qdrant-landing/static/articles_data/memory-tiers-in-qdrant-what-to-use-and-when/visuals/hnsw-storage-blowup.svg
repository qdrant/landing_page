<text class="head" x="146" y="128">Standard graph</text>
<text class="small muted" x="146" y="156">An edge stores only a</text>
<text class="small muted" x="146" y="180">link to its neighbor.</text>
<text class="head" x="146" y="288">Inline storage</text>
<text class="small muted" x="146" y="316">Every edge also</text>
<text class="small muted" x="146" y="340">carries its own</text>
<text class="small muted" x="146" y="364">compressed copy of the</text>
<text class="small muted" x="146" y="388">neighbor's vector.</text>
<text class="head" x="444" y="56">On-disk graph size as a</text>
<text class="head" x="444" y="82">collection grows</text>
<text class="note" x="444" y="108">conceptual, not to scale</text>
<path d="M484.0 410.0 C 636.6 404.8, 710.7 350.2, 920.0 160.4 L920.0 272.2 Q 710.7 337.2, 484.0 410.0 Z" fill="#e1bee7" opacity="0.6"/>
