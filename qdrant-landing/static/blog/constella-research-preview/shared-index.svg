<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 150 1200 580" role="img" aria-labelledby="title desc"><title id="title">Index once. Choose your query model.</title><desc id="desc">Documents pass through Stella into one Qdrant index. Zero, Nano, and full Stella query that same index.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#576280" /></marker></defs><rect width="1200" height="580" rx="10" fill="#F0F3FA" y="150" /><g font-family="'SFMono-Regular', 'Menlo', 'Consolas', monospace" fill="#28324D"><text x="60" y="184" font-size="18" fill="#576280" font-weight="600">AT INDEX TIME</text><rect x="60" y="212" width="255" height="104" rx="10" fill="white" stroke="#B4BACC" stroke-width="2.6" /><text x="84" y="252" font-size="22" font-weight="600">Your Documents</text><text x="84" y="283" font-size="18" fill="#576280" font-weight="600">Encode before search</text><rect x="397" y="212" width="285" height="104" rx="10" fill="white" stroke="#B4BACC" stroke-width="2.6" /><text x="421" y="252" font-size="22" font-weight="600">Stella</text><text x="421" y="283" font-size="18" fill="#576280" font-weight="600">400M document encoder</text><rect x="803" y="310" width="337" height="153" rx="10" fill="#FFFFFF" stroke="#DC244C" stroke-width="2.6" /><text x="827" y="350" font-size="22" font-weight="600">One Qdrant Index</text><text x="827" y="381" font-size="18" fill="#576280" font-weight="600">1024-d Stella vectors</text><text x="827" y="428" font-size="18" fill="#DC244C" font-weight="600">Reuse for every query model</text><path d="M315 264 H383" fill="none" stroke="#576280" stroke-width="4" marker-end="url(#arrow)" /><path d="M682 264 H748 V345 H789" fill="none" stroke="#576280" stroke-width="4" marker-end="url(#arrow)" /><text x="60" y="380" font-size="18" fill="#576280" font-weight="600">AT QUERY TIME / CHOOSE ONE</text><rect x="60" y="409" width="255" height="88" rx="10" fill="white" stroke="#B4BACC" stroke-width="2.6" /><text x="84" y="449" font-size="22" font-weight="600">Zero</text><text x="84" y="480" font-size="18" fill="#576280" font-weight="600">Token lookup</text><rect x="60" y="515" width="255" height="88" rx="10" fill="white" stroke="#B4BACC" stroke-width="2.6" /><text x="84" y="555" font-size="22" font-weight="600">Nano</text><text x="84" y="586" font-size="18" fill="#576280" font-weight="600">34.5M transformer</text><rect x="60" y="621" width="255" height="88" rx="10" fill="white" stroke="#B4BACC" stroke-width="2.6" /><text x="84" y="661" font-size="22" font-weight="600">Full Stella</text><text x="84" y="692" font-size="18" fill="#576280" font-weight="600">400M transformer</text><path d="M315 453 H580" fill="none" stroke="#576280" stroke-width="4" /><path d="M315 559 H580" fill="none" stroke="#576280" stroke-width="4" /><path d="M315 665 H580" fill="none" stroke="#576280" stroke-width="4" /><path d="M580 453 V665" fill="none" stroke="#576280" stroke-width="4" /><path d="M580 559 H748 V402 H789" fill="none" stroke="#576280" stroke-width="4" marker-end="url(#arrow)" /><text x="621" y="604" font-size="21" font-weight="600">Same stored vectors</text><text x="621" y="634" font-size="18" fill="#576280" font-weight="600">Switch without re-embedding</text></g></svg>