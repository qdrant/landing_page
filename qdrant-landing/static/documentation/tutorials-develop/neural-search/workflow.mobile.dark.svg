<svg xmlns="http://www.w3.org/2000/svg" width="320" height="280" viewBox="0 0 320 280" role="img" aria-labelledby="title desc">
  <title id="title">Semantic search workflow</title>
  <desc id="desc">Load startup records, upload text to Qdrant Cloud, embed and store it there, search for five matches with an optional city filter, and serve the search through FastAPI.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #e2e7f5; text-anchor: middle; }
    .step { font-size: 12.5px; font-weight: 700; }
    .name { font-size: 12px; font-weight: 700; }
    .detail { font-size: 12px; }
    .flow { fill: none; stroke: #a0a7be; stroke-width: 1.6; stroke-dasharray: 3 3; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { fill: #a0a7be; }
    .node { fill: #303547; stroke: #a0a7be; stroke-width: 1.6; }
    .upload { fill: #303158; stroke: #9494ff; }
    .cloud { fill: #103e46; stroke: #4dd0e1; }
  </style>
  <rect width="320" height="280" fill="#111824"/>
  <g class="flow">
    <path d="M56 149H58"/><path d="M118 149H120"/><path d="M194 149H196"/><path d="M260 149H262"/>
    <path d="M29 95V80Q29 68 41 68H78Q90 68 90 80V95"/>
    <path d="M90 203V221Q90 233 102 233H148Q160 233 160 221V203"/>
    <path d="M160 95V80Q160 68 172 68H220Q232 68 232 80V95"/>
    <path d="M232 203V221Q232 233 244 233H282Q294 233 294 221V203"/>
  </g>
  <g class="arrow">
    <path d="M58 146 63 149 58 152Z"/><path d="M120 146 125 149 120 152Z"/>
    <path d="M196 146 201 149 196 152Z"/><path d="M262 146 267 149 262 152Z"/>
    <path d="M86 95 90 101 94 95Z"/><path d="M156 203 160 197 164 203Z"/>
    <path d="M228 95 232 101 236 95Z"/><path d="M290 203 294 197 298 203Z"/>
  </g>
  <text class="step" x="60" y="41">1. Load</text>
  <text class="step" x="125" y="268">2. Upload</text>
  <text class="step" x="196" y="41">3. Search</text>
  <text class="step" x="263" y="268">4. Serve</text>
  <g>
    <rect class="node" x="4" y="102" width="52" height="94" rx="3"/>
    <rect class="node upload" x="64" y="102" width="54" height="94" rx="3"/>
    <rect class="node cloud" x="126" y="102" width="68" height="94" rx="3"/>
    <rect class="node" x="202" y="102" width="58" height="94" rx="3"/>
    <rect class="node" x="268" y="102" width="50" height="94" rx="3"/>
  </g>
  <text class="name" x="30" y="139">Dataset</text>
  <text class="detail" x="30" y="164">40,474</text>
  <text class="name" x="91" y="130">Text</text>
  <text class="name" x="91" y="146">Upload</text>
  <text class="detail" x="91" y="174">One call</text>
  <text class="name" x="160" y="119">Qdrant</text>
  <text class="name" x="160" y="135">Cloud</text>
  <text class="detail" x="160" y="160">Inference</text>
  <text class="detail" x="160" y="179">+ storage</text>
  <text class="name" x="231" y="120">Search</text>
  <text class="name" x="231" y="136">API</text>
  <text class="detail" x="231" y="161">5 results</text>
  <text class="detail" x="231" y="180">city filter</text>
  <text class="name" x="293" y="120" textLength="44" lengthAdjust="spacingAndGlyphs">FastAPI</text>
  <text class="detail" x="293" y="145">GET</text>
  <text class="detail" x="293" y="162">/api</text>
  <text class="detail" x="293" y="179">/search</text>
</svg>
