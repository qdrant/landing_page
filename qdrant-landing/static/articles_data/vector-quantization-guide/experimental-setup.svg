<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -16 800 244" width="800" height="244" role="img" aria-labelledby="t d">
  <title id="t">The four BEIR datasets used in the experiment</title>
  <desc id="d">SciFact, scientific claim verification: 5,183 documents of 214 words, 1.1 relevant per query, 21 MB of float32 vectors at 1,024 dimensions. NFCorpus, medical information retrieval: 3,633 documents of 232 words, 38.2 relevant per query, 15 MB. FiQA, financial question answering: 57,638 documents of 132 words, 2.6 relevant per query, 236 MB. Quora, duplicate question retrieval: 522,931 documents of 11 words, 1.6 relevant per query, 2,142 MB.</desc>
  <style>
    
    .qset { display: block; text-align: left; }
    .qset .qi-fig { gap: 16px; }
    .qset .qset-h, .qset .qset-sub { fill: #656b7f; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 14px; }
    .qset .qset-name { fill: #303547; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 600; }
    .qset .qset-task, .qset .qset-num { fill: #303547; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 14px; font-variant-numeric: tabular-nums; }
    .qset .qset-bar { fill: #6047ff; }
    .qset .qset-sep { stroke: #d3d9eb; stroke-width: 1; }
    
    .qi-axis { stroke: #abb1c7; stroke-width: 1.5; }
  </style>
  <rect x="-20" y="-16" width="800" height="244" fill="#FFFFFF" rx="12"/>
  <g class="qset"><text class="qset-h" x="0" y="18">Dataset</text><text class="qset-h" x="96" y="18">Task</text><text class="qset-h" x="426" y="18" text-anchor="end">documents</text><text class="qset-h" x="516" y="18" text-anchor="end">words/doc</text><text class="qset-h" x="600" y="18" text-anchor="end">rel/query</text><text class="qset-h" x="618" y="18">float32, 1,024-d</text><line class="qi-axis" x1="0" y1="28" x2="760" y2="28"/><text class="qset-name" x="0" y="58">SciFact</text><text class="qset-task" x="96" y="58">Scientific claim verification</text><text class="qset-num" x="426" y="58" text-anchor="end">5,183</text><text class="qset-num" x="516" y="58" text-anchor="end">214</text><text class="qset-num" x="600" y="58" text-anchor="end">1.1</text><rect class="qset-bar" x="618" y="46" width="2.0" height="14" rx="2"/><text class="qset-num" x="628.0" y="58">21 MB</text><line class="qset-sep" x1="0" y1="74" x2="760" y2="74"/><text class="qset-name" x="0" y="98">NFCorpus</text><text class="qset-task" x="96" y="98">Medical information retrieval</text><text class="qset-num" x="426" y="98" text-anchor="end">3,633</text><text class="qset-num" x="516" y="98" text-anchor="end">232</text><text class="qset-num" x="600" y="98" text-anchor="end">38.2</text><rect class="qset-bar" x="618" y="86" width="2.0" height="14" rx="2"/><text class="qset-num" x="628.0" y="98">15 MB</text><line class="qset-sep" x1="0" y1="114" x2="760" y2="114"/><text class="qset-name" x="0" y="138">FiQA</text><text class="qset-task" x="96" y="138">Financial question answering</text><text class="qset-num" x="426" y="138" text-anchor="end">57,638</text><text class="qset-num" x="516" y="138" text-anchor="end">132</text><text class="qset-num" x="600" y="138" text-anchor="end">2.6</text><rect class="qset-bar" x="618" y="126" width="7.3" height="14" rx="2"/><text class="qset-num" x="633.3" y="138">236 MB</text><line class="qset-sep" x1="0" y1="154" x2="760" y2="154"/><text class="qset-name" x="0" y="178">Quora</text><text class="qset-task" x="96" y="178">Duplicate question retrieval</text><text class="qset-num" x="426" y="178" text-anchor="end">522,931</text><text class="qset-num" x="516" y="178" text-anchor="end">11</text><text class="qset-num" x="600" y="178" text-anchor="end">1.6</text><rect class="qset-bar" x="618" y="166" width="66.0" height="14" rx="2"/><text class="qset-num" x="692.0" y="178">2,142 MB</text></g>
</svg>
