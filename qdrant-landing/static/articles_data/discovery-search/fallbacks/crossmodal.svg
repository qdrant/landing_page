<title id="title">Cross-modal search with discovery: a text target ranks images, and an image context pair keeps the results on the wanted side. Points are hand-placed and illustrative.</title>
<desc id="desc">The context pair (two images) draws a hyperplane in the images plane, so only the 6 images on the positive side are eligible. The text target then ranks them: all 4 top results are on the positive side. Points are illustrative.</desc>
