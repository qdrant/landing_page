<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 910" role="img" aria-labelledby="title desc">
<title id="title">An overview of ReFit, a gradient-based method for query refinement, step by step. Scores are illustrative; the distributions and divergences are computed from them.</title>
<desc id="desc">Both sets of scores become probability distributions, and the Kullback–Leibler divergence measures how far the retriever's is from the cross-encoder's: 0.71. Gradient descent changes the query vector to shrink that divergence. After the update, a new vector search matches the cross-encoder much more closely: KL 0.71 → 0.03. The updated scores are illustrative.</desc>
