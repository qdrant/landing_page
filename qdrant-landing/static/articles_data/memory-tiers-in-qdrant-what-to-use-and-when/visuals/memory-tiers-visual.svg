<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" width="960" height="424" role="img" aria-labelledby="t d">
<title id="t">Qdrant's three memory tiers</title>
<desc id="d">Any structure picks one of three tiers independently. Cold lives on disk: low RAM, slowest. Cached lives in the OS page cache in RAM: high RAM, evictable. Pinned lives on the heap in RAM: fixed RAM, fastest.</desc>
<style>
  text { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #303547; }
  .title { font-size: 23px; font-weight: 600; }
  .head { font-size: 21px; font-weight: 600; }
  .label { font-size: 21px; }
  .small { font-size: 20px; }
  .note { font-size: 19px; fill: #656b7f; }
  .muted { fill: #656b7f; }
  .axis { stroke: #abb1c7; stroke-width: 1.5; fill: none; }
</style>
<rect x="0.5" y="0.5" width="959" height="423" rx="12" fill="#f0f3fa" stroke="#d3d9eb"/>
<defs><marker id="mt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#abb1c7"/></marker></defs>
<rect x="200" y="24" width="560" height="50" rx="8" fill="#ffffff" stroke="#abb1c7" stroke-dasharray="5 4"/>
<text class="label" x="480" y="56" text-anchor="middle">Any structure picks a tier, independently</text>
<path d="M480 74 V96 H165 V116" class="axis" stroke-width="2" marker-end="url(#mt-arrow)"/>
<path d="M480 74 V96 H795 V116" class="axis" stroke-width="2" marker-end="url(#mt-arrow)"/>
<path d="M480 74 V116" class="axis" stroke-width="2" marker-end="url(#mt-arrow)"/>
<rect x="20" y="120" width="290" height="216" rx="10" fill="#ffffff" stroke="#d3d9eb"/>
<text class="label" x="165.0" y="160" text-anchor="middle" style="font-size:26px;font-weight:600;fill:#6047ff">Cold</text>
<rect x="40" y="178" width="250" height="88" rx="8" fill="#f0f3fa" stroke="#6047ff" stroke-width="1.5"/>
<text class="label" x="165.0" y="204" text-anchor="middle">Disk</text>
<circle cx="107.0" cy="238" r="7" fill="#6047ff"/>
<circle cx="135.0" cy="230" r="7" fill="#6047ff"/>
<circle cx="151.0" cy="248" r="7" fill="#6047ff"/>
<circle cx="183.0" cy="252" r="7" fill="#6047ff"/>
<circle cx="213.0" cy="240" r="7" fill="#6047ff"/>
<rect x="50.0" y="282" width="110.0" height="34" rx="17.0" fill="#c2c5ff"/><text x="105.0" y="306.0" text-anchor="middle" style="font-size:20px;fill:#303547">low RAM</text>
<rect x="170.0" y="282" width="110.0" height="34" rx="17.0" fill="#c2c5ff"/><text x="225.0" y="306.0" text-anchor="middle" style="font-size:20px;fill:#303547">slowest</text>
<rect x="335" y="120" width="290" height="216" rx="10" fill="#ffffff" stroke="#d3d9eb"/>
<text class="label" x="480.0" y="160" text-anchor="middle" style="font-size:26px;font-weight:600;fill:#9c27b0">Cached</text>
<rect x="355" y="178" width="250" height="88" rx="8" fill="#f0f3fa" stroke="#9c27b0" stroke-width="1.5"/>
<text class="label" x="480.0" y="204" text-anchor="middle">OS page cache</text>
<circle cx="422.0" cy="238" r="7" fill="#9c27b0"/>
