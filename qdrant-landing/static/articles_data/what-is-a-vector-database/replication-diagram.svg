<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="description">
  <desc id="description">A Replica Set manages copies of the same shard, distributed across nodes in the cluster. On one node, the replica set holds a Local Shard, with a write-ahead log, segments, and an optimizer, and a Remote Shard, which uses a connection pool to send gRPC requests to the Local Shard on another node. Each Segment has an ID mapping, vector storage and vector index, and payload storage and payload index.</desc>
