<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 974" role="img" aria-labelledby="title desc">
<title id="title">The same ranked results labeled by three kinds of feedback: pseudo-relevance, binary feedback, and re-scored feedback. Scores are illustrative.</title>
<desc id="desc">Pseudo-relevance feedback takes the top results of the first retrieval and treats them as relevant. No one has to look at the documents. Binary feedback: a user or a classifier marks some of the results as relevant or not relevant, and leaves the rest unlabeled. Re-scored feedback: a feedback model scores every result, so each one gets a graded relevance instead of a yes or no. Scores shown are illustrative.</desc>
