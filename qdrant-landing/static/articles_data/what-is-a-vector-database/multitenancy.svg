<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="description">
  <desc id="description">The tenant_data collection has two isolation layers. In the partition-based layer, each point's payload carries a group_id: points 1 and 2 belong to tenant 1 and point 3 to tenant 2. In the resource-based layer, each point is upserted with a shard_key_selector: points 1 and 2 go to shard 1, canada, and point 3 to shard 2, germany.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#656b7f"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="399" rx="6" fill="#f0f3fa" stroke="#d3d9eb" stroke-width="1"/>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="150" y="43" font-size="13" text-anchor="end" fill="#6047ff" font-weight="600">Qdrant collection</text>
    <text x="150" y="121" font-size="13" text-anchor="end" fill="#6047ff" font-weight="600">Partition-based</text>
    <text x="150" y="139" font-size="13" text-anchor="end" fill="#6047ff" font-weight="600">isolation layer</text>
    <text x="130" y="268" font-size="13" text-anchor="end" fill="#6047ff" font-weight="600">Your data</text>
    <text x="150" y="360" font-size="13" text-anchor="end" fill="#6047ff" font-weight="600">Resource-based</text>
    <text x="150" y="378" font-size="13" text-anchor="end" fill="#6047ff" font-weight="600">isolation layer</text>
    <path d="M154 38 H170" fill="none" stroke="#656b7f" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <path d="M154 126 H170" fill="none" stroke="#656b7f" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <path d="M154 365 H170" fill="none" stroke="#656b7f" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <path d="M136 263 H156 V237 H170" fill="none" stroke="#656b7f" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <path d="M156 263 V312 H170" fill="none" stroke="#656b7f" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <rect x="176" y="12" width="528" height="52" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="440" y="43" font-size="15" text-anchor="middle" fill="#303547">collection_name = “tenant_data”</text>
    <rect x="176" y="76" width="528" height="100" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <circle cx="350" cy="102" r="13" fill="#303547"/>
    <path d="M328 142 A22 20 0 0 1 372 142 Z" fill="#303547"/>
    <text x="350" y="164" font-size="14" text-anchor="middle" fill="#303547" font-weight="600">tenant 1</text>
    <circle cx="619" cy="102" r="13" fill="#303547"/>
    <path d="M597 142 A22 20 0 0 1 641 142 Z" fill="#303547"/>
    <text x="619" y="164" font-size="14" text-anchor="middle" fill="#303547" font-weight="600">tenant 2</text>
    <rect x="176" y="188" width="170" height="98" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="186" y="208" font-size="12" fill="#303547">id = 1,</text>
    <text x="186" y="225" font-size="12" fill="#303547">payload={"group_id":</text>
    <text x="186" y="242" font-size="12" fill="#303547">  "tenant_1"},</text>
    <text x="186" y="259" font-size="12" fill="#303547">vector=</text>
    <text x="186" y="276" font-size="12" fill="#303547">  [0.9, 0.1, 0.1],</text>
    <rect x="176" y="294" width="170" height="36" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="186" y="309" font-size="12" fill="#303547">shard_key_selector=</text>
    <text x="186" y="324" font-size="12" fill="#303547">"canada",</text>
    <rect x="355" y="188" width="170" height="98" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="365" y="208" font-size="12" fill="#303547">id = 2,</text>
    <text x="365" y="225" font-size="12" fill="#303547">payload={"group_id":</text>
    <text x="365" y="242" font-size="12" fill="#303547">  "tenant_1"},</text>
    <text x="365" y="259" font-size="12" fill="#303547">vector=</text>
    <text x="365" y="276" font-size="12" fill="#303547">  [0.1, 0.9, 0.1],</text>
    <rect x="355" y="294" width="170" height="36" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="365" y="309" font-size="12" fill="#303547">shard_key_selector=</text>
    <text x="365" y="324" font-size="12" fill="#303547">"canada",</text>
    <rect x="534" y="188" width="170" height="98" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="544" y="208" font-size="12" fill="#303547">id = 3,</text>
    <text x="544" y="225" font-size="12" fill="#303547">payload={"group_id":</text>
    <text x="544" y="242" font-size="12" fill="#303547">  "tenant_2"},</text>
    <text x="544" y="259" font-size="12" fill="#303547">vector=</text>
    <text x="544" y="276" font-size="12" fill="#303547">  [0.1, 0.1, 0.9],</text>
    <rect x="534" y="294" width="170" height="36" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="544" y="309" font-size="12" fill="#303547">shard_key_selector=</text>
    <text x="544" y="324" font-size="12" fill="#303547">"germany",</text>
    <rect x="176" y="342" width="349" height="46" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="350.5" y="370" font-size="15" text-anchor="middle" fill="#303547">shard 1: canada</text>
    <rect x="534" y="342" width="170" height="46" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="619" y="370" font-size="15" text-anchor="middle" fill="#303547">shard 2: germany</text>
  </g>
</svg>
