<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">2D illustration of length renormalization: the quantized vector is short and slightly rotated, and multiplying it by the stored ratio puts it back on the circle of radius |x|. Angles and lengths are illustrative.</title>
<desc id="desc">Scaling x quantized by ratio = |x| / |x quantized| puts it back on the circle. The angular error stays, but the length error goes: the error against x drops from 48% to 24% of |x|. Angles and lengths are illustrative.</desc>
<rect width="760" height="380" rx="6" fill="#f0f3fa"/>
<g transform="translate(0 0) scale(1)">    <g>
<line x1="90" y1="350" x2="420" y2="350" stroke="rgb(48, 53, 71)" stroke-width="1.2px"/>
<line x1="90" y1="350" x2="90" y2="26" stroke="rgb(48, 53, 71)" stroke-width="1.2px"/>
<path d="M390 350 A300 300 0 0 0 90 50" fill="none" stroke="rgb(48, 53, 71)" stroke-dasharray="4px, 4px" stroke-width="1.4px"/>
<text x="382" y="370" fill="rgb(101, 107, 127)" font-family="monospace" font-size="15px">|x|</text>
<line x1="90" y1="350" x2="274.6984425976975" y2="113.5967739179834" stroke="rgb(48, 53, 71)" stroke-width="3px"/>
<circle cx="274.6984425976975" cy="113.5967739179834" r="5" fill="rgb(48, 53, 71)"/>
<text x="284.6984425976975" y="105.5967739179834" fill="rgb(48, 53, 71)" font-family="monospace" font-size="15px" font-weight="600">x</text>
<circle cx="90" cy="350" r="3" fill="rgb(48, 53, 71)"/>
<line x1="90" y1="350" x2="220.02177434510915" y2="248.4158565712664" stroke="rgb(101, 107, 127)" stroke-dasharray="5px, 4px" stroke-width="2.6px"/>
<circle cx="220.02177434510915" cy="248.4158565712664" r="5" fill="rgb(101, 107, 127)"/>
<line x1="274.6984425976975" y1="113.5967739179834" x2="220.02177434510915" y2="248.4158565712664" stroke="rgb(171, 177, 199)" stroke-dasharray="3px, 3px" stroke-width="1.4px"/>
<text x="230.02177434510915" y="268.41585657126643" fill="rgb(101, 107, 127)" font-family="monospace" font-size="15px" font-weight="600">x quantized</text>
<line x1="90" y1="350" x2="326.4032260820166" y2="165.30155740230254" stroke="rgb(220, 36, 76)" stroke-width="3px"/>
<circle cx="326.4032260820166" cy="165.30155740230254" r="5" fill="rgb(220, 36, 76)"/>
<line x1="274.6984425976975" y1="113.5967739179834" x2="326.4032260820166" y2="165.30155740230254" stroke="rgb(220, 36, 76)" stroke-dasharray="3px, 3px" stroke-width="1.4px"/>
<text x="340.4032260820166" y="169.30155740230254" fill="rgb(220, 36, 76)" font-family="monospace" font-size="15px" font-weight="600">ratio · x quantized</text>
</g>  </g>
</svg>
