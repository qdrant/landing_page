<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 338" role="img" aria-label="Two 1,000-token prompts filled with search results in rank order. With chunks of up to 128 tokens, eight chunks fit, about 965 tokens, and the chunk with the answer, ranked fifth, is included. With chunks of up to 510 tokens, only the first chunk of 480 tokens fits; the second, 530 tokens long and holding the answer, would exceed the budget, so the answer is not sent and about half the budget stays unused."><style>
  .qi-label { fill: #656b7f; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
  .qi-label--strong { fill: #303547; }
  .qi-label--small { font-size: 13px; }
  .qi-frame { fill: none; stroke: #abb1c7; stroke-width: 1.5; }
  .qi-chunk { fill: #d3d9eb; stroke: #ffffff; stroke-width: 2; }
  .qi-chunk--answer { fill: #00838f; }
  .qi-chunk--context { fill: #6047ff; }
  .qi-chunk--out { fill: none; stroke: #abb1c7; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .qi-unused { fill: url(#qi-hatch); stroke: none; }
  .qi-tick { stroke: #abb1c7; stroke-width: 1.5; }
  .qi-miss { stroke: #dc244c; stroke-width: 2.5; stroke-linecap: round; }
  .qi-axis { stroke: #abb1c7; stroke-width: 1.5; }
</style>
<defs><pattern id="qi-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d3d9eb" stroke-width="2"/></pattern></defs><rect x="0" y="0" width="760" height="330" fill="#ffffff"/><line class="qi-tick" x1="24.0" y1="286" x2="24.0" y2="296"/><line class="qi-axis" x1="24" y1="286" x2="684" y2="286"/><text class="qi-label qi-label--small" x="24.0" y="312" text-anchor="middle">0</text><line class="qi-tick" x1="189.0" y1="286" x2="189.0" y2="296"/><text class="qi-label qi-label--small" x="189.0" y="312" text-anchor="middle">250</text><line class="qi-tick" x1="354.0" y1="286" x2="354.0" y2="296"/><text class="qi-label qi-label--small" x="354.0" y="312" text-anchor="middle">500</text><line class="qi-tick" x1="519.0" y1="286" x2="519.0" y2="296"/><text class="qi-label qi-label--small" x="519.0" y="312" text-anchor="middle">750</text><line class="qi-tick" x1="684.0" y1="286" x2="684.0" y2="296"/><text class="qi-label qi-label--small" x="684.0" y="312" text-anchor="middle">1,000</text><text class="qi-label" x="354.0" y="328" text-anchor="middle">tokens of retrieved text in the prompt</text><text class="qi-label qi-label--strong" x="24" y="30">Chunks of up to 128 tokens · eight fit · the answer, ranked 5th, is sent</text><rect class="qi-chunk" x="24.0" y="60" width="79.2" height="40" rx="3"/><rect class="qi-chunk" x="103.2" y="60" width="84.5" height="40" rx="3"/><rect class="qi-chunk" x="187.7" y="60" width="72.6" height="40" rx="3"/><rect class="qi-chunk" x="260.3" y="60" width="82.5" height="40" rx="3"/><rect class="qi-chunk qi-chunk--answer" x="342.8" y="60" width="77.9" height="40" rx="3"/><rect class="qi-chunk" x="420.7" y="60" width="83.8" height="40" rx="3"/><rect class="qi-chunk" x="504.5" y="60" width="80.5" height="40" rx="3"/><rect class="qi-chunk" x="585.0" y="60" width="75.9" height="40" rx="3"/><rect class="qi-frame" x="24" y="60" width="660.0" height="40" rx="3"/><rect class="qi-unused" x="660.9" y="61" width="23.1" height="38"/><text class="qi-label qi-label--small" x="24" y="120">ranks 1 to 8 · 965 tokens sent · the 9th chunk would not fit</text><text class="qi-label qi-label--strong" x="24" y="170">Chunks of up to 510 tokens · one fits · the answer, ranked 2nd, is not sent</text><rect class="qi-chunk" x="24.0" y="200" width="316.8" height="40" rx="3"/><rect class="qi-frame" x="24" y="200" width="660.0" height="40" rx="3"/><rect class="qi-unused" x="340.8" y="201" width="343.2" height="38"/><rect class="qi-chunk--out" x="340.8" y="248" width="349.8" height="28" rx="3"/><text class="qi-label qi-label--small" x="348.8" y="267">rank 2 · 530 tokens · holds the answer</text><text class="qi-label qi-label--small" x="24" y="267">480 tokens sent</text></svg>
