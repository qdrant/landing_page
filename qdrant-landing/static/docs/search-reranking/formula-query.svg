<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
<title id="t">A formula query reorders the candidates of a prefetch</title>
<desc id="d">A prefetch returns 100 candidates with similarity scores. A formula adds boosts from payload fields, popularity and stock, to each score. The ranked list shows four sofas: the Leather sofa first at 1.00, the Velvet loveseat second at 0.98, the out-of-stock Linen 3-seater third at 0.88, and the Sectional fourth at 0.86. Scores are illustrative.</desc>
