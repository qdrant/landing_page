<svg xmlns="http://www.w3.org/2000/svg" width="420" height="370" viewBox="0 0 420 370" role="img" aria-labelledby="t d">
<title id="t">Three ways to rerank with Jev</title>
<desc id="d">Jev Score asks how relevant each doc is, grading every doc on its own from 0 to 2 in one request: A 1.8, B 0.3, C 1.5, D 1.1, so the ranking is A, C, D, B. Jev Choice asks once which doc is most relevant, judging all docs together: A 30%, B 5%, C 50%, D 15%, so the ranking is C, A, D, B. The two methods can rank the same docs differently. Jev Iterative asks the Choice question once per ranking position, removing each winner: C, then A, then D, using 10 requests for a top 10. The example is illustrative.</desc>
