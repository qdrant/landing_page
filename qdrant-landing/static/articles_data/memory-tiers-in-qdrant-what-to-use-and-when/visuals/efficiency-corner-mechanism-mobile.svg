<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 766" width="480" height="766" role="img" aria-labelledby="t d">
<title id="t">Search latency versus memory footprint</title>
<desc id="d">Conceptual scatter. Pinned quantized vectors sit in the efficient corner of low latency and low memory, at the same latency as full cached with no quantization but with far less memory. Full cold with no quantization is light but slow on cache misses. Full cold with quantization and full cached with quantization sit in between.</desc>
<style>
  text { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #303547; }
  .title { font-size: 23px; font-weight: 600; }
  .head { font-size: 21px; font-weight: 600; }
  .label { font-size: 21px; }
  .small { font-size: 20px; }
  .note { font-size: 19px; fill: #656b7f; }
  .muted { fill: #656b7f; }
  .axis { stroke: #abb1c7; stroke-width: 1.5; fill: none; }
</style>
<rect x="0.5" y="0.5" width="479" height="765" rx="12" fill="#f0f3fa" stroke="#d3d9eb"/>
<text class="title" x="24" y="42">Search latency versus</text>
<text class="title" x="24" y="70">memory footprint</text>
<text class="note" x="24" y="98">conceptual, not to scale</text>
<rect x="66" y="330" width="200" height="138" rx="8" fill="#b2ebf2"/>
<text class="small" x="78" y="356" style="fill:#006064;font-weight:600">efficient corner</text>
<text class="note" x="78" y="380" style="fill:#006064">fast and light</text>
<path d="M64 120 V470 H456" class="axis"/>
<text class="note" transform="translate(40 295) rotate(-90)" text-anchor="middle">search latency →</text>
<text class="note" x="260" y="504" text-anchor="middle">memory footprint →</text>
<line x1="126" x2="382" y1="418" y2="418" stroke="#656b7f" stroke-width="1.5" stroke-dasharray="5 5"/>
<text class="note" x="292" y="448" text-anchor="middle">same speed,</text>
<text class="note" x="292" y="470" text-anchor="middle">less memory</text>
<circle cx="111" cy="418" r="13" fill="#00838f"/>
<text x="111" y="424" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#ffffff">1</text>
<circle cx="40" cy="545" r="13" fill="#00838f"/>
<text x="40" y="551" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#ffffff">1</text>
<text class="small" x="64" y="552" style="font-weight:600">pinned quantized vectors</text>
<circle cx="397" cy="418" r="13" fill="#9c27b0"/>
<text x="397" y="424" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#ffffff">2</text>
<circle cx="40" cy="583" r="13" fill="#9c27b0"/>
<text x="40" y="589" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#ffffff">2</text>
<text class="small" x="64" y="590">full cached, no quantization</text>
<circle cx="103" cy="172" r="13" fill="#dc244c"/>
<text x="103" y="178" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#ffffff">3</text>
<circle cx="40" cy="621" r="13" fill="#dc244c"/>
<text x="40" y="627" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#ffffff">3</text>
<text class="small" x="64" y="628">full cold, no quantization</text>
<text class="note" x="64" y="654">light, but slow on cache misses</text>
<circle cx="241" cy="313" r="13" fill="#abb1c7"/>
<text x="241" y="319" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#303547">4</text>
<circle cx="40" cy="677" r="13" fill="#abb1c7"/>
<text x="40" y="683" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#303547">4</text>
<text class="small" x="64" y="684">full cold, with quantization</text>
<circle cx="425" cy="278" r="13" fill="#abb1c7"/>
<text x="425" y="284" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#303547">5</text>
<circle cx="40" cy="715" r="13" fill="#abb1c7"/>
<text x="40" y="721" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#303547">5</text>
<text class="small" x="64" y="722">full cached, with quantization</text>
</svg>
