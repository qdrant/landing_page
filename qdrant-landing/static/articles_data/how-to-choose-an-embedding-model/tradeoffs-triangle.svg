<svg xmlns="http://www.w3.org/2000/svg" width="640" height="288" viewBox="0 0 640 288" role="img" aria-labelledby="title desc">
  <title id="title">Fast, precise, cheap: a model-selection tradeoff</title>
  <desc id="desc">A triangle connects Fast, Precise, and Cheap. Pick two? appears at its center as a heuristic.</desc>
  <defs>
    <style>@font-face{font-family:Geist Mono;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media(max-width:480px){text{font-size:22px}.small{font-size:20px}}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M1 1 L9 5 L1 9" fill="none" stroke="#656b7f" stroke-width="1.5"/>
  </marker>
  </defs>
  <rect x="0.5" y="0.5" width="639" height="287" rx="6" fill="#f0f3fa" stroke="#d3d9eb" stroke-width="1"/>
  <path d="M320 56 L144 232 H496 Z" fill="none" stroke="#656b7f" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="320" cy="56" r="5" fill="#6047ff"/>
  <circle cx="144" cy="232" r="5" fill="#00838f"/>
  <circle cx="496" cy="232" r="5" fill="#dc244c"/>
  <text x="320" y="35" font-size="16" fill="#303547" text-anchor="middle">Fast</text>
  <text x="144" y="265" font-size="16" fill="#303547" text-anchor="middle">Cheap</text>
  <text x="496" y="265" font-size="16" fill="#303547" text-anchor="middle">Precise</text>
  <text x="320" y="175" font-size="18" fill="#303547" text-anchor="middle">Pick two?</text>
</svg>
