name: Check Content Images

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-content-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check front matter image references
        run: bash automation/check-content-images.sh
