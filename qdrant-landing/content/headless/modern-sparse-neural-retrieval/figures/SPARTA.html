<figure class="snr-figure" id="snr-sparta" aria-labelledby="snr-title-12">
<div class="snr-heading"><span class="snr-title" id="snr-title-12">SPARTA</span><span class="snr-kind">Internal document expansion</span></div>
<div class="snr-lanes snr-aligned"><div class="snr-lane"><div class="snr-box snr-doc"><span class="snr-label">Document 42</span><div class="snr-tokens"><span class="snr-token"><span>Qdrant</span></span><span class="snr-token"><span>is</span></span><span class="snr-token"><span>a</span></span><span class="snr-token"><span>vector</span></span><span class="snr-token"><span>database</span></span></div></div><div class="snr-arrow" aria-hidden="true"></div><div class="snr-box snr-model"><span class="snr-label">BERT contextual encoding</span><div class="snr-tokens"><span class="snr-token"><span>Q</span></span><span class="snr-token"><span>dra</span></span><span class="snr-token"><span>nt</span></span><span class="snr-token"><span>is</span></span><span class="snr-token"><span>a</span></span><span class="snr-token"><span>vector</span></span><span class="snr-token"><span>database</span></span></div><p class="snr-note">Context vector h<sub>t</sub> per document token</p></div></div><div class="snr-lane"><div class="snr-box snr-"><span class="snr-label">BERT vocabulary · 30,522 tokens</span><p class="snr-note">All tokens v, including terms absent from the document.</p></div><div class="snr-arrow" aria-hidden="true"></div><div class="snr-box snr-model"><span class="snr-label">BERT embedding layer</span><p class="snr-note">Non-contextual vector e<sub>v</sub> per vocabulary token</p></div></div></div><div class="snr-join" aria-hidden="true"><div class="snr-arrow" aria-hidden="true"></div></div><div class="snr-box snr-op"><span class="snr-label">Internal document expansion</span><div class="snr-coil-score"><div class="snr-box snr-"><span class="snr-label">1 · Dot product</span><div class="snr-math">e<sub>v</sub> · h<sub>t</sub></div><p class="snr-note">Every v against every document token t</p></div><div class="snr-box snr-"><span class="snr-label">2 · Max over document tokens</span><div class="snr-math">m<sub>v</sub> = max<sub>t</sub> e<sub>v</sub> · h<sub>t</sub></div></div><div class="snr-box snr-"><span class="snr-label">3 · Threshold + log</span><div class="snr-math">d<sub>v</sub> = log(1 + ReLU(m<sub>v</sub> + bias))</div></div></div></div><div class="snr-lanes snr-sparta-matching"><div class="snr-lane"><div class="snr-arrow" aria-hidden="true"></div><div class="snr-box snr-doc"><span class="snr-label">Document · selected vocabulary slots</span><div class="snr-tokens"><span class="snr-token snr-hit snr-added"><span>What</span><span class="snr-weight">0.8</span></span><span class="snr-token"><span>is</span><span class="snr-weight">0</span></span><span class="snr-token"><span>Q</span><span class="snr-weight">0</span></span><span class="snr-token"><span>dra</span><span class="snr-weight">0</span></span><span class="snr-token snr-hit"><span>nt</span><span class="snr-weight">0.1</span></span></div></div></div><div class="snr-lane"><div class="snr-box snr-query"><span class="snr-label">Query · unexpanded binary vector</span><p class="snr-note">What is Qdrant</p><div class="snr-tokens"><span class="snr-token"><span>What</span><span class="snr-weight">1</span></span><span class="snr-token"><span>is</span><span class="snr-weight">1</span></span><span class="snr-token"><span>Q</span><span class="snr-weight">1</span></span><span class="snr-token"><span>dra</span><span class="snr-weight">1</span></span><span class="snr-token"><span>nt</span><span class="snr-weight">1</span></span></div><p class="snr-note">30,522 slots; other slots: 0.</p></div></div></div><div class="snr-join" aria-hidden="true"><div class="snr-arrow" aria-hidden="true"></div></div><div class="snr-box snr-op"><span class="snr-label">Select weights at query-token slots</span><div class="snr-products"><div class="snr-product"><strong>What</strong><span class="snr-math">1 × 0.8</span></div><div class="snr-product"><strong>nt</strong><span class="snr-math">1 × 0.1</span></div></div><div class="snr-total">Σ selected weights = <strong>0.9</strong></div></div>
<figcaption class="snr-caption">The document expands across the vocabulary; the binary query bypasses expansion. Max similarity precedes the threshold and log transform. Selected weights and the score are illustrative.</figcaption>
</figure>
