    <text x="32" y="202" font-size="13" fill="#656b7f">Java</text>
    <text x="32" y="224" font-size="13" fill="#656b7f">C#</text>
    <path d="M128 150 H148" fill="none" stroke="#656b7f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="152" y="12" width="472" height="276" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="168" y="36" font-size="14" fill="#303547" font-weight="600">Qdrant</text>
    <rect x="168" y="52" width="136" height="62" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="184" y="78" font-size="14" fill="#303547">collection_a</text>
    <text x="184" y="99" font-size="13" fill="#656b7f">Cosine</text>
