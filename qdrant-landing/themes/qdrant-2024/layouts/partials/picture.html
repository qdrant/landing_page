{{- $src := .src -}}
{{- $alt := .alt | default "" -}}
{{- $ext := path.Ext $src -}}

{{- if eq $ext ".svg" -}}
  <img
    src="{{ $src }}"
    alt="{{ $alt }}"
    {{- with .class }}class="{{ . }}"{{ end -}}
    {{- with .loading }}loading="{{ . }}"{{ end -}}
    {{- with .decoding }}decoding="{{ . }}"{{ end -}}
    {{- with .width }}width="{{ . }}"{{ end -}}
    {{- with .height }}height="{{ . }}"{{ end -}}
  />
{{- else -}}
  {{- $webpSrc := replace $src $ext ".webp" -}}
  <picture>
    {{- with .mobileSrc -}}
      {{- $mobileMedia := $.mobileMedia | default "(max-width: 991.98px)" -}}
      <source srcset="{{ replace . (path.Ext .) ".webp" }}" media="{{ $mobileMedia }}" type="image/webp" />
      <source srcset="{{ . }}" media="{{ $mobileMedia }}" />
    {{- end -}}
    <source srcset="{{ $webpSrc }}" type="image/webp" />
    <img
      src="{{ $src }}"
      alt="{{ $alt }}"
      {{- with .class }}class="{{ . }}"{{ end -}}
      {{- with .loading }}loading="{{ . }}"{{ end -}}
      {{- with .decoding }}decoding="{{ . }}"{{ end -}}
      {{- with .fetchpriority }}fetchpriority="{{ . }}"{{ end -}}
      {{- with .width }}width="{{ . }}"{{ end -}}
      {{- with .height }}height="{{ . }}"{{ end -}}
    />
  </picture>
{{- end -}}
