<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 732 228" aria-label="Default cached dense vectors compete for RAM at scale. With memory set to cold, vectors are stored on disk from the start and RAM stays free for search."><style>
  .qi-label { fill: #656b7f; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .qi-label--strong { fill: #303547; }
  .qi-frame { fill: #f0f3fa; stroke: #d3d9eb; stroke-width: 1; }
  .qi-bk__box--risk { stroke: #dc244c; stroke-width: 1.5; }
  .qi-bk__box--good { stroke: #00838f; stroke-width: 1.5; }
  .qi-bk__wire { fill: none; stroke-width: 2; }
  .qi-bk__wire--risk { stroke: #dc244c; } .qi-bk__wire--good { stroke: #00838f; } .qi-bk__wire--neutral { stroke: #abb1c7; }
  .qi-bk__head--risk { fill: #dc244c; } .qi-bk__head--good { fill: #00838f; } .qi-bk__head--neutral { fill: #abb1c7; }
  .qi-bk__caption--risk { fill: #dc244c; } .qi-bk__caption--good { fill: #00838f; }
  </style><rect x="-16" y="-16" width="732" height="228" fill="#ffffff"/><defs><marker id="bk-bulk-memory-w-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="qi-bk__head--risk"/></marker><marker id="bk-bulk-memory-w-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="qi-bk__head--good"/></marker><marker id="bk-bulk-memory-w-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="qi-bk__head--neutral"/></marker></defs><text class="qi-label qi-bk__caption--risk" x="0" y="16">Default: memory cached</text><rect class="qi-frame qi-bk__box qi-bk__box--neutral" x="0" y="26" width="200" height="56" rx="6"/><text class="qi-label" x="100" y="50" text-anchor="middle">Incoming</text><text class="qi-label" x="100" y="66" text-anchor="middle">dense vectors</text><path class="qi-bk__wire qi-bk__wire--risk" d="M202 54 H247" marker-end="url(#bk-bulk-memory-w-risk)"/><rect class="qi-frame qi-bk__box qi-bk__box--neutral" x="250" y="26" width="200" height="56" rx="6"/><text class="qi-label" x="350" y="50" text-anchor="middle">Cached in RAM</text><text class="qi-label" x="350" y="66" text-anchor="middle">as vectors load</text><path class="qi-bk__wire qi-bk__wire--risk" d="M452 54 H497" marker-end="url(#bk-bulk-memory-w-risk)"/><rect class="qi-frame qi-bk__box qi-bk__box--risk" x="500" y="26" width="200" height="56" rx="6"/><text class="qi-label qi-label--strong" x="600" y="50" text-anchor="middle">RAM pressure</text><text class="qi-label" x="600" y="66" text-anchor="middle">at scale</text><text class="qi-label qi-bk__caption--good" x="0" y="114">memory: cold</text><rect class="qi-frame qi-bk__box qi-bk__box--neutral" x="0" y="124" width="200" height="56" rx="6"/><text class="qi-label" x="100" y="148" text-anchor="middle">Incoming</text><text class="qi-label" x="100" y="164" text-anchor="middle">dense vectors</text><path class="qi-bk__wire qi-bk__wire--good" d="M202 152 H247" marker-end="url(#bk-bulk-memory-w-good)"/><rect class="qi-frame qi-bk__box qi-bk__box--neutral" x="250" y="124" width="200" height="56" rx="6"/><text class="qi-label" x="350" y="148" text-anchor="middle">Stored on disk</text><text class="qi-label" x="350" y="164" text-anchor="middle">from the start</text><path class="qi-bk__wire qi-bk__wire--good" d="M452 152 H497" marker-end="url(#bk-bulk-memory-w-good)"/><rect class="qi-frame qi-bk__box qi-bk__box--good" x="500" y="124" width="200" height="56" rx="6"/><text class="qi-label qi-label--strong" x="600" y="148" text-anchor="middle">RAM stays free</text><text class="qi-label" x="600" y="164" text-anchor="middle">for search</text></svg>
