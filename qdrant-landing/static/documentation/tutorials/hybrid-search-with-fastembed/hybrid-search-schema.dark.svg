  <rect x="280" y="374" width="160" height="44" rx="8" fill="#dc244c" stroke="#dc244c" stroke-width="2"/>
  <text x="360" y="402" fill="#ffffff" text-anchor="middle" font-family="'Mona Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Fusion</text>
  <path d="M360 418 V440" fill="none" stroke="#898ea3" stroke-width="2" stroke-linejoin="round"/><path d="M354 431 L360 440 L366 431 Z" fill="#898ea3"/>
  <rect x="240" y="442" width="240" height="48" rx="8" fill="#1d293b" stroke="#f0f3fa" stroke-width="2"/>
  <text x="360" y="472" fill="#e2e7f5" text-anchor="middle" font-family="'Mona Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Hybrid Search Result</text>
</svg>
