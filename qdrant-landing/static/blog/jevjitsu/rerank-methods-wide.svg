<rect x="10" y="76" width="640" height="144" rx="8" fill="#ffffff" stroke="#d3d9eb" stroke-width="1.5"/>
<rect x="24" y="90" width="62" height="26" rx="13" fill="none" stroke="#dc244c" stroke-width="1.5"/><text x="55" y="108" text-anchor="middle" fill="#dc244c">Score</text><text x="98" y="110" font-size="20" font-weight="700">Jev Score</text><g fill="#656b7f"><text x="24" y="140">Grades each candidate on a fixed</text><text x="24" y="160">scale of relevance levels.</text></g><text x="24" y="188" fill="#656b7f">Ranked: <tspan font-weight="700" fill="#303547">C, A, D, B</tspan></text><text x="24" y="208" fill="#656b7f">1 request · one question per candidate</text>
