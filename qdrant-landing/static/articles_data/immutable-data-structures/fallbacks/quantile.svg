<title id="title">Scalar quantization bounds. The quantile sets the bounds, the quantization levels are spread evenly between them, and the extreme values outside are clamped. The curve is a normal distribution, and 8 of the 256 levels are drawn.</title>
<desc id="desc">With quantile = 0.99, the bounds sit at ±2.58σ for a normal distribution and 1% of the values fall outside and are clamped. Spread over 256 levels, each step is 0.020σ wide (8 levels are drawn).</desc>
