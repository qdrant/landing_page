      <path d="M0 0 L10 5 L0 10 Z" fill="#656b7f"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="639" height="227" rx="6" fill="#f0f3fa" stroke="#d3d9eb" stroke-width="1"/>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="20" y="20" width="600" height="188" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="36" y="44" font-size="14" fill="#303547" font-weight="600">collection</text>
    <rect x="36" y="60" width="276" height="132" rx="6" fill="none" stroke="#abb1c7" stroke-width="1.5"/>
    <text x="52" y="84" font-size="14" fill="#303547">Shard 1</text>
