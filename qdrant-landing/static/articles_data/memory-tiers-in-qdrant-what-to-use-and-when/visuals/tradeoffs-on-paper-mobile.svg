<text class="note" x="44" y="381">memory cost</text>
<rect x="186.0" y="358" width="174.2" height="32" rx="16.0" fill="#ffffff" stroke="#abb1c7"/><text x="273.1" y="380.6" text-anchor="middle" style="font-size:19px;fill:#303547">Opportunistic</text>
<rect x="24" y="416" width="432" height="182" rx="10" fill="#ffffff" stroke="#d3d9eb"/>
